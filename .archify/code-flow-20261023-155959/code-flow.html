e_dim, hidden_dim, action_dim, action_low,","                 action_high, actor_lr, critic_lr, lmbda, epochs, eps, gamma,","                 reward_shift, reward_scale, device):","        self.actor = PolicyNetContinuous(","            state_dim, hidden_dim, action_dim, action_low, action_high","        ).to(device)","        self.critic = ValueNet(state_dim, hidden_dim).to(device)","        self.actor_optimizer = torch.optim.Adam(","            self.actor.parameters(), lr=actor_lr","        )","        self.critic_optimizer = torch.optim.Adam(","            self.critic.parameters(), lr=critic_lr","        )","        self.action_low = torch.as_tensor(","            action_low, dtype=torch.float32, device=device","        )","        self.action_high = torch.as_tensor(","            action_high, dtype=torch.float32, device=device","        )","        self.gamma = gamma","        self.lmbda = lmbda","        self.epochs = epochs","        self.eps = eps","        self.reward_shift = reward_shift","        self.reward_scale = reward_scale","        self.device = device","","    @staticmethod","    def _distribution(actor, states):","        # mean/std 的形状都是 [batch_size, action_dim]。","        mean, std = actor(states)","        return torch.distributions.Normal(mean, std)","","    def take_action(self, state):","        state = torch.as_tensor(","            np.asarray(state), dtype=torch.float32, device=self.device","        ).unsqueeze(0)","        # 保存策略实际采样动作，不能先 clamp 后再计算 log probability，","        # 否则 old_log_probs 与实际采样分布不一致，PPO ratio 会失真。","        action = self._distribution(self.actor, state).sample()","        # 保留策略实际采样的动作，保证old_log_probs与动作一致。","        # Pendulum环境会在执行时将动作限制到合法范围。","        return action.squeeze(0).detach().cpu().numpy()","","    @staticmethod","    def _log_probs(actor, states, actions):","        # Normal 对每个动作维度分别给出 log_prob；联合动作概率是各维度之和。","        log_probs = PPOContinuous._distribution(actor, states).log_prob(actions)","        return log_probs.sum(dim=-1, keepdim=True)","","    def update(self, transition_dict):","        # 连续动作 actions 的形状通常为 [T, action_dim]，不能按离散动作转成long。","        states = torch.as_tensor(","            np.asarray(transition_dict['states']),","            dtype=torch.float32,","            device=self.device,","        )","        actions = torch.as_tensor(","            np.asarray(transition_dict['actions']),","            dtype=torch.float32,","            device=self.device,","        )","        rewards = torch.as_tensor(","            transition_dict['rewards'],","            dtype=torch.float32,","            device=self.device,","        ).view(-1, 1)","        next_states = torch.as_tensor(","            np.asarray(transition_dict['next_states']),","            dtype=torch.float32,","            device=self.device,","        )","        dones = torch.as_tensor(","            transition_dict['dones'],","            dtype=torch.float32,","            device=self.device,","        ).view(-1, 1)","","        # Pendulum reward 数值较大且为负，缩放只用于 critic 的训练目标；","        # return_list 仍然记录环境原始 reward，方便和教程比较。","        scaled_rewards = (rewards + self.reward_shift) / self.reward_scale","        td_target = scaled_rewards + self.gamma * self.critic(next_states) * (1 - dones)","        td_delta = td_target - self.critic(states)","","        # advantage 与 ratio 都保持 [T, 1]，避免广播成 [T, T]。","        advantage = rl_utils.compute_advantage(","            self.gamma, self.lmbda, td_delta","        ).to(self.device).unsqueeze(1)","        # old policy 是采样这批数据时的策略；detach 后固定不变。","        old_log_probs = self._log_probs(","            self.actor, states, actions","        ).detach()","","        for _ in range(self.epochs):","            log_probs = self._log_probs(self.actor, states, actions)","            # ratio 比较新旧策略对同一个已采样动作的概率。","            ratio = torch.exp(log_probs - old_log_probs)","            clipped_ratio = torch.clamp(ratio, 1 - self.eps, 1 + self.eps)","            # P ,{"kind":"类","kc":"cls","name":"PolicyNetContinuous","line":"5-29","logic":"连续动作策略网络，输出正态分布的均值与标准差，并把 tanh 输出映射到环境动作区间。","srcStart":5,"src":["class PolicyNetContinuous(torch.nn.Module):","    \"\"\"连续动作策略网络。","","    actor 不直接输出一个动作，而是输出 Normal 分布的 mean 和 std，","    再从这个分布中采样动作。这样策略本身仍然是随机策略。","    \"\"\"","","    def __init__(self, state_dim, hidden_dim, action_dim, action_low, action_high):","        super().__init__()","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc_mu = torch.nn.Linear(hidden_dim, action_dim)","        self.fc_std = torch.nn.Linear(hidden_dim, action_dim)","        # 将 tanh 的 [-1, 1] 输出映射到环境动作区间 [low, high]。","        action_low = torch.as_tensor(action_low, dtype=torch.float32)","        action_high = torch.as_tensor(action_high, dtype=torch.float32)","        self.register_buffer('action_scale', (action_high - action_low) / 2)","        self.register_buffer('action_bias', (action_high + action_low) / 2)","","    def forward(self, states):","        # states: [batch_size, state_dim]","        features = F.relu(self.fc1(states))","        # tanh 保证均值落在动作范围内；softplus 保证标准差为正。","        mu = self.action_bias + self.action_scale * torch.tanh(self.fc_mu(features))","        std = F.softplus(self.fc_std(features)) + 1e-5","        return mu, std"],"pseudo":""},{"kind":"方法","kc":"method","name":"PolicyNetContinuous.__init__","line":"12-21","logic":"建立 fc1、fc_mu、fc_std 三个线性层，并把 action_low/high 换算成 register_buffer 的 action_scale=(high-low)/2 与 action_bias=(high+low)/2。","srcStart":12,"src":["    def __init__(self, state_dim, hidden_dim, action_dim, action_low, action_high):","        super().__init__()","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc_mu = torch.nn.Linear(hidden_dim, action_dim)","        self.fc_std = torch.nn.Linear(hidden_dim, action_dim)","        # 将 tanh 的 [-1, 1] 输出映射到环境动作区间 [low, high]。","        action_low = torch.as_tensor(action_low, dtype=torch.float32)","        action_high = torch.as_tensor(action_high, dtype=torch.float32)","        self.register_buffer('action_scale', (action_high - action_low) / 2)","        self.register_buffer('action_bias', (action_high + action_low) / 2)"],"pseudo":""},{"kind":"方法","kc":"method","name":"PolicyNetContinuous.forward","line":"23-29","logic":"ReLU 过 fc1 得特征，均值 mu = bias + scale*tanh(fc_mu(features)) 落入动作区间，标准差 std = softplus(fc_std(features))+1e-5 保证为正，返回 (mu, std)。","srcStart":23,"src":["    def forward(self, states):","        # states: [batch_size, state_dim]","        features = F.relu(self.fc1(states))","        # tanh 保证均值落在动作范围内；softplus 保证标准差为正。","        mu = self.action_bias + self.action_scale * torch.tanh(self.fc_mu(features))","        std = F.softplus(self.fc_std(features)) + 1e-5","        return mu, std"],"pseudo":"h = relu(fc1(s)); h = relu(fc2(h))\nmu = tanh(mu_head(h))\nsigma = softplus(sigma_head(h)) + 1e-5\nreturn mu, sigma"},{"kind":"类","kc":"cls","name":"ValueNet","line":"32-42","logic":"连续 PPO 使用的状态价值网络，只评价状态本身，输出 V(s)。","srcStart":32,"src":["class ValueNet(torch.nn.Module):","    \"\"\"连续动作 PPO 使用的状态价值网络 V(s)。\"\"\"","","    def __init__(self, state_dim, hidden_dim):","        super().__init__()","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, 1)","","    def forward(self, states):","        # 输出 [batch_size, 1]，不依赖具体动作，只评价状态本身。","        return self.fc2(F.relu(self.fc1(states)))"],"pseudo":""},{"kind":"方法","kc":"method","name":"ValueNet.__init__","line":"35-38","logic":"建立 state_dim→hidden_dim 的 fc1 与 hidden_dim→1 的 fc2。","srcStart":35,"src":["    def __init__(self, state_dim, hidden_dim):","        super().__init__()","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, 1)"],"pseudo":""},{"kind":"方法","kc":"method","name":"ValueNet.forward","line":"40-42","logic":"fc1 后接 ReLU 再经 fc2，返回形状 [B, 1] 的状态价值。","srcStart":40,"src":["    def forward(self, states) mbda * advantage + delta","        advantage_list.append(advantage)","    advantage_list.reverse()","    return torch.from_numpy(np.asarray(advantage_list, dtype=np.float32))"],"pseudo":"adv = 0\nfor t = T-1 ... 0:\n    adv = td_delta[t] + gamma * lambda * adv\n    advantage[t] = adv\nreturn advantage"}],"stages":[1],"classGroups":[],"funcIdxs":[1,2],"entryIdxs":[],"constIdx":0},{"path":"08_PPO/Pendulum/trainer.py","rootId":"08","rootDir":"08_PPO","name":"trainer.py","dir":"08_PPO/Pendulum","purpose":"实现连续 PPO 的 on-policy 训练循环，采集完整 episode 后更新并统计回报。","lines":38,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-2","logic":"导入 numpy 与 tqdm 进度条，无模块级常量。","srcStart":1,"src":["import numpy as np","from tqdm import tqdm"],"pseudo":""},{"kind":"函数","kc":"func","name":"train_on_policy_agent","line":"5-38","logic":"对每个 episode 先 env.reset() 取 state，循环直到 terminated/truncated：agent.take_action 返回连续动作向量、env.step 得五元组，并把转移累积到 transition_dict；episode 结束后 agent.update 更新，记录 episode_return，每 10 个 episode 用 tqdm 显示最近 10 次平均回报，最后返回 return_list。","srcStart":5,"src":["def train_on_policy_agent(env, agent, num_episodes):","    \"\"\"用当前策略采集完整 episode，再进行 PPO 更新。\"\"\"","    return_list = []","    with tqdm(total=num_episodes, desc='Training') as progress:","        for episode in range(num_episodes):","            state, _ = env.reset()","            done = False","            episode_return = 0.0","            transition_dict = {","                'states': [], 'actions': [], 'next_states': [],","                'rewards': [], 'dones': [],","            }","            while not done:","                # 连续策略返回形如 [action_dim] 的浮点动作向量。","                action = agent.take_action(state)","                next_state, reward, terminated, truncated, _ = env.step(action)","                done = terminated or truncated","                # PPO 保存实际采样出的 action，后续用它计算 old_log_probs。","                transition_dict['states'].append(state)","                transition_dict['actions'].append(action)","                transition_dict['next_states'].append(next_state)","                transition_dict['rewards'].append(reward)","                transition_dict['dones'].append(done)","                state = next_state","                episode_return += reward","            agent.update(transition_dict)","            return_list.append(episode_return)","            if (episode + 1) % 10 == 0:","                progress.set_postfix({","                    'episode': episode + 1,","                    'return': '%.3f' % np.mean(return_list[-10:]),","                })","            progress.update(1)","    return return_list"],"pseudo":"for episode in 1 ... num_episodes:\n    rollout = []\n    s = env.reset()\n    done = False\n    while not done:\n        a = agent.take_action(s)\n        s2, r, terminated, truncated, _ = env.step(a)\n        done = terminated or truncated\n        rollout.append((s, a, r, s2, terminated))\n        s = s2\n    agent.update(rollout)"}],"stages":[1],"classGroups":[],"funcIdxs":[1],"entryIdxs":[],"constIdx":0},{"path":"08_PPO/Pendulum/visualization.py","rootId":"08","rootDir":"08_PPO","name":"visualization.py","dir":"08_PPO/Pendulum","purpose":"绘制 Pendulum 训练的原始回报与窗口 21 的滑动平均回报。","lines":20,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-3","logic":"导入 matplotlib.pyplot 与 rl_utils.moving_average，无模块级常量。","srcStart":1,"src":["import matplotlib.pyplot as plt","","from rl_utils import moving_average"],"pseudo":""},{"kind":"函数","kc":"func","name":"plot_training_results","line":"6-20","logic":"在 1x2 子图中分别绘制逐 episode 的原始回报和 moving_average(return_list, 21) 的平滑回报，设置坐标轴标签与标题后 tight_layout 并 plt.show()。","srcStart":6,"src":["def plot_training_results(return_list, env_name):","    episodes = list(range(len(return_list)))","    plt.figure(figsize=(10, 4))","    plt.subplot(1, 2, 1)","    plt.plot(episodes, return_list)","    plt.xlabel('Episodes')","    plt.ylabel('Returns' dim, len(action_low))","        low = torch.as_tensor(action_low, dtype=torch.float32)","        high = torch.as_tensor(action_high, dtype=torch.float32)","        self.register_buffer('action_scale', (high - low) / 2)","        self.register_buffer('action_bias', (high + low) / 2)"],"pseudo":""},{"kind":"方法","kc":"method","name":"Actor.forward","line":"17-19","logic":"对状态做 ReLU 隐层后接 tanh 得到 [-1,1] 输出，再按 action_bias + action_scale*tanh 映射到动作区间。","srcStart":17,"src":["    def forward(self, states):","        hidden = F.relu(self.fc1(states))","        return self.action_bias + self.action_scale * torch.tanh(self.fc2(hidden))"],"pseudo":"h = relu(W1 s + b1)\nh = relu(W2 h + b2)\nu = tanh(W3 h + b3)\nreturn action_bias + action_scale * u"},{"kind":"类","kc":"cls","name":"Critic","line":"22-35","logic":"Q(s,a) 价值网络，接收状态与动作并输出标量价值。","srcStart":22,"src":["class Critic(torch.nn.Module):","    \"\"\"将状态和连续动作拼接后估计Q(s,a)。\"\"\"","","    def __init__(self, state_dim, hidden_dim, action_dim):","        super().__init__()","        self.fc1 = torch.nn.Linear(state_dim + action_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, hidden_dim)","        self.fc_out = torch.nn.Linear(hidden_dim, 1)","","    def forward(self, states, actions):","        features = torch.cat([states, actions], dim=1)","        features = F.relu(self.fc1(features))","        features = F.relu(self.fc2(features))","        return self.fc_out(features)"],"pseudo":""},{"kind":"方法","kc":"method","name":"Critic.__init__","line":"25-29","logic":"第一层输入维度为 state_dim+action_dim，第二层为 hidden_dim→hidden_dim，最后 fc_out 输出 1 维。","srcStart":25,"src":["    def __init__(self, state_dim, hidden_dim, action_dim):","        super().__init__()","        self.fc1 = torch.nn.Linear(state_dim + action_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, hidden_dim)","        self.fc_out = torch.nn.Linear(hidden_dim, 1)"],"pseudo":""},{"kind":"方法","kc":"method","name":"Critic.forward","line":"31-35","logic":"沿特征维拼接状态与动作，经过两层 ReLU 隐层后由 fc_out 返回 Q 值。","srcStart":31,"src":["    def forward(self, states, actions):","        features = torch.cat([states, actions], dim=1)","        features = F.relu(self.fc1(features))","        features = F.relu(self.fc2(features))","        return self.fc_out(features)"],"pseudo":"x = concat(s, a)\nh = relu(W1 x + b1)\nh = relu(W2 h + b2)\nreturn W3 h + b3"}],"stages":[2,3],"classGroups":[{"classIdx":1,"methodIdxs":[2,3]},{"classIdx":4,"methodIdxs":[5,6]}],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"09_DDPG/CartPole/noise.py","rootId":"09","rootDir":"09_DDPG","name":"noise.py","dir":"09_DDPG/CartPole","purpose":"提供 DDPG 探索用的高斯噪声和 Ornstein-Uhlenbeck 噪声两种实现。","lines":34,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1","logic":"仅导入 numpy；无模块级常量。","srcStart":1,"src":["import numpy as np"],"pseudo":""},{"kind":"类","kc":"cls","name":"NormalNoise","line":"4-15","logic":"每一步独立采样的高斯噪声生成器。","srcStart":4,"src":["class NormalNoise:","    \"\"\"每一步独立采样的高斯噪声。\"\"\"","","    def __init__(self, action_dim, sigma):","        self.action_dim = action_dim","        self.sigma = sigma","","    def reset(self):","        pass","","    def sample(self):","        return self.sigma * np.random.randn(self.action_dim)"],"pseudo":""},{"kind":"方法","kc":"method","name":"NormalNoise.__init__","line":"7-9","logic":"保存动作维度和噪声标准差 sigma。","srcStart":7,"src":["    def __init__(self, action_dim, sigma):","        self.action_dim = action_dim","        self.sigma = sigma"],"pseudo":""},{"kind":"方法","kc":"method","name":"NormalNoise.reset","line":"11-12","logic":"空实现，仅为与其他噪声类保持统一接口。","srcStart":11,"src":["    def reset(self):","        pass"],"pseudo":""},{"kind":"方法","kc":"method","name":"NormalNoise.sample","line":"14-15","logic":"返回 sigma * randn(action_dim) 的独立高斯噪声向量。","srcStart":14,"src":["    def sample(self):","        return self.sigma * np.random.randn(self.action_dim)"],"pseudo":"return sigma * randn(action_dim)"},{"kind":"类","kc":"cls","name":"OUNoise","line":"18-34","logic":"带时间相关性的 Ornstein-Uhlenbeck 噪声，维护跨步的噪声状态。","srcStart":18,"src":["class OUNoise:","    \"\"\"带时间相关性的 Ornstein-Uhlenbeck 噪声。\"\"\"","","    def __init__(self, action_dim, sigma, theta=0.15, mu=0.0):","        self.action_dim = action_dim","        self.sigma = sigma","        self.theta = theta","        self.mu = mu","        self.state = np.zeros(action_dim, dtype=np.float32)","","    def reset(self):","        self.state.fill(0.0)","","    def sample(self):","        random_part = self.sigma * np.random.randn(self.action_dim)","        self.state = self.state + self.theta * (self.mu - self.state) + random_part","        return self.state.copy()"],"pseudo":""},{"kind":"方法","kc":"method","name":"OUNoise.__init__","line":"21-26","logic":"保存 action_dim、sigma、theta、mu，并把内部状态初始化为零向量。","srcStart":21,"src":["    def __init__(self, action_dim, sigma, theta=0.15, mu=0.0):","        self.action_dim = action_dim","        self.sigma = sigma","        self.theta = theta","        self.mu = mu","        self.state = np.zeros(action_dim, dtype=np.float32)"],"pseudo":""},{"kind":"方法","kc":"method","name":"OUNoise.reset","line":"28-29","logic":"将内部状态原地清零，用于每回合重新开始。","srcStart":28,"src":["    def reset(self):","        self.state.fill(0.0)"],"pseudo":""},{"kind":"方法","kc":"method","name":"OUNoise.sample","line":"31-34","logic":"按 state += theta*(mu-state) + sigma*randn 更新噪声状态，并返回其副本。","srcStart":31,"src":["    def sample(self):","        random_part = self.sigma * np.random.randn(self.action_dim)","        self.state = self.state + self.theta * (self.mu - self.state) + random_part","        return self.state.copy()"],"pseudo":"x = x + theta * (mu - x) + sigma * randn(action_dim)\nreturn x"}],"stages":[4,3],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4]},{"classIdx":5,"methodIdxs":[6,7,8]}],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"09_DDPG/CartPole/rl_utils.py","rootId":"09","rootDir":"09_DDPG","name":"rl_utils.py","dir":"09_DDPG/CartPole","purpose":"提供 CartPole DDPG 的经验回放池和滑动平均工具函数。","lines":34,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-4","logic":"导入 collections、random 与 numpy；无模块级常量。","srcStart":1,"src":["import collections","import random","","import numpy as np"],"pseudo":""},{"kind":"类","kc":"cls","name":"ReplayBuffer","line":"7-22","logic":"基于 deque 的定长 off-policy 经验回放池。","srcStart":7,"src":["class ReplayBuffer:","    \"\"\"DDPG使用的长期off-policy经验回放池。\"\"\"","","    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity)","","    def add(self, state, action, reward, next_state, done):","        self.buffer.append((state, action, reward, next_state, done))","","    def sample(self, batch_size):","        transitions = random.sample(self.buffer, batch_size)","        states, actions, rewards, next_states, dones = zip(*transitions)","        return np.asarray(states), np.asarray(actions), np.asarray(rewards), np.asarray(next_states), np.asarray(dones)","","    def size(self):","        return len(self.buffer)"],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.__init__","line":"10-11","logic":"用 capacity 创建 maxlen 受限的 deque 作为存储。","srcStart":10,"src":["    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity)"],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.add","line":"13-14","logic":"把 (state, action, reward, next_state, done) 五元组追加进缓冲区，超出容量时自动丢弃最旧样本。","srcStart":13,"src":["    def add(self, state, action, reward, next_state, done):","        self.buffer.append((state, action, reward, next_state, done))"],"pseudo":"buffer.append((s, a, r, s2, done))\nif len(buffer) > capacity:\n    buffer.popleft()"},{"kind":"方法","kc":"method","name":"ReplayBuffer.sample","line":"16-19","logic":"用 random.sample 无放回抽取 batch_size 条转移，zip 拆解后转成 numpy 数组的五个返回值。","srcStart":16,"src":["    def sample(self, batch_size):","        transitions = random.sample(self.buffer, batch_size)","        states, actions, rewards, next_states, dones = zip(*transitions)","        return np.asarray(states), np.asarray(actions), np.asarray(rewards), np.asarray(next_states), np.asarray(dones)"],"pseudo":"batch = random.sample(buffer, batch_size)\nreturn zip(*batch)   # states, actions, rewards, next_states, dones"},{"kind":"方法","kc":"method","name":"ReplayBuffer.size","line":"21-22","logic":"返回当前缓冲区内的样本条数。","srcStart":21,"src":["    def size(self):","        return len(self.buffer)"],"pseudo":""},{"kind":"函数","kc":"func","name":"moving_average","line":"25-34","logic":"对序列做指定窗口的滑动平均；长度不足时原样返回，否则用累积和计算中段，并单独处理首尾两段后拼接输出。","srcStart":25,"src":["def moving_average(values, window_size):","    values = np.asarray(values, dtype=np.float32)","    if len(values) < window_size:","        return values","    cumulative_sum = np.cumsum(np.insert(values, 0, 0))","    middle = (cumulative_sum[window_size:] - cumulative_sum[:-window_size]) / window_size","    radius = np.arange(1, window_size - 1, 2)","    begin = np.cumsum(values[:window_size - 1])[::2] / radius","    end = (np.cumsum(values[:-window_size:-1])[::2] / radius)[::-1]","    return np.concatenate((begin, middle, end))"],"pseudo":"return [mean(x[max(0, i-w+1):i+1]) for i in range(len(x))]"}],"stages":[2,3,4,6],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5]}],"funcIdxs":[6],"entryIdxs":[],"constIdx":0},{"path":"09_DDPG/CartPole/trainer.py","rootId":"09","rootDir":"09_DDPG","name":"trainer.py","dir":"09_DDPG/CartPole","purpose":"实现 CartPole 上带连续动作代理器的 DDPG off-policy 训练循环。","lines":38,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-4","logic":"导入 numpy、tqdm 以及本目录的 continuous_to_discrete，用于动作离散化。","srcStart":1,"src":["import numpy as np","from tqdm import tqdm","","from environment import continuous_to_discrete"],"pseudo":""},{"kind":"函数","kc":"func","name":"train_off_policy_agent","line":"7-38","logic":"外层按 num_episodes 循环（可传 seed 逐回合重置环境），每回合先 reset_noise；内层用 agent 连续动作换算成 0/1 动作执行 env.step，缓冲连续动作与 terminated 标志（截断处仍 bootstrap），缓冲区达到 minimal_size 后每步采样 batch 调用 agent.update，最后返回每回合回报列表并用 tqdm 显示最近 10 回合均值。","srcStart":7,"src":["def train_off_policy_agent(env, agent, num_episodes, replay_buffer,","                           minimal_size, batch_size, seed=None):","    \"\"\"运行带连续动作代理器的CartPole off-policy训练。\"\"\"","    return_list = []","    with tqdm(total=num_episodes, desc='Training') as progress:","        for episode in range(num_episodes):","            agent.reset_noise()","            state, _ = env.reset() if seed is None else env.reset(seed=seed + episode)","            done = False","            episode_return = 0.0","            while not done:","                continuous_action = agent.take_action(state, explore=True)","                env_action = continuous_to_discrete(continuous_action)","                next_state, reward, terminated, truncated, _ = env.step(env_action)","                done = terminated or truncated","                # replay buffer 保存actor看到的连续动作，而非映射后的整数动作。","                # 时间上限截断不是真终止，target 仍然可以使用下一状态价值。","                replay_buffer.add(","                    state, continuous_action, reward, next_state, terminated","                )","                state = next_state","                episode_return += reward","                if replay_buffer.size() >= minimal_size:","                    agent.update(replay_buffer.sample(batch_size))","            return_list.append(episode_return)","            if (episode + 1) % 10 == 0:","                progress.set_postfix({","                    'episode': episode + 1,","                    'return': '%.3f' % np.mean(return_list[-10:]),","                })","            progress.update(1)","    return return_list"],"pseudo":"for episode in 1 ... num_episodes:\n    s = env.reset()\n    done = False\n    while not done:\n        a = agent.take_action(s, explore=True)\n        s2, r, terminated, truncated, _ = env.step(a)\n ks import Actor, Critic","from noise import NormalNoise, OUNoise"],"pseudo":""},{"kind":"类","kc":"cls","name":"DDPG","line":"9-89","logic":"标准 DDPG 智能体实现，包含确定性 actor、Q critic 及各自 target 网络。","srcStart":9,"src":["class DDPG:","    \"\"\"DDPG agent：确定性 actor + Q critic + 四个网络。\"\"\"","","    def __init__(self, state_dim, hidden_dim, action_dim, action_low,","                 action_high, actor_lr, critic_lr, gamma, tau, noise_type,","                 noise_sigma, ou_theta, device):","        self.actor = Actor(state_dim, hidden_dim, action_low, action_high).to(device)","        self.critic = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.target_actor = Actor(","            state_dim, hidden_dim, action_low, action_high","        ).to(device)","        self.target_critic = Critic(state_dim, hidden_dim, action_dim).to(device)","","        # target 网络初始时复制 online 网络，之后使用软更新。","        self.target_actor.load_state_dict(self.actor.state_dict())","        self.target_critic.load_state_dict(self.critic.state_dict())","        self.actor_optimizer = torch.optim.Adam(self.actor.parameters(), lr=actor_lr)","        self.critic_optimizer = torch.optim.Adam(self.critic.parameters(), lr=critic_lr)","        self.gamma = gamma","        self.tau = tau","        self.device = device","        self.action_dim = action_dim","","        if noise_type.lower() == 'ou':","            self.noise = OUNoise(action_dim, noise_sigma, ou_theta)","        elif noise_type.lower() == 'normal':","            self.noise = NormalNoise(action_dim, noise_sigma)","        else:","            raise ValueError(\"noise_type must be 'normal' or 'ou'\")","","    def reset_noise(self):","        self.noise.reset()","","    def take_action(self, state, explore=True):","        state = torch.as_tensor(","            np.asarray(state), dtype=torch.float32, device=self.device","        ).unsqueeze(0)","        with torch.no_grad():","            action = self.actor(state).squeeze(0).cpu().numpy()","        if explore:","            action = action + self.noise.sample()","        # 噪声可能把动作推到环境范围外，因此最终动作必须裁剪。","        return np.clip(action, self.actor.action_bias.cpu().numpy() - self.actor.action_scale.cpu().numpy(),","                       self.actor.action_bias.cpu().numpy() + self.actor.action_scale.cpu().numpy())","","    def soft_update(self, online_net, target_net):","        \"\"\"target <- (1-tau) * target + tau * online。\"\"\"","        for target_param, online_param in zip(","            target_net.parameters(), online_net.parameters()","        ):","            target_param.data.mul_(1 - self.tau)","            target_param.data.add_(self.tau * online_param.data)","","    def update(self, batch):","        states, actions, rewards, next_states, dones = batch","        states = torch.as_tensor(states, dtype=torch.float32, device=self.device)","        actions = torch.as_tensor(actions, dtype=torch.float32, device=self.device)","        rewards = torch.as_tensor(rewards, dtype=torch.float32, device=self.device).view(-1, 1)","        next_states = torch.as_tensor(next_states, dtype=torch.float32, device=self.device)","        dones = torch.as_tensor(dones, dtype=torch.float32, device=self.device).view(-1, 1)","","        # Bellman target 使用 target actor 和 target critic，减少目标漂移。","        with torch.no_grad():","            next_actions = self.target_actor(next_states)","            next_q_values = self.target_critic(next_states, next_actions)","            q_targets = rewards + self.gamma * next_q_values * (1 - dones)","","        critic_loss = F.mse_loss(self.critic(states, actions), q_targets)","        self.critic_optimizer.zero_grad()","        critic_loss.backward()","        self.critic_optimizer.step()","","        # 确定性策略梯度：最大化 Q(s, actor(s))，所以 loss 取负号。","        actor_loss = -self.critic(states, self.actor(states)).mean()","        self.actor_optimizer.zero_grad()","        actor_loss.backward()","        self.actor_optimizer.step()","","        # 每次梯度更新后缓慢同步两个 target 网络。","        self.soft_update(self.actor, self.target_actor)","        self.soft_update(self.critic, self.target_critic)"],"pseudo":""},{"kind":"方法","kc":"method","name":"DDPG.__init__","line":"12-37","logic":"构建 actor/critic 与 target 网络并将参数复制到 target，创建两个 Adam 优化器，保存 gamma/tau/device/action_dim，根据 noise_type 选择 OUNoise 或 NormalNoise，其余取值报 ValueError。","srcStart":12,"src":["    def __init__(self, state_dim, hidden_dim, action_dim, action_low,","                 action_high, actor_lr, critic_lr, gamma, tau, noise_type,","                 noise_sigma, ou_theta, device):","        self.actor = Actor(state_dim, hidden_dim, action_low, action_high).to(device)","        self.critic = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.target_actor = Actor(","            state_dim, hidden_dim, action_low, action_high","        ).to(device)","        self.target_critic = Critic(state_dim, hidden_dim, action_dim).to(device)","","        # target 网络初始时复制 online 网络，之后使用软更新。","        self.target_actor.load_state_dict(self.actor.state_dict())","        self.target_critic.load_state_dict(self.critic.state_dict())","        self.actor_optimizer = torch.optim.Adam(self.actor.parameters(), lr=actor_lr)","        self.critic_optimizer = torch.optim.Adam(self.critic.parameters(), lr=critic_lr)","        self.gamma = gamma","        self.tau = tau","        self.device = device","        self.action_dim = action_dim","","        if noise_type.lower() == 'ou':","            self.noise = OUNoise(action_dim, noise_sigma, ou_theta)","        elif noise_type.lower() == 'normal':","            self.noise = NormalNoise(action_dim, noise_sigma)","        else:","            raise ValueError(\"noise_type must be 'normal' or 'ou'\")"],"pseudo":""},{"kind":"方法","kc":"method","name":"DDPG.reset_noise","line":"39-40","logic":"调用噪声对象的 reset，在每回合开始时重置噪声状态。","srcStart":39,"src":["    def reset_noise(self):","        self.noise.reset()"],"pseudo":"noi        actions = torch.as_tensor(actions, dtype=torch.float32, device=self.device)","        rewards = torch.as_tensor(rewards, dtype=torch.float32, device=self.device).view(-1, 1)","        next_states = torch.as_tensor(next_states, dtype=torch.float32, device=self.device)","        dones = torch.as_tensor(dones, dtype=torch.float32, device=self.device).view(-1, 1)","","        # Bellman target 使用 target actor 和 target critic，减少目标漂移。","        with torch.no_grad():","            next_actions = self.target_actor(next_states)","            next_q_values = self.target_critic(next_states, next_actions)","            q_targets = rewards + self.gamma * next_q_values * (1 - dones)","","        critic_loss = F.mse_loss(self.critic(states, actions), q_targets)","        self.critic_optimizer.zero_grad()","        critic_loss.backward()","        self.critic_optimizer.step()","","        # 确定性策略梯度：最大化 Q(s, actor(s))，所以 loss 取负号。","        actor_loss = -self.critic(states, self.actor(states)).mean()","        self.actor_optimizer.zero_grad()","        actor_loss.backward()","        self.actor_optimizer.step()","","        # 每次梯度更新后缓慢同步两个 target 网络。","        self.soft_update(self.actor, self.target_actor)","        self.soft_update(self.critic, self.target_critic)"],"pseudo":"a2 = mu_target(s')\ny = r + gamma * (1 - done) * Q_target(s', a2)\nLq = MSE(Q(s, a), y)\nupdate Q\nLpi = -mean(Q(s, mu(s)))\nupdate mu\nsoft_update(mu, mu_target)\nsoft_update(Q, Q_target)"}],"stages":[2,4,6,5],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5,6]}],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"09_DDPG/Pendulum/config.py","rootId":"09","rootDir":"09_DDPG","name":"config.py","dir":"09_DDPG/Pendulum","purpose":"Pendulum DDPG 的超参数配置文件。","lines":18,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-18","logic":"导入 torch 后定义 actor_lr、critic_lr、NUM_EPISODES=200、HIDDEN_DIM、GAMMA、TAU、缓冲区与批大小、NOISE_TYPE/SIGMA、OU_THETA、SEED、ENV_NAME='Pendulum-v1'，并按 CUDA 可用性设 tworks.py","dir":"09_DDPG/Pendulum","purpose":"定义 Pendulum DDPG 的确定性策略网络与状态-动作价值网络。","lines":37,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-2","logic":"导入 torch 与 torch.nn.functional；无模块级常量。","srcStart":1,"src":["import torch","import torch.nn.functional as F"],"pseudo":""},{"kind":"类","kc":"cls","name":"Actor","line":"5-20","logic":"确定性策略 mu(s)，输出环境动作范围内的连续动作。","srcStart":5,"src":["class Actor(torch.nn.Module):","    \"\"\"确定性策略 mu(s)，输出环境动作范围内的连续动作。\"\"\"","","    def __init__(self, state_dim, hidden_dim, action_low, action_high):","        super().__init__()","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, len(action_low))","        low = torch.as_tensor(action_low, dtype=torch.float32)","        high = torch.as_tensor(action_high, dtype=torch.float32)","        self.register_buffer('action_scale', (high - low) / 2)","        self.register_buffer('action_bias', (high + low) / 2)","","    def forward(self, states):","        # tanh 将输出限制到 [-1, 1]，再映射到环境动作区间。","        hidden = F.relu(self.fc1(states))","        return self.action_bias + self.action_scale * torch.tanh(self.fc2(hidden))"],"pseudo":""},{"kind":"方法","kc":"method","name":"Actor.__init__","line":"8-15","logic":"构造 state_dim→hidden_dim→len(action_low) 的两层网络，并将动作缩放与偏移注册为 buffer 以便随设备迁移。","srcStart":8,"src":["    def __init__(self, state_dim, hidden_dim, action_low, action_high):","        super().__init__()","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, len(action_low))","        low = torch.as_tensor(action_low, dtype=torch.float32)","        high = torch.as_tensor(action_high, dtype=torch.float32)","        self.register_buffer('action_scale', (high - low) / 2)","        self.register_buffer('action_bias', (high + low) / 2)"],"pseudo":""},{"kind":"方法","kc":"method","name":"Actor.forward","line":"17-20","logic":"ReLU 隐层后接 tanh 限幅到 [-1,1]，再经 action_bias + action_scale*tanh 映射到动作区间。","srcStart":17,"src":["    def forward(self, states):","        # tanh 将输出限制到 [-1, 1]，再映射到环境动作区间。","        hidden = F.relu(self.fc1(states))","        return self.action_bias + self.action_scale * torch.tanh(self.fc2(hidden))"],"pseudo":"h = relu(W1 s + b1)\nh = relu(W2 h + b2)\nu = tanh(W3 h + b3)\nreturn action_bias + action_scale * u"},{"kind":"类","kc":"cls","name":"Critic","line":"23-37","logic":"Q(s,a) 网络，同时接收状态与动作并输出标量价值。","srcStart":23,"src":["class Critic(torch.nn.Module):","    \"\"\"Q(s,a) 网络，同时接收状态和动作。\"\"\"","","    def __init__(self, state_dim, hidden_dim, action_dim):","        super().__init__()","        self.fc1 = torch.nn.Linear(state_dim + action_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, hidden_dim)","        self.fc_out = torch.nn.Linear(hidden_dim, 1)","","    def forward(self, states, actions):","        # 拼接后输入，输出每个状态-动作对的一个标量 Q 值。","        features = torch.cat([states, actions], dim=1)","        features = F.relu(self.fc1(features))","        features = F.relu(self.fc2(features))","        return self.fc_out(features)"],"pseudo":""},{"kind":"方法","kc":"method","name":"Critic.__init__","line":"26-30","logic":"三层全连接：state_dim+action_dim→hidden_dim、hidden_dim→hidden_dim、hidden_dim→1。","srcStart":26,"src":["    def __init__(self, state_dim, hidden_dim, action_dim):","        super().__init__()","        self.fc1 = torch.nn.Linear(state_dim + action_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, hidden_dim)","        self.fc_out = torch.nn.Linear(hidden_dim, 1)"],"pseudo":""},{"kind":"方法","kc":"method","name":"Critic.forward","line":"32-37","logic":"拼接状态与动作后过两层 ReLU 隐层，由 fc_out 输出每个状态-动作对的 Q 值。","srcStart":32,"src":["    def forward(self, states, actions):","        # 拼接后输入，输出每个状态-动作对的一个标量 Q 值。","        features = torch.cat([states, actions], dim=1)","        features = F.relu(self.fc1(features))","        features = F.relu(self.fc2(features))","        return self.fc_out(features)"],"pseudo":"x = concat(s, a)\nh = relu(W1 x + b1)\nh = relu(W2 h + b2)\nreturn W3 h + b3"}],"stages":[2,3],"classGroups":[{"classIdx":1,"methodIdxs":[2,3]},{"classIdx":4,"methodIdxs":[5,6]}],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"09_DDPG/Pendulum/noise.py","rootId":"09","rootDir":"09_DDPG","name":"noise.py","dir":"09_DDPG/Pendulum","purpose":"提供 Pendulum DDPG 探索使用的高斯噪声与 OU 噪声。","lines":41,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1","logic":"仅导入 numpy；无模块级常量。","srcStart":1,"src":["import numpy as np"],"pseudo":""},{"kind":"类","kc":"cls","name":"NormalNoise","line":"4-16","logic":"逐步独立重采样的高斯探索噪声。","srcStart":4,"src":["class NormalNoise:","    \"\"\"独立高斯探索噪声：每一步重新采样。\"\"\"","","    def __init__(self, action_dim, sigma):","        self.action_dim = action_dim","        self.sigma = sigma","","    def reset(self):","        # 高斯噪声没有跨时间状态，reset 只是统一接口。","        pass","","    def sample(self):","        return self.sigma * np.random.randn(self.action_dim)"],"pseudo":""},{"kind":"方法","kc":"method","name":"NormalNoise.__init__","line":"7-9","logic":"保存动作维度与标准差 sigma。","srcStart":7,"src":["    def __init__(self, action_dim, sigma):","        self.action_dim = action_dim","        self.sigma = sigma"],"pseudo":""},{"kind":"方法","kc":"method","name":"NormalNoise.reset","line":"11-13","logic":"空实现，仅为统一接口，因为高斯噪声无跨时间状态。","srcStart":11,"src":["    def reset(self):","        # 高斯噪声没有跨时间状态，reset 只是统一接口。","        pass"],"pseudo":""},{"kind":"方法","kc":"method","name":"NormalNoise.sample","line":"15-16","logic":"返回 sigma * randn(action_dim) 的噪声向量。","srcStart":15,"src":["    def sample(self):","        return self.sigma * np.random.randn(self.action_dim)"],"pseudo":"return sigma * randn(action_dim)"},{"kind":"类","kc":"cls","name":"OUNoise","line":"19-41","logic":"Ornstein-Uhlenbeck 噪声，按文档字符串中的递推式产生时间相关的探索扰动。","srcStart":19,"src":["class OUNoise:","    \"\"\"Ornstein-Uhlenbeck 噪声，具有时间相关性。","","    x_t = x_{t-1} + theta * (mu - x_{t-1}) + sigma * N(0, I)","    偏离均值后会受到拉回均值的漂移，适合有惯性的连续控制环境。","    \"\"\"","","    def __init__(self, action_dim, sigma, theta=0.15, mu=0.0):","        self.action_dim = action_dim","        self.sigma = sigma","        self.theta = theta","        self.mu = mu","        self.state = np.zeros(action_dim, dtype=np.float32)","","    def reset(self):","        # 每个 episode 开始时清除上一条轨迹的噪声状态。","        self.state.fill(0.0)","","    def sample(self):","        random_part = self.sigma * np.random.randn(self.action_dim)","        drift = self.theta * (self.mu - self.state)","        self.state = self.state + drift + random_part","        return self.state.copy()"],"pseudo":""},{"kind":"方法","kc":"method","name":"OUNoise.__init__","line":"26-31","logic":"保存 action_dim、sigma、theta、mu，并把内部噪声状态初始化为零向量。","srcStart":26,"src":["    def __init__(self, action_dim, sigma, theta=0.15, mu=0.0):","        self.action_dim = action_dim","        self.sigma = sigma","        self.theta = theta","        self.mu = mu","        self.state = np.zeros(action_dim, dtype=np.float32)"],"pseudo":""},{"kind":"方法","kc":"method","name":"OUNoise.reset","line":"33-35","logic":"每回合开始时把内部状态填零，清除上一条轨迹的噪声。","srcStart":33,"src":["    def reset(self):","        # 每个 episode 开始时清除上一条轨迹的噪声状态。","        self.state.fill(0.0)"],"pseudo":""},{"kind":"方法","kc":"method","name":"OUNoise.sample","line":"37-41","logic":"计算漂移 theta*(mu-state) 与随机项 sigma*randn，更新 state 后返回其副本。","srcStart":37,"src":["    def sample(self):","        random_part = self.sigma * np.random.randn(self.action_dim)","        drift = self.theta * (self.mu - self.state)","        self.state = self.state + drift + random_part","        return self.state.copy()"],"pseudo":"x = x + theta * (mu - x) + sigma * randn(action_dim)\nreturn x"}],"stages":[4,3],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4]},{"classIdx":5,"methodIdxs":[6,7,8]}],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"09_DDPG/Pendulum/practice.py","rootId":"09","rootDir" d, next_state, done):","        self.buffer.append((state, action, reward, next_state, done))","","    def sample(self, batch_size):","        transitions = random.sample(self.buffer, batch_size)","        states, actions, rewards, next_states, dones = zip(*transitions)","        return (","            np.asarray(states),","            np.asarray(actions),","            np.asarray(rewards),","            np.asarray(next_states),","            np.asarray(dones),","        )","","    def size(self):","        return len(self.buffer)"],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.__init__","line":"10-11","logic":"以 capacity 作为 maxlen 创建 deque 存储。","srcStart":10,"src":["    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity)"],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.add","line":"13-14","logic":"追加一条 (state, action, reward, next_state, done) 转移，满容量时自动淘汰最旧数据。","srcStart":13,"src":["    def add(self, state, action, reward, next_state, done):","        self.buffer.append((state, action, reward, next_state, done))"],"pseudo":"buffer.append((s, a, r, s2, done))\nif len(buffer) > capacity:\n    buffer.popleft()"},{"kind":"方法","kc":"method","name":"ReplayBuffer.sample","line":"16-25","logic":"随机无放回抽取 batch_size 条转移，拆包后转换为五个 numpy 数组返回。","srcStart":16,"src":["    def sample(self, batch_size):","        transitions = random.sample(self.buffer, batch_size)","        states, actions, rewards, next_states, dones = zip(*transitions)","        return (","            np.asarray(states),","            np.asarray(actions),","            np.asarray(rewards),","            np.asarray(next_states),","            np.asarray(dones),","        )"],"pseudo":"batch = random.sample(buffer, batch_size)\nreturn zip(*batch)   # states, actions, rewards, next_states, dones"},{"kind":"方法","kc":"method","name":"ReplayBuffer.size","line":"27-28","logic":"返回缓冲区当前样本数。","srcStart":27,"src":["    def size(self):","        return len(self.buffer)"],"pseudo":""},{"kind":"函数","kc":"func","name":"moving_average","line":"31-40","logic":"序列长度不足 window_size 时原样返回；否则用累积和计算中间段均值，并分别计算开头与结尾的逐步平均后拼接为完整序列。","srcStart":31,"src":["def moving_average(values, window_size):","    values = np.asarray(values, dtype=np.float32)","    if len(values) < window_size:","        return values","    cumulative_sum = np.cumsum(np.insert(values, 0, 0))","    middle = (cumulative_sum[window_size:] - cumulative_sum[:-window_size]) / window_size","    radius = np.arange(1, window_size - 1, 2)","    begin = np.cumsum(values[:window_size - 1])[::2] / radius","    end = (np.cumsum(values[:-window_size:-1])[::2] / radius)[::-1]","    return np.concatenate((begin, middle, end))"],"pseudo":"return [mean(x[max(0, i-w+1):i+1]) for i in range(len(x))]"}],"stages":[2,3,4,6],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5]}],"funcIdxs":[6],"entryIdxs":[],"constIdx":0},{"path":"09_DDPG/Pendulum/trainer.py","rootId":"09","rootDir":"09_DDPG","name":"trainer.py","dir":"09_DDPG/Pendulum","purpose":"实现 Pendulum DDPG 的 off-policy 训练循环，负责交互、回放与按步更新。","lines":46,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-2","logic":"导入 numpy 与 tqdm 进度条；无模块级常量。","srcStart":1,"src":["import numpy as np","from tqdm import tqdm"],"pseudo":""},{"kind":"函数","kc":"func","name":"train_off_policy_agent","line":"5-46","logic":"按 num_episodes 循环，每回合先 agent.reset_noise 并按 seed+episode 重置环境；内层用 take_action 采样连续动作执行 env.step，把 terminated（而非 truncated）作为 done 存入回放池以便截断处继续 bootstrap，缓冲区达到 minimal_size 后每步采样并调用 agent.update，最终返回每回合回报列表并用 tqdm 显示最近十回合均值。","srcStart":5,"src":["def train_off_policy_agent(env, agent, num_episodes, replay_buffer,","                           minimal_size, batch_size, seed=None):","    \"\"\"运行DDPG的off-policy训练流程。\"\"\"","    return_list = []","    with tqdm(total=num_episodes, desc='Training') as progress:","        for episode in range(num_episodes):","            # OU噪声需要在每个episode开始时清零历史状态。","            agent.reset_noise()","            if seed is None:","                state, _ = env.reset()","            else:","                state, _ = env.reset(seed=seed + episode)","            done = False","            episode_return = 0.0","","            while not done:","                # actor给出确定性动作，noise负责探索。","                action = agent.take_action(state, explore=True)","                next_state, reward, terminated, truncated, _ = env.step(action)","                done = terminated or truncated","                # truncated 通常只是达到时间上限，不代表真实终止。","                # Bellman target 在时间截断处仍应 bootstrap 下一状态价值。","                terminal_for_target = terminated","                replay_buffer.add(","                    state, action, reward, next_state, terminal_for_target","                )","                state = next_state","                episode_return += reward","","                # buffer积累足够数据后，每个环境步都可采样更新。","                if replay_buffer.size() >= minimal_size:","                    batch = replay_buffer.sample(batch_size)","                    agent.update(batch)","","            return_list.append(episode_return)","            if (episode + 1) % 10 == 0:","                progress.set_postfix({","                    'episode': episode + 1,","                    'return': '%.3f' % np.mean(return_list[-10:]),","                })","            progress.update(1)","    return return_list"],"pseudo":"for episode in 1 ... num_episodes:\n    s = env.reset()\n    done = False\n    while not done:\n        a = agent.take_action(s, explore=True)\n        s2, r, terminated, truncated, _ = env.step(a)\n        done = terminated or truncated\n        buffer.add(s, a, r, s2, terminated)\n        if buffer.size >= minimal_size:\n            agent.update(buffer.sample(batch_size))\n        s = s2"}],"stages":[1],"classGroups":[],"funcIdxs":[1],"entryIdxs":[],"constIdx":0},{"path":"09_DDPG/Pendulum/visualization.py","rootId":"09","rootDir":"09_DDPG","name":"visua ame":"TD3","line":"9-213","logic":"封装 actor、target_actor、两个 online critic、两个 target critic、三个 Adam 优化器、动作边界与延迟更新计数，对外提供动作选择、target 计算和批量更新接口。","srcStart":9,"src":["class TD3:","    \"\"\"Twin Delayed DDPG agent。","","    与 DDPG 一样，TD3 是 off-policy 的确定性 actor-critic 算法；","    区别在于它维护两个 critic、对 target 动作做平滑，并延迟 actor 更新。","","    网络清单（共 6 个）：","        actor            mu(s)","        target_actor     mu_target(s)","        critic_1         Q1(s, a)","        critic_2         Q2(s, a)","        target_critic_1  Q1_target(s, a)","        target_critic_2  Q2_target(s, a)","    \"\"\"","","    def __init__(self, state_dim, hidden_dim, action_dim, action_low,","                 action_high, actor_lr, critic_lr, gamma, tau, policy_delay,","                 target_noise, noise_clip, exploration_sigma, device):","        self.actor = Actor(state_dim, hidden_dim, action_low, action_high).to(device)","        self.target_actor = Actor(state_dim, hidden_dim, action_low, action_high).to(device)","        self.critic_1 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.critic_2 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.target_critic_1 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.target_critic_2 = Critic(state_dim, hidden_dim, action_dim).to(device)","","        # target 网络初始时与 online 网络完全相同。","        # 注意：两个 critic 各自独立初始化，不共享参数。","        self.target_actor.load_state_dict(self.actor.state_dict())","        self.target_critic_1.load_state_dict(self.critic_1.state_dict())","        self.target_critic_2.load_state_dict(self.critic_2.state_dict())","","        self.actor_optimizer = torch.optim.Adam(self.actor.parameters(), lr=actor_lr)","        self.critic_1_optimizer = torch.optim.Adam(","            self.critic_1.parameters(), lr=critic_lr","        )","        self.critic_2_optimizer = torch.optim.Adam(","            self.critic_2.parameters(), lr=critic_lr","        )","","        self.gamma = gamma","        self.tau = tau","        self.policy_delay = policy_delay","        self.target_noise = target_noise","        self.noise_clip = noise_clip","        self.device = device","","        # 动作边界与半幅，用于探索裁剪和 target smoothing 的单位换算。","        self.action_low = torch.as_tensor(","            action_low, dtype=torch.float32, device=device","        )","        self.action_high = torch.as_tensor(","            action_high, dtype=torch.float32, device=device","        )","        self.action_scale = (self.action_high - self.action_low) / 2","","        self.noise = GaussianNoise(action_dim, exploration_sigma)","","        # 记录调用 update() 的次数，用于实现 delayed policy update。","        # 注意这个计数是“梯度更新次数”，不是环境步数。","        self.update_count = 0","","    def reset_noise(self):","        # 高斯噪声无状态，保留该接口便于和 DDPG 的训练循环保持一致。","        self.noise.reset()","","    def take_action(self, state, explore=True):","        \"\"\"根据状态选择动作。","","        explore=True：训练时使用，在确定性动作上叠加高斯噪声。","        explore=False：评估时使用，执行纯 actor 输出。","        \"\"\"","        state = torch.as_tensor(","            np.asarray(state), dtype=torch.float32, device=self.device","        ).unsqueeze(0)","        with torch.no_grad():","            action = self.actor(state).squeeze(0)","","        if explore:","            noise = torch.as_tensor(","                self.noise.sample(), dtype=torch.float32, device=self.device","            )","            action = action + noise","","        # 无论是否加噪声，都不能把越界动作交给环境。","        action = torch.max(torch.min(action, self.action_high), self.action_low)","        return action.cpu().numpy()","","    def soft_update(self, online_net, target_net):","        \"\"\"Polyak averaging：target <- (1 - tau) * target + tau * online。\"\"\"","        for target_param, online_param in zip(","            target_net.parameters(), online_net.parameters()","        ):","            # 使用 data 原地修改，避免把 target 参数加入计算图。","            target_param.data.mul_(1 - self.tau)","            target_param.data.add_(self.tau * online_param.data)","","    def calc_target(self, rewards, next_states, dones):","        \"\"\"计算 clipped double-Q 的 Bellman target。","","        公式：","            a' = clip(mu_target(s') + clip(eps, -c, c), a_low, a_high)","            y  = r + gamma * (1 - done) * min(Q1_target(s', a'),","                                              Q2_target(s', a'))","","        取两个 target critic 的最小值，可以理解为对 Q 值高估的保守估计：","        即使某一个网络偶然给出过大的 Q，另一个网络也会把它压下来。","        \"\"\"","        with torch.no_grad():","            # 第一步：target actor 给出下一状态动作，并做 target policy smoothing。","            next_actions = self.target_actor(next_states)","            next_actions = smooth_target_action(","                next_actions,","                self.target_noise,","                self.noise_clip,","                self.action_scale,","                self.action_low,","                self.action_high,","            )","","            # 第二步：两个 target critic 分别打分，取最小值。","            next_q_1 = self.target_critic_1(next_states, next_actions)","            next_q_2 = self.target_critic_2(next_states, next_actions)","            next_q = torch.min(next_q_1, next_q_2)","","            # done=1 表示真正终止，不再 bootstrap 下一状态价值；","            # 时间截断（truncated）不在这里体现，trainer 只传 terminated。","            return rewards + self.gamma * next_q * (1 - dones)","","    def update(self, batch):","        \"\"\"执行一次 TD3 更新，返回本次的 loss 信息。","","        每次调用都会更新两个 critic；","        只有每 policy_delay 次调用，才额外更新 actor 和三个 target 网络。","        \"\"\"","        states, actions, rewards, next_states, dones = batch","        states = torch.as_tensor(states, dtype=torch.float32, device=self.device)","        actions = torch.as_tensor(actions, dtype=torch.float32, device=self.device)","        rewards = torch.as_tensor(","            rewards, dtype=torch.float32, device=self.device","        ).view(-1, 1)","        next_states = torch.as_tensor(","            next_states, dtype=torch.float32, device=self.device","        )","        dones = torch.as_tensor(","            dones, dtype=torch.float32, device=self.device","        ).view(-1, 1)","","        # ------------------------------------------------------------------","        # 1. 更新两个 critic","        # ------------------------------------------------------------------","        # 两个 critic 回归同一个 target。target 由两个 target critic 的","        # 最小值构成，但每个 online critic 都要向这个 target 靠近。","        q_target = self.calc_target(rewards, next_states, dones)","","        q_1 = self.critic_1(states, actions)","        q_2 = self.critic_2(states, actions)","        critic_loss = F.mse_loss(q_1, q_target) + F.mse_loss(q_2, q_target)","","        self.critic_1_optimizer.zero_grad()","        self.critic_2_optimizer.zero_grad()","        critic_loss.backward()","        self.critic_1_optimizer.step()","        self.critic_2_optimizer.step()","","        # ------------------------------------------------------------------","        # 2. 延迟更新 actor 和 target 网络","        # ------------------------------------------------------------------","        self.update_count += 1","        actor_loss_value = None","","        if self.update_count % self.policy_delay == 0:","            # 策略更新只需要对 actor 参数求梯度。临时冻结 critic，","            # 可以避免在 actor loss 反向传播时计算无用的 critic 梯度，","            # 也防止这些梯度意外残留在 critic 参数上。","            for parameter in self.critic_1.parameters():","                parameter.requires_grad_(False)","            for parameter in self.critic_2.parameters():","                parameter.requires_grad_(False)","            try:","                # 确定性策略梯度：最大化 Q1(s, mu(s))。","                # 优化器只做最小化，因此对 Q 取负号。","                # 注意这里只用 Q1（TD3 论文与 Spinning Up 的做法），","                # 两个 critic 只在计算 Bellman target 时取 min。","                actor_loss = -self.critic_1(states, self.actor(states)).mean()","                self.actor_optimizer.zero_grad()","                actor_loss.backward()","                self.actor_optimizer.step()","                actor_loss_value = actor_loss.item()","            finally:","                # 无论反向传播是否异常，都要恢复 critic 的可训练状态。","                for parameter in self.critic_1.parameters():","                    parameter.requires_grad_(True)","                for parameter in self.critic_2.parameters():","                    parameter.requires_grad_(True)","","            # actor 更新后，再同步三个 target 网络。","            # 这样 target 变化频率与 actor 一致，比每个 critic step 都同步更稳定。","            self.soft_update(self.actor, self.target_actor)","            self.soft_update(self.critic_1, self.target_critic_1)","            self.soft_update(self.critic_2, self.target_critic_2)","","        return {","            'critic_loss': critic_loss.item(),","            'actor_loss': actor_loss_value,","        }"],"pseudo":""},{"kind":"方法","kc":"method","name":"TD3.__init__","line":"24-68","logic":"按 state_dim/hidden_dim/action_dim 构建 Actor 与两套 Critic，并把 online 参数复制给 target；创建三个 Adam 优化器，保存 gamma、tau、policy_delay、target_noise、noise_clip，把动作上下界转成设备上的张量并计算半幅 action_scale。","srcStart":24,"src":["    def __init__(self, state_dim, hidden_dim, action_dim, action_low,","                 action_high, actor_lr, critic_lr, gamma, tau, policy_delay,","                 target_noise, noise_clip, exploration_sigma, device):","        self.actor = Actor(state_dim, hidden_dim, action_low, action_high).to(device)","        self.target_actor = Actor(state_dim, hidden_dim, action_low, action_high).to(device)","        self.critic_1 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.critic_2 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.target_critic_1 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.target_critic_2 = Critic(state_dim, hidden_dim, action_dim).to(device)","","        # target 网络初始时与 online 网络完全相同。","        # 注意：两个 critic 各自独立初始化，不共享参数。","        self.target_actor.load_state_dict(self.actor.state_dict())"," 值，可以理解为对 Q 值高估的保守估计：","        即使某一个网络偶然给出过大的 Q，另一个网络也会把它压下来。","        \"\"\"","        with torch.no_grad():","            # 第一步：target actor 给出下一状态动作，并做 target policy smoothing。","            next_actions = self.target_actor(next_states)","            next_actions = smooth_target_action(","                next_actions,","                self.target_noise,","                self.noise_clip,","                self.action_scale,","                self.action_low,","                self.action_high,","            )","","            # 第二步：两个 target critic 分别打分，取最小值。","            next_q_1 = self.target_critic_1(next_states, next_actions)","            next_q_2 = self.target_critic_2(next_states, next_actions)","            next_q = torch.min(next_q_1, next_q_2)","","            # done=1 表示真正终止，不再 bootstrap 下一状态价值；","            # 时间截断（truncated）不在这里体现，trainer 只传 terminated。","            return rewards + self.gamma * next_q * (1 - dones)"],"pseudo":"a2 = mu_target(s')\neps = randn_like(a2) * target_noise * scale\neps = clip(eps, -noise_clip * scale, noise_clip * scale)\na2 = clip(a2 + eps, low, high)\ny = r + gamma * (1 - done)\n    * min(Q1_target(s', a2), Q2_target(s', a2))\nreturn y"},{"kind":"方法","kc":"method","name":"TD3.update","line":"137-213","logic":"先把 batch 转成张量，用共享的 clipped double-Q target 对两个 critic 各做 MSE 回归并分别 backward/step；每 policy_delay 次调用再临时冻结 critic，以 -Q1(s,actor(s)).mean() 更新 actor，随后软更新 actor 与两个 critic 的 target，返回 critic_loss 和 actor_loss。","srcStart":137,"src":["    def update(self, batch):","        \"\"\"执行一次 TD3 更新，返回本次的 loss 信息。","","        每次调用都会更新两个 critic；","        只有每 policy_delay 次调用，才额外更新 actor 和三个 target 网络。","        \"\"\"","        states, actions, rewards, next_states, dones = batch","        states = torch.as_tensor(states, dtype=torch.float32, device=self.device)","        actions = torch.as_tensor(actions, dtype=torch.float32, device=self.device)","        rewards = torch.as_tensor(","            rewards, dtype=torch.float32, device=self.device","        ).view(-1, 1)","        next_states = torch.as_tensor(","            next_states, dtype=torch.float32, device=self.device","        )","        dones = torch.as_tensor(","            dones, dtype=torch.float32, device=self.device","        ).view(-1, 1)","","        # ------------------------------------------------------------------","        # 1. 更新两个 critic","        # ------------------------------------------------------------------","        # 两个 critic 回归同一个 target。target 由两个 target critic 的","        # 最小值构成，但每个 online critic 都要向这个 target 靠近。","        q_target = self.calc_target(rewards, next_states, dones)","","        q_1 = self.critic_1(states, actions)","        q_2 = self.critic_2(states, actions)","        critic_loss = F.mse_loss(q_1, q_target) + F.mse_loss(q_2, q_target)","","        self.critic_1_optimizer.zero_grad()","        self.critic_2_optimizer.zero_grad()","        critic_loss.backward()","        self.critic_1_optimizer.step()","        self.critic_2_optimizer.step()","","        # ------------------------------------------------------------------","        # 2. 延迟更新 actor 和 target 网络","        # ------------------------------------------------------------------","        self.update_count += 1","        actor_loss_value = None","","        if self.update_count % self.policy_delay == 0:","            # 策略更新只需要对 actor 参数求梯度。临时冻结 critic，","            # 可以避免在 actor loss 反向传播时计算无用的 critic 梯度，","            # 也防止这些梯度意外残留在 critic 参数上。","            for parameter in self.critic_1.parameters():","                parameter.requires_grad_(False)","            for parameter in self.critic_2.parameters():","                parameter.requires_grad_(False)","            try:","                # 确定性策略梯度：最大化 Q1(s, mu(s))。","                # 优化器只做最小化，因此对 Q 取负号。","                # 注意这里只用 Q1（TD3 论文与 Spinning Up 的做法），","                # 两个 critic 只在计算 Bellman target 时取 min。","                actor_loss = -self.critic_1(states, self.actor(states)).mean()","                self.actor_optimizer.zero_grad()","                actor_loss.backward()","                self.actor_optimizer.step()","                actor_loss_value = actor_loss.item()","            finally:","                # 无论反向传播是否异常，都要恢复 critic 的可训练状态。","                for parameter in self.critic_1.parameters():","                    parameter.requires_grad_(True)","                for parameter in self.critic_2.parameters():","                    parameter.requires_grad_(True)","","            # actor 更新后，再同步三个 target 网络。","            # 这样 target 变化频率与 actor 一致，比每个 critic step 都同步更稳定。","            self.soft_update(self.actor, self.target_actor)","            self.soft_update(self.critic_1, self.target_critic_1)","            self.soft_update(self.critic_2, self.target_critic_2)","","        return {","            'critic_loss': critic_loss.item(),","            'actor_loss': actor_loss_value,","        }"],"pseudo":"y = calc_target(r, s', done)\nLq = MSE(Q1(s, a), y) + MSE(Q2(s, a), y)\nupdate Q1, Q2\nupdate_count += 1\nif update_count % policy_delay == 0:\n    Lpi = -mean(Q1(s, mu(s)))\n    update mu\n    soft_update(mu, mu_target)\n    soft_update(Q1, Q1_target)\n    soft_update(Q2, Q2_target)"}],"stages":[2,4,7,6,5],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5,6,7]}],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"10_TD3/Pendulum/config.py","rootId":"10","rootDir":"10_TD3","name":"config.py","dir":"10_TD3/Pendulum","purpose":"集中存放 TD3 实验的全部超参数、环境名、随机种子与设备选择。","lines":67,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-67","logic":"仅导入 torch，然后定义 actor/critic 学习率 1e-3、200 个 episode、隐藏层 128、gamma 0.99、tau 0.005、policy_delay 2、target_noise 0.2 与 noise_clip 0.5、探索噪声 0.1、buffer 10 万与 batch 100、评估 20 回合及评估种子 10000，并给出 SEED、ENV_NAME='Pendulum-v1' 与自动选择 cuda/cpu 的 DEVICE。","srcStart":1,"src":["import torch","","# =============================================================================","# TD3 超参数","# =============================================================================","# TD3 是在 DDPG 上的三项改进：","#   1. clipped double-Q：用两个 critic 的最小值计算 Bellman target，抑制 Q 值高估。","#   2. target policy smoothing：给 target actor 的下一动作加截断噪声，让 critic 更平滑。","#   3. delayed policy updates：critic 更新若干次后，才更新一次 actor 和 target 网络。","#","# 下面大多数默认值来自 Spinning Up 的 TD3 实现：","#   https://github.com/openai/spinningup/tree/master/spinup/algos/pytorch/td3","","# actor 和 critic 使用相同学习率是 TD3 原始论文/Spinning Up 的默认设置。","# 注意：DDPG 教程常把 critic 学习率设得更大；TD3 的延迟更新已经缓解了","# actor 追着不准确 critic 跑的问题，因此不必刻意拉开两者学习率。","ACTOR_LR = 1e-3","CRITIC_LR = 1e-3","","# Pendulum 每个 episode 固定 200 步，200 个 episode 约 4 万次环境交互。","# 想快速验证代码链路时，先把 NUM_EPISODES 改成 1、MINIMAL_SIZE 改成 1。","NUM_EPISODES = 200","","# 两层隐藏层，每层 128 个神经元。","HIDDEN_DIM = 128","","# 折扣因子。Pendulum 的奖励范围约为 [-16, 0]，gamma 取 0.99 表示","# 智能体愿意为较远未来的回报付出努力。","GAMMA = 0.99","","# target 网络软更新系数：","#   theta_target <- (1 - tau) * theta_target + tau * theta","# tau 越小，target 变化越慢，训练越稳定，但跟踪当前网络也越慢。","TAU = 0.005","","# 延迟策略更新：每更新 POLICY_DELAY 次 critic，才更新一次 actor 和 target。","# 论文默认值为 2，即“critic 更新两次，actor 更新一次”。","POLICY_DELAY = 2","","# target policy smoothing 使用的噪声。","# TARGET_NOISE 和 NOISE_CLIP 都是在“归一化动作空间” [-1, 1] 中定义的，","# agents.py 会再乘以动作半幅 action_scale，映射到 Pendulum 的 [-2, 2]。","TARGET_NOISE = 0.2","NOISE_CLIP = 0.5","","# 行为策略的探索噪声标准差，单位是环境动作单位（Pendulum 中为 [-2, 2]）。","# 训练时执行 a = mu(s) + N(0, EXPLORATION_SIGMA^2)，再把动作裁剪到合法范围。","# 评估时关闭该噪声，执行纯确定性动作。","EXPLORATION_SIGMA = 0.1","","# off-policy replay buffer 配置。","# Pendulum 的 transition 很小，10 万条只占很少内存。","BUFFER_SIZE = 100000","# buffer 中至少有这么多条数据后才开始采样，避免早期用极小样本过拟合。","MINIMAL_SIZE = 1000","BATCH_SIZE = 100","","# 训练结束后用确定性策略额外评估多少个 episode。","# 评估 episode 太少时方差很大，20 个是精度与耗时的折中。","EVAL_EPISODES = 20","# 评估专用种子，与训练种子解耦：比较不同训练种子时，","# 所有模型都在同一批初始状态上评估。","EVAL_SEED = 10000","","SEED = 0","ENV_NAME = 'Pendulum-v1'","DEVICE = torch.device('cuda') if torch.cuda.is_available() else tor
