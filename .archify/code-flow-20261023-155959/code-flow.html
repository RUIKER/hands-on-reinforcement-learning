<!doctype html>
<html lang="zh-CN">
<head>

<title>强化学习代码流：文件、函数与伪代码</title>
<style>
:root{
  --bg:#070b11; --panel:#0d141e; --panel2:#111b27; --panel3:#152131;
  --line:#1e2c3b; --line2:#2a3b4e; --text:#e6edf3; --muted:#8b9bad; --dim:#5d6b7a;
  --cyan:#22d3ee; --violet:#a78bfa; --amber:#fbbf24; --emerald:#34d399;
  --rose:#fb7185; --slate:#94a3b8;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Noto Sans CJK SC",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(34,211,238,.035) 1px,transparent 1px),
    linear-gradient(90deg,rgba(34,211,238,.035) 1px,transparent 1px),
    radial-gradient(900px 500px at 15% -10%,rgba(34,211,238,.10),transparent 60%),
    radial-gradient(800px 450px at 90% 0%,rgba(167,139,250,.08),transparent 60%);
  background-size:32px 32px,32px 32px,100% 100%,100% 100%;
}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.mono{font-family:var(--mono)}
.topbar{
  position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:22px;
  min-height:68px;padding:10px 24px;background:rgba(7,11,17,.88);
  border-bottom:1px solid var(--line);backdrop-filter:blur(14px);
}
.brand{display:flex;align-items:center;gap:12px;min-width:300px}
.brand-mark{
  width:40px;height:40px;border:1px solid rgba(34,211,238,.55);border-radius:10px;
  display:grid;place-items:center;font-family:var(--mono);font-weight:700;
  color:var(--cyan);background:rgba(34,211,238,.08);box-shadow:0 0 24px rgba(34,211,238,.16);
}
.brand h1{font-size:16px;margin:0;letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.search-wrap{position:relative;flex:1;max-width:620px}
.search-wrap input{
  width:100%;height:40px;border-radius:10px;border:1px solid var(--line2);
  background:rgba(13,20,30,.85);color:var(--text);padding:0 14px 0 38px;
  font-size:13px;
}
.search-wrap::before{
  content:"⌕";position:absolute;left:13px;top:50%;transform:translateY(-55%);
  color:var(--dim);font-size:18px;pointer-events:none;
}
.search-results{
  position:absolute;top:46px;left:0;right:0;max-height:52vh;overflow:auto;
  background:#0c131d;border:1px solid var(--line2);border-radius:12px;
  box-shadow:0 22px 60px rgba(0,0,0,.55);padding:6px;z-index:45;
}
.result{
  display:block;width:100%;text-align:left;background:none;border:0;
  border-radius:8px;padding:9px 10px;cursor:pointer;
}
.result:hover{background:rgba(34,211,238,.08)}
.result-path{display:block;color:var(--dim);font-family:var(--mono);font-size:10.5px}
.result-name{display:block;font-size:13px;margin-top:2px}
.result-kind{color:var(--cyan);font-size:10px;margin-right:6px}
.search-empty{padding:12px;color:var(--muted);font-size:12px}
.mobile-select{display:none}
.shell{position:relative;z-index:1;display:grid;grid-template-columns:292px minmax(0,1fr);height:calc(100vh - 68px)}
.sidebar{
  overflow:auto;border-right:1px solid var(--line);padding:14px 10px 50px;
  background:rgba(10,16,24,.58);
}
.sidebar-head{
  display:flex;justify-content:space-between;color:var(--dim);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  padding:4px 10px 10px;
}
.root-group{margin:2px 0}
.root-head{
  width:100%;display:flex;align-items:center;gap:8px;background:none;border:0;
  padding:9px 8px;border-radius:8px;cursor:pointer;text-align:left;color:var(--muted);
}
.root-head:hover{background:rgba(255,255,255,.035)}
.root-head.active{background:rgba(34,211,238,.075);color:var(--text)}
.root-id{font-family:var(--mono);font-size:10.5px;color:var(--cyan);width:20px}
.root-name{flex:1;font-size:12px;line-height:1.35}
.root-count{font-family:var(--mono);font-size:10px;color:var(--dim)}
.root-files{display:none;padding:2px 0 6px 26px}
.root-group.open .root-files{display:block}
.file-item{
  width:100%;display:flex;justify-content:space-between;gap:8px;align-items:center;
  background:none;border:1px solid transparent;border-radius:7px;padding:6px 8px;
  cursor:pointer;text-align:left;color:var(--muted);
}
.file-item:hover{background:rgba(255,255,255,.035);color:var(--text)}
.file-item.active{background:rgba(34,211,238,.09);border-color:rgba(34,211,238,.22);color:var(--text)}
.file-item span:first-child{font-family:var(--mono);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.file-blocks{font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.main{overflow:auto;padding:28px 34px 90px;min-width:0}
.crumbs{display:flex;gap:8px;align-items:center;color:var(--dim);font-family:var(--mono);font-size:11px;margin-bottom:12px}
.crumbs b{color:var(--muted);font-weight:500}
.file-title{margin:0;font-size:clamp(22px,3vw,32px);letter-spacing:-.01em}
.file-sub{margin:8px 0 0;color:var(--muted);font-size:13.5px;line-height:1.7;max-width:900px}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 22px}
.pill{
  display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);
  background:rgba(17,27,39,.7);border-radius:999px;padding:5px 10px;
  font-family:var(--mono);font-size:10.5px;color:var(--muted);
}
.pill b{color:var(--text);font-weight:600}
.section-label{
  display:flex;align-items:center;gap:10px;margin:26px 0 12px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
}
.section-label::after{content:"";height:1px;flex:1;background:linear-gradient(90deg,var(--line2),transparent)}
.pipeline{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding:2px 2px 12px}
.pipeline.single .stage{flex:1 1 100%;max-width:620px}
.stage{
  flex:0 0 172px;min-height:104px;text-align:left;cursor:pointer;
  border:1px solid var(--line2);border-radius:12px;padding:12px;
  background:linear-gradient(160deg,rgba(21,33,49,.95),rgba(13,20,30,.95));
  position:relative;transition:border-color .15s,transform .15s,box-shadow .15s;
}
.stage:hover{border-color:rgba(34,211,238,.55);transform:translateY(-2px);box-shadow:0 10px 26px rgba(0,0,0,.35)}
.stage-num{font-family:var(--mono);font-size:9.5px;color:var(--cyan);letter-spacing:.12em}
.stage-name{display:block;font-family:var(--mono);font-size:12px;margin:6px 0 4px;color:var(--text);line-height:1.35}
.stage-sub{display:block;color:var(--muted);font-size:10.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.stage .key-dot{position:absolute;top:11px;right:11px;width:6px;height:6px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px rgba(251,191,36,.7)}
.flow-arrow{align-self:center;flex:0 0 16px;text-align:center;color:var(--cyan);font-family:var(--mono);font-size:15px;opacity:.8}
.class-group{
  margin:16px 0 24px;border:1px solid var(--line);border-radius:15px;
  background:rgba(13,20,30,.62);overflow:hidden;
}
.class-group > .block-card{border:0;border-bottom:1px solid var(--line);border-radius:0;background:linear-gradient(180deg,rgba(167,139,250,.07),transparent)}
.methods{position:relative;padding:12px 14px 14px 34px;display:flex;flex-direction:column;gap:8px}
.methods::before{
  content:"";position:absolute;left:19px;top:2px;bottom:18px;width:1px;
  background:linear-gradient(180deg,rgba(167,139,250,.5),rgba(34,211,238,.18));
}
.block-card{
  position:relative;display:block;width:100%;text-align:left;cursor:pointer;
  border:1px solid var(--line);border-radius:11px;padding:12px 14px;
  background:rgba(17,27,39,.62);color:var(--text);
  transition:border-color .15s,background .15s,transform .15s;
}
.block-card:hover{border-color:rgba(34,211,238,.45);background:rgba(21,33,49,.85);transform:translateX(2px)}
.block-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{
  display:inline-flex;align-items:center;border-radius:5px;padding:2px 6px;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.06em;border:1px solid transparent;
}
.badge.cls{color:var(--violet);background:rgba(167,139,250,.10);border-color:rgba(167,139,250,.28)}
.badge.method{color:var(--cyan);background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.24)}
.badge.func{color:var(--amber);background:rgba(251,191,36,.08);border-color:rgba(251,191,36,.24)}
.badge.entry{color:var(--emerald);background:rgba(52,211,153,.08);border-color:rgba(52,211,153,.24)}
.badge.const{color:var(--slate);background:rgba(148,163,184,.08);border-color:rgba(148,163,184,.22)}
.block-name{font-family:var(--mono);font-size:12.5px;color:var(--text)}
.block-line{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--dim)}
.block-logic{margin:8px 0 0;color:var(--muted);font-size:12.5px;line-height:1.65}
.key-flag{
  display:inline-flex;margin-top:9px;border:1px solid rgba(251,191,36,.3);
  background:rgba(251,191,36,.07);color:var(--amber);border-radius:5px;
  padding:2px 7px;font-family:var(--mono);font-size:9.5px;
}
.func-flow{display:flex;flex-direction:column;gap:6px}
.down-arrow{text-align:center;color:var(--cyan);opacity:.55;font-family:var(--mono);font-size:13px;line-height:1}
.const-chip{
  display:inline-flex;align-items:center;gap:8px;cursor:pointer;margin:6px 0 8px;
  border:1px dashed var(--line2);border-radius:8px;background:rgba(148,163,184,.05);
  color:var(--muted);padding:7px 10px;font-family:var(--mono);font-size:10.5px;
}
.const-chip:hover{border-color:var(--slate);color:var(--text)}
.entry-wrap{margin-top:14px}
.src-warn{
  margin:0 0 8px;padding:9px 12px;border:1px solid rgba(251,191,36,.26);
  border-radius:9px;background:rgba(251,191,36,.055);color:#e8c879;font-size:11.5px;line-height:1.6;
}
.drawer-backdrop{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.58);backdrop-filter:blur(2px)}
.drawer{
  position:fixed;top:0;right:0;z-index:60;height:100%;width:min(590px,94vw);
  background:#0a111a;border-left:1px solid var(--line2);
  transform:translateX(102%);transition:transform .22s ease;
  display:flex;flex-direction:column;box-shadow:-30px 0 80px rgba(0,0,0,.5);
}
.drawer.open{transform:none}
.drawer-head{display:flex;gap:12px;align-items:flex-start;padding:18px 20px 14px;border-bottom:1px solid var(--line)}
.drawer-head h2{margin:6px 0 0;font-family:var(--mono);font-size:17px;line-height:1.35}
.drawer-head p{margin:5px 0 0;color:var(--dim);font-family:var(--mono);font-size:10.5px}
.icon-btn{
  margin-left:auto;width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);
  background:rgba(255,255,255,.03);cursor:pointer;color:var(--muted);font-size:18px;line-height:1;
}
.icon-btn:hover{color:var(--text);border-color:var(--cyan)}
.drawer-body{padding:16px 20px 30px;overflow:auto}
.annotation{margin:0 0 14px;color:var(--muted);font-size:12.5px;line-height:1.75}
.tabs{display:flex;gap:6px;margin:4px 0 10px;border-bottom:1px solid var(--line);padding-bottom:8px}
.tab{
  border:1px solid transparent;background:none;border-radius:7px;padding:6px 10px;
  cursor:pointer;color:var(--dim);font-family:var(--mono);font-size:10.5px;
}
.tab:hover{color:var(--text)}
.tab.active{color:var(--cyan);background:rgba(34,211,238,.08);border-color:rgba(34,211,238,.25)}
pre.code{
  margin:0;white-space:pre;overflow:auto;tab-size:2;
  font-family:var(--mono);font-size:12px;line-height:1.7;
  background:#060a0f;border:1px solid var(--line);border-radius:10px;padding:14px;
  max-height:56vh;color:#cfe3ee;
}
pre.code.source{font-size:11.5px;color:#b8c9d6}
[hidden]{display:none!important}
@media(max-width:980px){
  .shell{grid-template-columns:1fr;height:auto}
  .sidebar{display:none}
  .mobile-select{
    display:block;width:100%;height:38px;border-radius:9px;border:1px solid var(--line2);
    background:#0d141e;color:var(--text);padding:0 10px;font-size:12px;
  }
  .topbar{flex-wrap:wrap;min-height:0;padding:12px 16px;gap:10px}
  .brand{min-width:0;flex:1}
  .search-wrap{order:3;flex:1 1 100%;max-width:none}
  .main{padding:20px 16px 70px}
  .pipeline{flex-direction:column;overflow:visible}
  .flow-arrow{transform:rotate(90deg);align-self:flex-start;margin-left:18px}
  .stage{flex:1 1 auto;width:100%}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;scroll-behavior:auto!important}
}
</style>

 * (self.length - 2) + ['T']","            else:","                line = ['.'] * self.length","            if self.x == i:","                line[self.y] = 'o'  # 用 o 覆盖当前位置，表示智能体。","            print(''.join(line))","        # 将光标移回地图顶部，下一帧可以覆盖当前画面形成动画效果。","        print('\\033[' + str(self.height + 1) + 'A')","        time.sleep(1.0 / frames)","","    def step(self, action):","        \"\"\"执行一个动作，并返回奖励、下一个状态和终止标志。","","        动作编号为：0 表示上，1 表示下，2 表示左，3 表示右。","        \"\"\"","        # 每个动作对应 (x, y) 坐标的变化量。","        change = [[0, 1], [0, -1], [-1, 0], [1, 0]]","","        # 限制坐标范围，防止智能体移动到地图之外。","        self.x = min(self.height - 1, max(0, self.x + change[action][0]))","        self.y = min(self.length - 1, max(0, self.y + change[action][1]))","","        states = [self.x, self.y]","        reward = -1  # 每走一步默认获得 -1 的惩罚。","        terminal = False","        if self.x == 0:  # 智能体到达起点、悬崖和终点所在的第 0 行。","            if self.y > 0:  # 不在起点，说明可能进入了悬崖或到达终点。","                terminal = True","                if self.y != self.length - 1:  # 除终点外，第 0 行的位置都属于悬崖。","                    reward = -100  # 掉入悬崖，获得较大的负奖励。","        return reward, states, terminal","","    def reset(self):","        # 将环境恢复到初始状态，供新一轮训练使用。","        self.x = 0","        self.y = 0"],"pseudo":""},{"kind":"方法","kc":"method","name":"Env.__init__","line":"8-14","logic":"接收 length、height，保存地图尺寸，并将智能体坐标 (x, y) 初始化为起点 (0, 0)。","srcStart":8,"src":["    def __init__(self, length, height):","        # 定义地图的宽度和高度。","        self.length = length","        self.height = height","        # 智能体从左下角的起点 (0, 0) 出发。","        self.x = 0","        self.y = 0"],"pseudo":""},{"kind":"方法","kc":"method","name":"Env.render","line":"16-29","logic":"按行构造地图字符（S 起点、x 悬崖、T 终点、. 空地），用 o 标出 (x, y)，打印后光标上移并按 frames 休眠形成动画。","srcStart":16,"src":["    def render(self, frames=50):","        # 按行打印当前地图，并用 'o' 标记智能体的位置。","        for i in range(self.height):","            if i == 0:  # 第 0 行是起点、悬崖和终点所在的行。","                # S 表示起 时选择第一个动作。","            actions_value = [self.table[self._index(a, x, y)] for a in range(self.actions)]","            return actions_value.index(max(actions_value))","","    def max_q(self, x, y):","        actions_value = [self.table[self._index(a, x, y)] for a in range(self.actions)]","        return max(actions_value)","","    def update(self, a, s0, s1, r, is_terminated, next_action=None):","        \"\"\"按照 Q-learning 更新公式更新 Q(s, a)。\"\"\"","        # s0 和 s1 的格式都是 [x, y]。","        q_predict = self.table[self._index(a, s0[0], s0[1])]","        if not is_terminated:","            # Q-learning 使用下一状态的最大 Q 值，而不是实际执行的下一动作。","            q_target = r + self.gamma * self.max_q(s1[0], s1[1])","        else:","            # 终止状态没有下一步价值，只保留当前奖励。","            q_target = r","        self.table[self._index(a, s0[0], s0[1])] += self.alpha * (q_target - q_predict)"],"pseudo":""},{"kind":"方法","kc":"method","name":"QTable.__init__","line":"8-15","logic":"按 actions × length × height 创建全零一维 Q 表，并保存动作数、地图尺寸、学习率 alpha 和折扣因子 gamma。","srcStart":8,"src":["    def __init__(self, length, height, actions=4, alpha=0.1, gamma=0.9):","        # 将三维的 Q(s, a) 表展平成一维列表，初始值全部设为 0。","        self.table = [0] * actions * length * height","        self.actions = actions","        self.length = length","        self.height = height","        self.alpha = alpha","        self.gamma = gamma"],"pseudo":""},{"kind":"方法","kc":"method","name":"QTable._index","line":"17-19","logic":"把动作 a 与状态 (x, y) 映射为一维下标 a*height*length + x*length + y。","srcStart":17,"src":["    def _index(self, a, x, y):","        \"\"\"Return the index of Q([x,y], a) in Q_table.\"\"\"","        return a * self.height * self.length + x * self.length + y"],"pseudo":""},{"kind":"方法","kc":"method","name":"QTable._epsilon","line":"21-23","logic":"返回 config 中的固定探索率 EXPLORATION_RATE。","srcStart":21,"src":["    def _epsilon(self):","        \"\"\"返回 epsilon-greedy 策略中的随机探索概率。\"\"\"","        return EXPLORATION_RATE"],"pseudo":""},{"kind":"方法","kc":"method","name":"QTable.take_action","line":"25-33","logic":"以 epsilon 概率随机选择动作，否则读取 (x, y) 下所有动作的 Q 值并返回最大值对应动作，并列时取第一个。","srcStart":25,"src":["    def take_action(self, x, y):","        \"\"\"使用 epsilon-greedy 策略选择动作。\"\"\"","        if random.random() < self._epsilon():","            # 随机探索：从所有合法动作中随机选择一个。","            return random.randrange(self.actions)","        else:","            # 利用当前 Q 值最大的动作；并列时选择第一个动作。","            actions_value = [self.table[self._index(a, x, y)] for a in range(self.actions)]","            return actions_value.index(max(actions_value))"],"pseudo":"if rand() < epsilon:\n    return random_action()\nreturn argmax_a Q[s, a]"},{"kind":"方法","kc":"method","name":"QTable.max_q","line":"35-37","logic":"收集状态 (x, y) 在全部动作上的 Q 值并返回最大值。","srcStart":35,"src":["    def max_q(self, x, y):","        actions_value = [self.table[self._index(a, x, y)] for a in range(self.actions)]","        return max(actions_value)"],"pseudo":"return max_a Q[s, a]"},{"kind":"方法","kc":"method","name":"QTable.update","line":"39-49","logic":"读取 Q(s0, a)；非终止时用 r + gamma*max_a'Q(s1, a')、终止时用 r 作为目标，按 alpha 做增量更新；next_action 参数未使用。","srcStart":39,"src":["    def update(self, a, s0, s1, r, is_terminated, next_action=None):","        \"\"\"按照 Q-learning 更新公式更新 Q(s, a)。\"\"\"","        # s0 和 s1 的格式都是 [x, y]。","        q_predict = self.table[self._index(a, s0[0], s0[1])]","        if not is_terminated:","            # Q-learning 使用下一状态的最大 Q 值，而不是实际执行的下一动作。","            q_target = r + self.gamma * self.max_q(s1[0], s1[1])","        else:","            # 终止状态没有下一步价值，只保留当前奖励。","            q_target = r","        self.table[self._index(a, s0[0], s0[1])] += self.alpha * (q_target - q_predict)"],"pseudo":"# Q-learning: 目标动作由 max 选出\ns, a, r, s2, done = transition\nif done:\n    target = r\nelse:\n    target = r + gamma * max_a2 Q[s2, a2]\nQ[s, a] += lr * (target - Q[s, a])"}],"stages":[2,3,4,5],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5,6,7]}],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"01_Cliff Walking/sarsa.py","rootId":"01","rootDir":"01_Cliff Walking","name":"sarsa.py","dir":"01_Cliff Walking","purpose":"实现表格型 SARSA 的 Q 表、epsilon-greedy 动作选择和 on-policy 时序差分更新。","lines":57,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-3","logic":"导入 random 以及 config 中的固定探索率 EXPLORATION_RATE。","srcStart":1,"src":["import random","","from config import EXPLORATION_RATE"],"pseudo":""},{"kind":"类","kc":"cls","name":"SarsaTable","line":"6-57","logic":"SarsaTable 用一维列表存储 Q(s, a)，提供 epsilon-greedy 选动作与使用实际下一动作的 SARSA 更新。","srcStart":6,"src":["class SarsaTable:","\t\"\"\"SARSA 的 Q 表、动作选择和参数更新逻辑。\"\"\"","","\tdef __init__(self, length, height, actions=4, alpha=0.1, gamma=0.9):","\t\t# 将 Q(s, a) 表展平成一维列表，所有状态-动作价值初始为 0。","\t\tself.table = [0] * actions * length * height","\t\tself.actions = actions","\t\tself.length = length","\t\tself.height = height","\t\tself.alpha = alpha","\t\tself.gamma = gamma","","\tdef _index(self, action, x, y):","\t\t\"\"\"返回 Q([x, y], action) 在一维 Q 表中的下标。\"\"\"","\t\treturn action * self.height * self.length + x * self.length + y","","\tdef _epsilon(self):","\t\t\"\"\"返回 epsilon-greedy 策略中的随机探索概率。\"\"\"","\t\treturn EXPLORATION_RATE","","\tdef take_action(self, x, y):","\t\t\"\"\"使用 epsilon-greedy 策略选择动作。\"\"\"","\t\tif random.random() < self._epsilon():","\t\t\t# 探索：随机选择一个动作。","\t\t\treturn random.randrange(self.actions)","","\t\t# 利用：选择当前状态下 Q 值最大的动作。","\t\taction_values = [","\t\t\tself.table[self._index(action, x, y)]","\t\t\tfor action in range(self.actions)","\t\t]","\t\treturn action_values.index(max(action_values))","","\tdef update(self, action, state, next_state, reward, is_terminated, next_action=None):","\t\t\"\"\"按照 SARSA 公式更新 Q(s, a)。","","\t\tSARSA 使用实际执行的下一动作 next_action 计算目标值，","\t\t而不是像 Q-learning 那样选择下一状态的最大 Q 值。","\t\t\"\"\"","\t\tcurrent_index = self._index(action, state[0], state[1])","\t\tq_predict = self.table[current_index]","","\t\tif is_terminated:","\t\t\t# 终止状态没有下一步动作，因此目标值只有当前奖励。","\t\t\tq_target = reward","\t\telse:","\t\t\tif next_action is None:","\t\t\t\traise ValueError(\"非终止状态必须提供 next_action。\")","\t\t\tnext_index = self._index(next_action, next_state[0], next_state[1])","\t\t\tq_target = reward + self.gamma * self.table[next_index]","","\t\tself.table[current_index] += self.alpha * (q_target - q_predict)"],"pseudo":""},{"kind":"方法","kc":"method","name":"SarsaTable.__init__","line":"9-16","logic":"按 actions × length × height 创建全零一维 Q 表，并保存动作数、地图尺寸、学习率 alpha 和折扣因子 gamma。","srcStart":9,"src":["\tdef __init__(self, length, height, actions=4, alpha=0.1, gamma=0.9):","\t\t# 将 Q(s, a) 表展平成一维列表，所有状态-动作价值初始为 0。","\t\tself.table = [0] * actions * length * height","\t\tself.actions = actions","\t\tself.length = length","\t\tself.height = height","\t\tself.alpha = alpha","\t\tself.gamma = gamma"],"pseudo":""},{"kind":"方法","kc":"method","name":"SarsaTable._index","line":"18-20","logic":"把动作 action 与状态 (x, y) 映射为一维下标 action*height*length + x*length + y。","srcStart":18,"src":["\tdef _index(self, action, x, y):","\t\t\"\"\"返回 Q([x, y], action) 在一维 Q 表中的下标。\"\"\"","\t\treturn action * self.height * self.length + x * self.length + y"],"pseudo":""},{"kind":"方法","kc":"method","name":"SarsaTable._epsilon","line":"22-24","logic":"返回 config 中的固定探索率 EXPLORATION_RATE。","srcStart":22,"src":["\tdef _epsilon(self):","\t\t\"\"\"返回 epsilon-greedy 策略中的随机探索概率。\"\"\"","\t\treturn EXPLORATION_RATE"],"pseudo":""},{"kind":"方法","kc":"method","name":"SarsaTable.take_action","line":"26-37","logic":"以 epsilon 概率随机选择动作，否则读取状态 (x, y) 的全部动作 Q 值并返回最大值对应动作。","srcStart":26,"src":["\tdef take_action(self, x, y):","\t\t\"\"\"使用 epsilon-greedy 策略选择动作。\"\"\"","\t\tif random.random() < self._epsilon():","\t\t\t# 探索：随机选择一个动作。","\t\t\treturn random.randrange(self.actions)","","\t\t# 利用：选择当前状态下 Q 值最大的动作。","\t\taction_values = [","\t\t\tself.table[self._index(action, x, y)]","\t\t\tfor action in range(self.actions)","\t\t]","\t\treturn action_values.index(max(action_values))"],"pseudo":"if rand() < epsilon:\n    return random_action()\nreturn argmax_a Q[s, a]"},{"kind":"方法","kc":"method","name":"SarsaTable.update","line":"39-57","logic":"读取 Q(s, a)；终止时目标为 reward，非终止时要求 next_action 并用 reward + gamma*Q(s', next_action) 计算目标，再按 alpha 更新。","srcStart":39,"src":["\tdef update(self, action, state, next_state, reward, is_terminated, next_action=None):","\t\t\"\"\"按照 SARSA 公式更新 Q(s, a)。","","\t\tSARSA 使用实际执行的下一动作 next_action 计算目标值，","\t\t而不是像 Q-learning 那样选择下一状态的最大 Q 值。","\t\t\"\"\"","\t\tcurrent_index = self._index(action, state[0], state[1])","\t\tq_predict = self.table[current_index]","","\t\tif is_terminated:","\t\t\t# 终止状态没有下一步动作，因此目标值只有当前奖励。","\t\t\tq_target = reward","\t\telse:","\t\t\tif next_action is None:","\t\t\t\traise ValueError(\"非终止状态必须提供 next_action。\")","\t\t\tnext_index = self._index(next_action, next_state[0], next_state[1])","\t\t\tq_target = reward + self.gamma * self.table[next_index]","","\t\tself.table[current_index] += self.alpha * (q_target - q_predict)"],"pseudo":"# SARSA: 目标动作是实际执行的 a2\ns, a, r, s2, a2, done = transition\nif done:\n    target = r\nelse:\n    target = r + gamma * Q[s2, a2]\nQ[s, a] += lr * (target - Q[s, a])"}],"stages":[2,3,4,5],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5,6]}],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"01_Cliff Walking/train.py","rootId":"01","rootDir":"01_Cliff Walking","name":"train.py","dir":"01_Cliff Walking","purpose":"串联环境与表格算法，执行多回合 epsilon-greedy 训练并定期打印回合累计奖励。","lines":47,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-13","logic":"导入 config 超参数、Env 以及 QTable（默认别名为 AlgorithmTable）；SARSA 的导入语句被注释，切换后即可训练 SARSA。","srcStart":1,"src":["from config import (","    DISCOUNT_FACTOR,","    LEARNING_RATE,","    MAP_HEIGHT,","    MAP_LENGTH,","    NUM_ACTIONS,","    NUM_EPISODES,","    PRINT_INTERVAL,",")","from environment import Env","from q_learning import QTable as AlgorithmTable","# 如果要使用 SARSA，将上一行注释掉，并取消下一行的注释。","# from sarsa import SarsaTable as AlgorithmTable"],"pseudo":""},{"kind":"函数","kc":"func","name":"cliff_walk","line":"16-47","logic":"创建环境与算法表，循环 NUM_EPISODES 个回合；每步选择动作、调用 env.step，非终止时预选下一动作，调用 table.update，累计奖励并推进状态；每 PRINT_INTERVAL 回合打印分数，回合结束后 env.reset。","srcStart":16,"src":["def cliff_walk():","    \"\"\"训练智能体通过悬崖地图，并输出每 20 回合的累计奖励。\"\"\"","    env = Env(length=MAP_LENGTH, height=MAP_HEIGHT)","    table = AlgorithmTable(","        length=MAP_LENGTH,","        height=MAP_HEIGHT,","        actions=NUM_ACTIONS,","        alpha=LEARNING_RATE,","        gamma=DISCOUNT_FACTOR,","    )","    for num_episode in range(NUM_EPISODES):","        # 每次循环代表一个完整的训练回合。","        episodic_reward = 0","        is_terminated = False","        s0 = [0, 0]","        while not is_terminated:","            # 在当前状态选择动作，与环境交互后更新 Q 值。","            action = table.take_action(s0[0], s0[1])","            r, s1, is_terminated = env.step(action)","","            # 统一提前选择下一动作：SARSA 会使用它，Q-learning 会忽略它。","            next_action = None","            if not is_terminated:","                next_action = table.take_action(s1[0], s1[1])","","            table.update(action, s0, s1, r, is_terminated, next_action)","            episodic_reward += r","            # env.render(frames=100)","            s0 = s1","        if num_episode % PRINT_INTERVAL == 0:","            print(\"Episode: {}, Score: {}\".format(num_episode, episodic_reward))","        env.reset()"],"pseudo":""}],"stages":[1],"classGroups":[],"funcIdxs":[1],"entryIdxs":[],"constIdx":0}]},{"id":"02","dir":"02_DQN","branch":"价值型","short":"最小 DQN 练习","summary":"提供 DQN 的经验回放、Q 网络和智能体更新实现，并附带在线/离线训练循环、滑动平均与优势估计工具。","files":[{"path":"02_DQN/practice.py","rootId":"02","rootDir":"02_DQN","name":"practice.py","dir":"02_DQN","purpose":"汇集 DQN 练习组件：经验回放池、单隐藏层 Q 网络和 DQN 智能体的动作选择与学习更新。","lines":76,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-9","logic":"导入 random、gymnasium、numpy、collections、tqdm、torch、torch.nn.functional、matplotlib 和 rl_utils，为回放池、网络与可视化准备依赖。","srcStart":1,"src":["import random","import gymnasium as gym","import numpy as np","import collections","from tqdm import tqdm","import torch","import torch.nn.functional as F","import matplotlib.pyplot as plt","import rl_utils"],"pseudo":""},{"kind":"类","kc":"cls","name":"ReplayBuffer","line":"11-25","logic":"ReplayBuffer 用 deque 保存固定容量的经验五元组，支持追加、随机采样和读取当前大小。","srcStart":11,"src":["class ReplayBuffer:","    '''经验回放池'''","    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity) #队列，先进先出","","    def add(self, state, action, reward, next_state, done): #将数据加入buffer","        self.buffer.append((state, action, reward, next_state, done))","","    def sample(self, batch_size): #从buffer中采样数据, 数量为batch_size","        transitions = random.sample(self.buffer, batch_size) #随机采样","        states, actions, rewards, next_states, dones = zip(*transitions) #解压","        return np.array(states), actions, rewards, np.array(next_states), dones","","    def size(self): #目前buffer中数据的数量","        return len(self.buffer)"],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.__init__","line":"13-14","logic":"用最大长度为 capacity 的 collections.deque 创建先进先出回放池，超出容量时自动丢弃最旧经验。","srcStart":13,"src":["    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity) #队列，先进先出"],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.add","line":"16-17","logic":"把 (state, action, reward, next_state, done) 五元组追加到回放池尾部。","srcStart":16,"src":["    def add(self, state, action, reward, next_state, done): #将数据加入buffer","        self.buffer.append((state, action, reward, next_state, done))"],"pseudo":"buffer.append((s, a, r, s2, done))\nif len(buffer) > capacity:\n    buffer.popleft()"},{"kind":"方法","kc":"method","name":"ReplayBuffer.sample","line":"19-22","logic":"随机抽取 batch_size 条经验并用 zip(*transitions) 解包，返回 numpy 状态/下一状态数组以及动作、奖励、done 元组。","srcStart":19,"src":["    def sample(self, batch_size): #从buffer中采样数据, 数量为batch_size","        transitions = random.sample(self.buffer, batch_size) #随机采样","        states, actions, rewards, next_states, dones = zip(*transitions) #解压","        return np.array(states), actions, rewards, np.array(next_states), dones"],"pseudo":"batch = random.sample(buffer, batch_size)\nreturn zip(*batch)   # states, actions, rewards, next_states, dones"},{"kind":"方法","kc":"method","name":"ReplayBuffer.size","line":"24-25","logic":"返回回放池当前保存的经验条数。","srcStart":24,"src":["    def size(self): #目前buffer中数据的数量","        return len(self.buffer)"],"pseudo":""},{"kind":"类","kc":"cls","name":"Qnet","line":"27-36","logic":"Qnet 是单隐藏层多层感知机，将状态映射为每个离散动作的 Q 值。","srcStart":27,"src":["class Qnet(torch.nn.Module):","    '''只有一层隐藏层的Q网络'''","    def __init__(self, state_dim, hidden_dim, action_dim):","        super(Qnet, self).__init__()","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim) #输入层到隐藏层","        self.fc2 = torch.nn.Linear(hidden_dim, action_dim) #隐藏层到输出层","","    def forward(self, x): #前向传播","        x = F.relu(self.fc1(x)) #隐藏层使用ReLU激活函数","        return self.fc2(x)"],"pseudo":""},{"kind":"方法","kc":"method","name":"Qnet.__init__","line":"29-32","logic":"注册 state_dim→hidden_dim 的 fc1 与 hidden_dim→action_dim 的 fc2 两个线性层。","srcStart":29,"src":["    def __init__(self, state_dim, hidden_dim, action_dim):","        super(Qnet, self).__init__()","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim) #输入层到隐藏层","        self.fc2 = torch.nn.Linear(hidden_dim, action_dim) #隐藏层到输出层"],"pseudo":""},{"kind":"方法","kc":"method","name":"Qnet.forward","line":"34-36","logic":"对输入先做 fc1 线性变换和 ReLU 激活，再经 fc2 输出各动作的 Q 值。","srcStart":34,"src":["    def forward(self, x): #前向传播","        x = F.relu(self.fc1(x)) #隐藏层使用ReLU激活函数","        return self.fc2(x)"],"pseudo":"h = relu(fc1(s))\nh = relu(fc2(h))\nreturn fc3(h)   # 每个离散动作一个 Q 值"},{"kind":"类","kc":"cls","name":"DQN","line":"38-76","logic":"DQN 维护在线网络、目标网络与 Adam 优化器，提供 epsilon-greedy 动作选择和基于 TD 目标的批量更新。","srcStart":38,"src":["class DQN:","    '''DQN算法'''","    def __init__(self, state_dim, hidden_dim, action_dim, learning_rate, gamma, epsilon, target_update, device):","        self.action_dim = action_dim","        self.q_net = Qnet(state_dim, hidden_dim, action_dim).to(device) #Q网络","        self.target_q_net = Qnet(state_dim, hidden_dim, action_dim).to(device) #目标Q网络","        self.optimizer = torch.optim.Adam(self.q_net.parameters(), lr=learning_rate) #Adam优化器","        self.gamma = gamma #折扣因子","        self.epsilon = epsilon #epsilon-greedy","        self.target_update = target_update #目标网络更新频率","        self.count = 0 #计数器，记录更新次数","        self.device = device #设备","","    def take_action(self, state): #epsilon-greedy采取策略","        if np.random.random() < self.epsilon:","            action = np.random.randint(self.action_dim) #随机选择动作","        else:","            state = torch.tensor([state], dtype = torch.float).to(self.device) #将状态转换为tensor","            action = self.q_net(state).argmax().item() #选择Q值最大的动作","        return action","","    def update(self, transition_dict):","        states = torch.tensor(transition_dict['rewards'], dtype = torch.float).to(self.device)","        actions = torch.tensor(transition_dict['actions'], dtype = torch.long).view(-1, 1).to(self.device)","        rewards = torch.tensor(transition_dict['rewards'], dtype = torch.float).view(-1, 1).to(self.device)","        next_states = torch.tensor(transition_dict['next_states'], dtype = torch.float).to(self.device)","        dones = torch.tensor(transition_dict['dones'], dtype = torch.float).view(-1, 1).to(self.device)","        q_values = self.q_net(states).gather(1, actions) #当前状态的Q值","        max_next_q_values = self.target_q_net(next_states).max(1)[0].view(-1, 1) #下一个状态的最大Q值","        q_targets = rewards + self.gamma * max_next_q_values * (1 - dones) #TD误差目标","        dqn_loss = torch.mean(F.mse_loss(q_values, q_targets)) #均方误差损失函数","        self.optimizer.zero_grad() #Pytorch中默认梯度会累积，这里需要显式将梯度设置为0","        dqn_loss.backward() #反向传播","        self.optimizer.step() #更新参数","","        if self.count % self.target_update == 0: #每隔target_update步更新目标网络","            self.target_q_net.load_state_dict(self.q_net.state_dict()) #将Q网络的参数复制到目标Q网络","","        self.count += 1"],"pseudo":""},{"kind":"方法","kc":"method","name":"DQN.__init__","line":"40-49","logic":"保存动作维度、gamma、epsilon、目标网络更新周期和 device；构建在线/目标 Qnet 并用 Adam 优化在线网络参数，更新计数器 count 初始化为 0。","srcStart":40,"src":["    def __init__(self, state_dim, hidden_dim, action_dim, learning_rate, gamma, epsilon, target_update, device):","        self.action_dim = action_dim","        self.q_net = Qnet(state_dim, hidden_dim, action_dim).to(device) #Q网络","        self.target_q_net = Qnet(state_dim, hidden_dim, action_dim).to(device) #目标Q网络","        self.optimizer = torch.optim.Adam(self.q_net.parameters(), lr=learning_rate) #Adam优化器","        self.gamma = gamma #折扣因子","        self.epsilon = epsilon #epsilon-greedy","        self.target_update = target_update #目标网络更新频率","        self.count = 0 #计数器，记录更新次数","        self.device = device #设备"],"pseudo":""},{"kind":"方法","kc":"method","name":"DQN.take_action","line":"51-57","logic":"以 epsilon 概率随机返回一个动作，否则将 state 转为 float tensor 送入 q_net，并返回 Q 值最大的动作编号。","srcStart":51,"src":["    def take_action(self, state): #epsilon-greedy采取策略","        if np.random.random() < self.epsilon:","            action = np.random.randint(self.action_dim) #随机选择动作","        else:","            state = torch.tensor([state], dtype = torch.float).to(self.device) #将状态转换为tensor","            action = self.q_net(state).argmax().item() #选择Q值最大的动作","        return action"],"pseudo":"if rand() < epsilon:\n    return random_action()\nreturn argmax_a Q(s, a)"},{"kind":"方法","kc":"method","name":"DQN.update","line":"59-76","logic":"把 transition_dict 批量转为 tensor（当前实现中 states 实际取自 rewards 字段），用 gather 取 Q(s,a)，用目标网络计算下一状态最大 Q，构造 r + gamma*maxQ*(1-done)，计算 MSE 后反向传播并更新参数；每 target_update 次把在线网络参数复制到目标网络并递增 count。","srcStart":59,"src":["    def update(self, transition_dict):","        states = torch.tensor(transition_dict['rewards'], dtype = torch.float).to(self.device)","        actions = torch.tensor(transition_dict['actions'], dtype = torch.long).view(-1, 1).to(self.device)","        rewards = torch.tensor(transition_dict['rewards'], dtype = torch.float).view(-1, 1).to(self.device)","        next_states = torch.tensor(transition_dict['next_states'], dtype = torch.float).to(self.device)","        dones = torch.tensor(transition_dict['dones'], dtype = torch.float).view(-1, 1).to(self.device)","        q_values = self.q_net(states).gather(1, actions) #当前状态的Q值","        max_next_q_values = self.target_q_net(next_states).max(1)[0].view(-1, 1) #下一个状态的最大Q值","        q_targets = rewards + self.gamma * max_next_q_values * (1 - dones) #TD误差目标","        dqn_loss = torch.mean(F.mse_loss(q_values, q_targets)) #均方误差损失函数","        self.optimizer.zero_grad() #Pytorch中默认梯度会累积，这里需要显式将梯度设置为0","        dqn_loss.backward() #反向传播","        self.optimizer.step() #更新参数","","        if self.count % self.target_update == 0: #每隔target_update步更新目标网络","            self.target_q_net.load_state_dict(self.q_net.state_dict()) #将Q网络的参数复制到目标Q网络","","        self.count += 1"],"pseudo":"batch = replay.sample(B)\nq = Q_online(s).gather(1, a)\nif dqn_type == \"DoubleDQN\":\n    a2 = argmax_a Q_online(s')\n    q2 = Q_target(s').gather(1, a2)\nelse:\n    q2 = max_a Q_target(s')\ntarget = r + gamma * q2 * (1 - done)\nloss = MSE(q, target)\nupdate Q_online\nevery C steps: Q_target <- Q_online"}],"stages":[2,11,12],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5]},{"classIdx":6,"methodIdxs":[7,8]},{"classIdx":9,"methodIdxs":[10,11,12]}],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"02_DQN/rl_utils.py","rootId":"02","rootDir":"02_DQN","name":"rl_utils.py","dir":"02_DQN","purpose":"提供 DQN/策略梯度常用的经验回放、滑动平均、在线与离线训练循环及优势计算工具。","lines":90,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-5","logic":"导入 tqdm、numpy、torch、collections 和 random，供训练进度、数值计算、回放池与采样使用。","srcStart":1,"src":["from tqdm import tqdm","import numpy as np","import torch","import collections","import random"],"pseudo":""},{"kind":"类","kc":"cls","name":"ReplayBuffer","line":"7-20","logic":"ReplayBuffer 用 deque 保存经验五元组，支持 add、随机 sample 和 size 查询。","srcStart":7,"src":["class ReplayBuffer:","    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity) ","","    def add(self, state, action, reward, next_state, done): ","        self.buffer.append((state, action, reward, next_state, done)) ","","    def sample(self, batch_size): ","        transitions = random.sample(self.buffer, batch_size)","        state, action, reward, next_state, done = zip(*transitions)","        return np.array(state), action, reward, np.array(next_state), done ","","    def size(self): ","        return len(self.buffer)"],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.__init__","line":"8-9","logic":"按给定 capacity 创建有最大长度的 deque，作为先进先出经验池。","srcStart":8,"src":["    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity) "],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.add","line":"11-12","logic":"将 (state, action, reward, next_state, done) 追加到回放池。","srcStart":11,"src":["    def add(self, state, action, reward, next_state, done): ","        self.buffer.append((state, action, reward, next_state, done)) "],"pseudo":"buffer.append((s, a, r, s2, done))\nif len(buffer) > capacity:\n    buffer.popleft()"},{"kind":"方法","kc":"method","name":"ReplayBuffer.sample","line":"14-17","logic":"随机抽取 batch_size 条经验并用 zip(*transitions) 解包，返回 numpy 状态/下一状态数组以及动作、奖励、done 元组。","srcStart":14,"src":["    def sample(self, batch_size): ","        transitions = random.sample(self.buffer, batch_size)","        state, action, reward, next_state, done = zip(*transitions)","        return np.array(state), acti ct['next_states'].append(next_state)","                    transition_dict['rewards'].append(reward)","                    transition_dict['dones'].append(done)","                    state = next_state","                    episode_return += reward","                return_list.append(episode_return)","                agent.update(transition_dict)","                if (i_episode+1) % 10 == 0:","                    pbar.set_postfix({'episode': '%d' % (num_episodes/10 * i + i_episode+1), 'return': '%.3f' % np.mean(return_list[-10:])})","                pbar.update(1)","    return return_list"],"pseudo":"for episode in 1 ... num_episodes:\n    rollout = []\n    s = env.reset()\n    done = False\n    while not done:\n        a = agent.take_action(s)\n        s2, r, terminated, truncated, _ = env.step(a)\n        done = terminated or truncated\n        rollout.append((s, a, r, s2, terminated))\n        s = s2\n    agent.update(rollout)"},{"kind":"函数","kc":"func","name":"train_off_policy_agent","line":"56-78","logic":"同样分 10 轮训练；每步把交互结果写入 replay_buffer，当 buffer 大小超过 minimal_size 时采样 batch_size 条组成 transition_dict 调用 agent.update，同时记录每回合回报并每 10 回合显示最近均值。","srcStart":56,"src":["def train_off_policy_agent(env, agent, num_episodes, replay_buffer, minimal_size, batch_size):","    return_list = []","    for i in range(10):","        with tqdm(total=int(num_episodes/10), desc='Iteration %d' % i) as pbar:","            for i_episode in range(int(num_episodes/10)):","                episode_return = 0","                state = env.reset()","                done = False","                while not done:","                    action = agent.take_action(state)","                    next_state, reward, done, _ = env.step(action)","                    replay_buffer.add(state, action, reward, next_state, done)","                    state = next_state","                    episode_return += reward","                    if replay_buffer.size() > minimal_size:","                        b_s, b_a, b_r, b_ns, b_d = replay_buffer.sample(batch_size)","                        transition_dict = {'states': b_s, 'actions': b_a, 'next_states': b_ns, 'rewards': b_r, 'dones': b_d}","                        agent.update(transition_dict)","                return_list.append(episode_return)","                if (i_episode+1) % 10 == 0:","                    pbar.set_postfix({'episode': '%d' % (num_episodes/10 * i + i_episode+1), 'return': '%.3f' % np.mean(return_list[-10:])})","                pbar.update(1)","    return return_list"],"pseudo":"for episode in 1 ... num_episodes:\n    s = env.reset()\n    done = False\n    while not done:\n        a = agent.take_action(s, explore=True)\n        s2, r, terminated, truncated, _ = env.step(a)\n        done = terminated or truncated\n        buffer.add(s, a, r, s2, terminated)\n        if buffer.size >= minimal_size:\n            agent.update(buffer.sample(batch_size))\n        s = s2"},{"kind":"函数","kc":"func","name":"compute_advantage","line":"81-89","logic":"将 td_delta 转为 numpy 后逆序递推 advantage = gamma*lambda*advantage + delta，再反转顺序并转为 float tensor 返回。","srcStart":81,"src":["def compute_advantage(gamma, lmbda, td_delta):","    td_delta = td_delta.detach().numpy()","    advantage_list = []","    advantage = 0.0","    for delta in td_delta[::-1]:","        advantage = gamma * lmbda * advantage + delta","        advantage_list.append(advantage)","    advantage_list.reverse()","    return torch.tensor(advantage_list, dtype=torch.float)"],"pseudo":"adv = 0\nfor t = T-1 ... 0:\n    adv = td_delta[t] + gamma * lambda * adv\n    advantage[t] = adv\nreturn advantage"}],"stages":[2,3,4,6],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5]}],"funcIdxs":[6,7,8,9],"entryIdxs":[],"constIdx":0}]},{"id":"03","dir":"03_Double DQN、Dueling DQN","branch":"价值型","short":"Double / Dueling 统一 pipeline","summary":"在 Pendulum-v1 离散化动作上统一实现 DQN、Double DQN 与 Dueling DQN，用 config 切换算法、共享经验回放与训练流程。","files":[{"path":"03_Double DQN、Dueling DQN/agents.py","rootId":"03","rootDir":"03_Double DQN、Dueling DQN","name":"agents.py","dir":"03_Double DQN、Dueling DQN","purpose":"统一 DQN agent：按 dqn_type 选择普通或 Dueling 网络，并实现 epsilon-greedy 与 TD 更新。","lines":89,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-5","logic":"引入 numpy 负责随机探索、torch 与 F 负责张量和 MSE 损失，并从 networks 导入 Qnet 与 DuelingQnet。","srcStart":1,"src":["import numpy as np","import torch","import torch.nn.functional as F","","from networks import DuelingQnet, Qnet"],"pseudo":""},{"kind":"类","kc":"cls","name":"DQN","line":"8-76","logic":"DQN/Double DQN/Dueling DQN 共用的 agent 类，内部由 dqn_type 决定网络结构和下一状态价值的计算方式。","srcStart":8,"src":["class DQN:","    '''统一的DQN agent，算法差异由dqn_type控制。'''","    def __init__(self, state_dim, hidden_dim, action_dim, learning_rate, gamma, epsilon, target_update, device, dqn_type='DQN'):","        self.action_dim = action_dim","        # DQN和DoubleDQN使用普通Q网络；DuelingDQN只替换网络结构。","        # 三者仍然共享下面的动作选择、经验回放和参数更新流程。","        network = DuelingQnet if dqn_type == 'DuelingDQN' else Qnet","        self.q_net = network(state_dim, hidden_dim, self.action_dim).to(device)","        self.target_q_net = network(state_dim, hidden_dim, self.action_dim).to(device)","        # target network只用于计算训练目标，不直接参与梯度更新。","        self.target_q_net.load_state_dict(self.q_net.state_dict())","        self.optimizer = torch.optim.Adam(self.q_net.parameters(), lr=learning_rate)","        self.gamma = gamma","        self.epsilon = epsilon","        self.target_update = target_update","        self.count = 0","        self.device = device","        self.dqn_type = dqn_type","","    def take_action(self, state):","        # epsilon-greedy：偶尔随机探索，避免只重复当前看起来最好的动作。","        if np.random.random() < self.epsilon:","            action = np.random.randint(self.action_dim)","        else:","            state = torch.tensor([state], dtype=torch.float).to(self.device)","            # q_net输出每个动作的Q值，argmax选择估计回报最高的动作。","            action = self.q_net(state).argmax().item()","        return action","","    def max_q_value(self, state):","        state = torch.tensor([state], dtype=torch.float).to(self.device)","        return self.q_net(state).max().item()","","    def update(self, transition_dict):","        # replay buffer中的一条经验是(s, a, r, s', done)；这里一次取一个batch。","        states = torch.tensor(transition_dict['states'], dtype=torch.float).to(self.device)","        actions = torch.tensor(transition_dict['actions']).view(-1, 1).to(self.device)","        rewards = torch.tensor(transition_dict['rewards'], dtype=torch.float).view(-1, 1).to(self.device)","        next_states = torch.tensor(transition_dict['next_states'], dtype=torch.float).to(self.device)","        dones = torch.tensor(transition_dict['dones'], dtype=torch.float).view(-1, 1).to(self.device)","","        # q_net(states)包含所有动作的Q值，gather只取实际执行动作a对应的Q(s,a)。","        current_q_values = self.q_net(states).gather(1, actions)","","        # 计算下一状态的估计价值。它只是监督学习目标，所以不需要梯度。","        if self.dqn_type == 'DoubleDQN':","            with torch.no_grad():","                # Double DQN：在线网络负责“选动作”，目标网络负责“评估动作”。","                max_action = self.q_net(next_states).max(1)[1].view(-1, 1)","                next_q_values = self.target_q_net(next_states).gather(1, max_action)","        else:","            with torch.no_grad():","                # 普通DQN/DuelingDQN：目标网络同时选择并评估最大Q值动作。","                next_q_values = self.target_q_net(next_states).max(1)[0].view(-1, 1)","","        # Bellman目标：Q_target = r + gamma * Q(s', a')。","        # done为1时表示回合结束，不再使用下一状态价值。","        td_targets = rewards + self.gamma * next_q_values * (1 - dones)","        dqn_loss = F.mse_loss(current_q_values, td_targets)","","        # 只更新online network；target network每隔target_update步整体同步一次。","        self.optimizer.zero_grad()","        dqn_loss.backward()","        self.optimizer.step()","","        if self.count % self.target_update == 0:","            # 延迟同步可以让训练目标在一段时间内保持稳定。","            self.target_q_net.load_state_dict(self.q_net.state_dict())","        self.count += 1"],"pseudo":""},{"kind":"方法","kc":"method","name":"DQN.__init__","line":"10-25","logic":"按 dqn_type 选择 DuelingQnet 或 Qnet 构建在线网络与目标网络，把在线权重同步给目标网络，创建 Adam 优化器并保存 gamma、epsilon、target_update、device 等超参。","srcStart":10,"src":["    def __init__(self, state_dim, hidden_dim, action_dim, learning_rate, gamma, epsilon, target_update, device, dqn_type='DQN'):","        self.action_dim = action_dim","        # DQN和DoubleDQN使用普通Q网络；DuelingDQN只替换网络结构。","        # 三者仍然共享下面的动作选择、经验回放和参数更新流程。","        network = DuelingQnet if dqn_type == 'DuelingDQN' else Qnet","        self.q_net = network(state_dim, hidden_dim, self.action_dim).to(device)","        self.target_q_net = network(state_dim, hidden_dim, self.action_dim).to(device)","        # target network只用于计算训练目标，不直接参与梯度更新。","        self.target_q_net.load_state_dict(self.q_net.state_dict())","        self.optimizer = torch.optim.Adam(self.q_net.parameters(), lr=learning_rate)","        self.gamma = gamma","        self.epsilon = epsilon","        self.target_update = target_update","        self.count = 0","        self.device = device","        self.dqn_type = dqn_type"],"pseudo":""},{"kind":"方法","kc":"method","name":"DQN.take_action","line":"27-35","logic":"epsilon-greedy 策略：以 epsilon 概率用 np.random.randint 随机选动作，否则把 state 转成张量送入 q_net，取 argmax 对应动作索引。","srcStart":27,"src":["    def take_action(self, state):","        # epsilon-greedy：偶尔随机探索，避免只重复当前看起来最好的动作。","        if np.random.random() < self.epsilon:","            action = np.random.randint(self.action_dim)","        else:","            state = torch.tensor([state], dtype=torch.float).to(self.device)","            # q_net输出每个动作的Q值，argmax选择估计回报最高的动作。","            action = self.q_net(state).argmax().item()","        return action"],"pseudo":"if rand() < epsilon:\n    return random_action()\nreturn argmax_a Q(s, a)"},{"kind":"方法","kc":"method","name":"DQN.max_q_value","line":"37-39","logic":"把单个 state 转为 [1, state_dim] 张量输入 q_net，返回所有动作 Q 值中的最大值，供训练时记录 Q 值曲线。","srcStart":37,"src":["    def max_q_value(self, state):","        state = torch.tensor([state], dtype=torch.float).to(self.device)","        return self.q_net(state).max().item()"],"pseudo":"return max_a Q(s, a)"},{"kind":"方法","kc":"method","name":"DQN.update","line":"41-76","logic":"把 transition_dict 转成张量并用 gather 取 Q(s,a)；DoubleDQN 由在线网络 argmax 选动作、目标网络评估该动作，其余变体直接用目标网络 max；再以 r + gamma*Q'*(1-done) 为 TD 目标做 MSE 反传，并按 count % target_update 同步目标网络。","srcStart":41,"src":["    def update(self, transition_dict):","        # replay buffer中的一条经验是(s, a, r, s', done)；这里一次取一个batch。","        states = torch.tensor(transition_dict['states'], dtype=torch.float).to(self.device)","        actions = torch.tensor(transition_dict['actions']).view(-1, 1).to(self.device)","        rewards = torch.tensor(transition_dict['rewards'], dtype=torch.float).view(-1, 1).to(self.device)","        next_states = torch.tensor(transition_dict['next_states'], dtype=torch.float).to(self.device)","        dones = torch.tensor(transition_dict['dones'], dtype=torch.float).view(-1, 1).to(self.device)","","        # q_net(states)包含所有动作的Q值，gather只取实际执行动作a对应的Q(s,a)。","        current_q_values = self.q_net(states).gather(1, actions)","","        # 计算下一状态的估计价值。它只是监督学习目标，所以不需要梯度。","        if self.dqn_type == 'DoubleDQN':","            with torch.no_grad():","                # Double DQN：在线网络负责“选动作”，目标网络负责“评估动作”。","                max_action = self.q_net(next_states).max(1)[1].view(-1, 1)","                next_q_values = self.target_q_net(next_states).gather(1, max_action)","        else:","            with torch.no_grad():","                # 普通DQN/DuelingDQN：目标网络同时选择并评估最大Q值动作。","                next_q_values = self.target_q_net(next_states).max(1)[0].view(-1, 1)","","        # Bellman目标：Q_target = r + gamma * Q(s', a')。","        # done为1时表示回合结束，不再使用下一状态价值。","        td_targets = rewards + self.gamma * next_q_values * (1 - dones)","        dqn_loss = F.mse_loss(current_q_values, td_targets)","","        # 只更新online network；target network每隔target_update步整体同步一次。","        self.optimizer.zero_grad()","        dqn_loss.backward()","        self.optimizer.step()","","        if self.count % self.target_update == 0:","            # 延迟同步可以让训练目标在一段时间内保持稳定。","            self.target_q_net.load_state_dict(self.q_net.state_dict())","        self.count += 1"],"pseudo":"batch = replay.sample(B)\nq = Q_online(s).gather(1, a)\nif dqn_type == \"DoubleDQN\":\n    a2 = argmax_a Q_online(s')\n    q2 = Q_target(s').gather(1, a2)\nelse:\n    q2 = max_a Q_target(s')\ntarget = r + gamma * q2 * (1 - done)\nloss = MSE(q, target)\nupdate Q_online\nevery C steps: Q_target <- Q_online"},{"kind":"函数","kc":"func","name":"build_agent","line":"79-89","logic":"工厂函数：把别名 VanillaDQN 归一为 DQN，校验算法名只在 DQN/DoubleDQN/DuelingDQN 之内（否则抛 ValueError），返回对应 dqn_type 的 DQN 实例。","srcStart":79,"src":["def build_agent(algorithm, state_dim, hidden_dim, action_dim, learning_rate, gamma, epsilon, target_update, device):","    # main.py只调用这个工厂函数，因此切换算法不需要复制训练代码。","    # VanillaDQN是旧配置名，这里保留兼容性并统一转换为DQN。","    aliases = {'VanillaDQN': 'DQN'}","    dqn_type = aliases.get(algorithm, algorithm)","    if dqn_type not in {'DQN', 'DoubleDQN', 'DuelingDQN'}:","        raise ValueError(","            'Unsupported algorithm: {}. Choose DQN, DoubleDQN, or DuelingDQN.'.format(algorithm)","        )","","    return DQN(state_dim, hidden_dim, action_dim, learning_rate, gamma, epsilon, target_update, device, dqn_type)"],"pseudo":""}],"stages":[2,3,5],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5]}],"funcIdxs":[6],"entryIdxs":[],"constIdx":0},{"path":"03_Double DQN、Dueling DQN/config.py","rootId":"03","rootDir":"03_Double DQN、Dueling DQN","name":"config.py","dir":"03_Double DQN、Dueling DQN","purpose":"集中定义算法选择、超参数、环境名与运行设备的配置文件。","lines":29,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-28","logic":"导入 torch 并定义全局配置：ALG ction_dim):","    action_lowbound = env.action_space.low[0]","    action_upbound = env.action_space.high[0]","    return action_lowbound + (discrete_action / (action_dim - 1)) * (action_upbound - action_lowbound)"],"pseudo":""}],"stages":[1,2],"classGroups":[],"funcIdxs":[1,2],"entryIdxs":[],"constIdx":0},{"path":"03_Double DQN、Dueling DQN/main.py","rootId":"03","rootDir":"03_Double DQN、Dueling DQN","name":"main.py","dir":"03_Double DQN、Dueling DQN","purpose":"程序入口：装配环境、回放池与 agent，调用训练与绘图流程。","lines":48,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-11","logic":"导入 random/numpy/torch 三个随机源、config 配置，以及 agents.build_agent、environment.make_environment、trainer.train_DQN、visualization.plot_training_results。","srcStart":1,"src":["import random","","import numpy as np","import torch","","import config","import rl_utils","from agents import build_agent","from environment import make_environment","from trainer import train_DQN","from visualization import plot_training_results"],"pseudo":""},{"kind":"函数","kc":"func","name":"set_seed","line":"14-17","logic":"分别设置 random、numpy、torch 的随机种子，保证实验可复现。","srcStart":14,"src":["def set_seed(seed):","    random.seed(seed)","    np.random.seed(seed)","    torch.manual_seed(seed)"],"pseudo":"random.seed(seed)\nnp.random.seed(seed)\ntorch.manual_seed(seed)"},{"kind":"函数","kc":"func","name":"main","line":"20-44","logic":"按顺序设置种子、创建环境、构造 ReplayBuffer，用 config 中各项超参调用 build_agent 建 agent，再交给 train_DQN 训练，最后把回报列表、max Q 值列表与算法/环境名传给 plot_training_results 绘图。","srcStart":20,"src":["def main():","    set_seed(config.SEED)","    env, state_dim, action_dim = make_environment(config.ENV_NAME, config.ACTION_DIM)","    replay_buffer = rl_utils.ReplayBuffer(config.BUFFER_SIZE)","    # 算法切换只在config.ALGORITHM中手动完成","    agent = build_agent(","        config.ALGORITHM,","        state_dim,","        config.HIDDEN_DIM,","        action_dim,","        config.LR,","        config.GAMMA,","        config.EPSILON,","        config.TARGET_UPDATE,","        config.DEVICE,","    )","    return_list, max_q_value_list = train_DQN(","        agent,","        env,","        config.NUM_EPISODES,","        replay_buffer,","        config.MINIMAL_SIZE,","        config.BATCH_SIZE,","    )","    plot_training_results(return_list, max_q_value_list, config.ALGORITHM, config.ENV_NAME)"],"pseudo":""},{"kind":"入口","kc":"entry","name":"if __name__ == '__main__'","line":"47-48","logic":"脚本直接运行时调用 main()。","srcStart":47,"src":["if __name__ == '__main__':","    main()"],"pseudo":""}],"stages":[2,3],"classGroups":[],"funcIdxs":[1,2],"entryIdxs":[3],"constIdx":0},{"path":"03_Double DQN、Dueling DQN/networks.py","rootId":"03","rootDir":"03_Double DQN、Dueling DQN","name":"networks.py","dir":"03_Double DQN、Dueling DQN","purpose":"定义普通 Q 网络与 Dueling 结构的 Q 网络。","lines":34,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-2","logic":"导入 torch 构建网络层，导入 F 使用 relu。","srcStart":1,"src":["import torch","import torch.nn.functional as F"],"pseudo":""},{"kind":"类","kc":"cls","name":"Qnet","line":"5-16","logic":"普通 DQN 网络：输入状态，输出每个离散动作的 Q 值。","srcStart":5,"src":["class Qnet(torch.nn.Module):","    '''普通DQN网络：输入状态，输出每个离散动作的Q值。'''","    def __init__(self, state_dim, hidden_dim, action_dim):","        super(Qnet, self).__init__()","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, action_dim)","","    def forward(self, x):","        # 输入形状通常是[batch_size, state_dim]，输出形状是[batch_size, action_dim]。","        # 输出的每一列对应一个动作的Q值。","        x = F.relu(self.fc1(x))","        return self.fc2(x)"],"pseudo":""},{"kind":"方法","kc":"method","name":"Qnet.__init__","line":"7-10","logic":"定义两层全连接：fc1 从 state_dim 到 hidden_dim，fc2 从 hidden_dim 到 action_dim。","srcStart":7,"src":["    def __init__(self, state_dim, hidden_dim, action_dim):","        super(Qnet, self).__init__()","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, action_dim)"],"pseudo":""},{"kind":"方法","kc":"method","name":"Qnet.forward","line":"12-16","logic":"先对 fc1 输出做 relu，再经 fc2 得到形状 [batch, action_dim] 的 Q 值矩阵。","srcStart":12,"src":["    def forward(self, x):","        # 输入形状通常是[batch_size, state_dim]，输出形状是[batch_size, action_dim]。","        # 输出的每一列对应一个动作的Q值。","        x = F.relu(self.fc1(x))","        return self.fc2(x)"],"pseudo":"h = relu(fc1(s))\nh = relu(fc2(h))\nreturn fc3(h)   # 每个离散动作一个 Q 值"},{"kind":"类","kc":"cls","name":"DuelingQnet","line":"19-34","logic":"Dueling DQN 网络：共享特征层后分叉估计状态价值 V(s) 与动作优势 A(s,a)。","srcStart":19,"src":["class DuelingQnet(torch.nn.Module):","    '''Dueling DQN网络：分别估计状态价值V(s)和动作优势A(s,a)。'''","    def __init__(self, state_dim, hidden_dim, action_dim):","        super(DuelingQnet, self).__init__()","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc_A = torch.nn.Linear(hidden_dim, action_dim)","        self.fc_V = torch.nn.Linear(hidden_dim, 1)","","    def forward(self, x):","        features = F.relu(self.fc1(x))","        advantage = self.fc_A(features)","        value = self.fc_V(features)","","        # Q(s,a) = V(s) + A(s,a) - mean_a(A(s,a))。","        # 减去平均优势值，可以消除V和A之间的表示歧义。","        return value + advantage - advantage.mean(dim=1, keepdim=True)"],"pseudo":""},{"kind":"方法","kc":"method","name":"DuelingQnet.__init__","line":"21-25","logic":"定义共享层 fc1、优势分支 fc_A(hidden_dim→action_dim) 和价值分支 fc_V(hidden_dim→1)。","srcStart":21,"src":["    def __init__(self, state_dim, hidden_dim, action_dim):","        super(DuelingQnet, self).__init__()","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc_A = torch.nn.Linear(hidden_dim, action_dim)","        self.fc_V = torch.nn.Linear(hidden_dim, 1)"],"pseudo":""},{"kind":"方法","kc":"method","name":"DuelingQnet.forward","line":"27-34","logic":"features=relu(fc1(x)) 后分别算 advantage 与 value，输出 value + advantage - advantage.mean(dim=1, keepdim=True) 作为 Q 值。","srcStart":27,"src":["    def forward(self, x):","        features = F.relu(self.fc1(x))","        advantage = self.fc_A(features)","        value = self.fc_V(features)","","        # Q(s,a) = V(s) + A(s,a) - mean_a(A(s,a))。","        # 减去平均优势值，可以消除V和A之间的表示歧义。","        return value + advantage - advantage.mean(dim=1, keepdim=True)"],"pseudo":"h = relu(fc1(s)); h = relu(fc2(h))\nV = value_head(h)\nA = advantage_head(h)\nreturn V + A - mean(A, dim=1, keepdim=True)"}],"stages":[2,3],"classGroups":[{"classIdx":1,"methodIdxs":[2,3]},{"classIdx":4,"methodIdxs":[5,6]}],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"03_Double DQN、Dueling DQN/practice.py","rootId":"03","rootDir":"03_Double DQN、Dueling DQN","name":"practice.py","dir":"03_Double DQN、Dueling DQN","purpose":"极简启动脚本，直接复用 main.py 的流程。","lines":5,"missingSrc":true,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-1","logic":"从 main 模块导入 main 函数，本身不定义常量。","srcStart":1,"src":[],"pseudo":""},{"kind":"入口","kc":"entry","name":"if __name__ == '__main__'","line":"4-5","logic":"直接运行 main() 开始训练。","srcStart":4,"src":[],"pseudo":""}],"stages":[1],"classGroups":[],"funcIdxs":[],"entryIdxs":[1],"constIdx":0},{"path":"03_Double DQN、Dueling DQN/rl_utils.py","rootId":"03","rootDir":"03_Double DQN、Dueling DQN","name":"rl_utils.py","dir":"03_Double DQN、Dueling DQN","purpose":"通用强化学习工具：经验回放池、滑动平均、通用训练循环与优势估计。","lines":90,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-5","logic":"导入 tqdm 进度条、numpy、torch、collections（deque）与 random（采样），供回放池和通用训练循环使用。","srcStart":1,"src":["from tqdm import tqdm","import numpy as np","import torch","import collections","import random"],"pseudo":""},{"kind":"类","kc":"cls","name":"ReplayBuffer","line":"7-20","logic":"基于 collections.deque 的定长经验回放池，支持写入、随机采样与读取大小。","srcStart":7,"src":["class ReplayBuffer:","    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity) ","","    def add(self, state, action, reward, next_state, done): ","        self.buffer.append((state, action, reward, next_state, done)) ","","    def sample(self, batch_size): ","        transitions = random.sample(self.buffer, batch_size)","        state, action, reward, next_state, done = zip(*transitions)","        return np.array(state), action, reward, np.array(next_state), done ","","    def size(self): ","        return len(self.buffer)"],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.__init__","line":"8-9","logic":"用 collections.deque(maxlen=capacity) 创建容量受限的缓冲区。","srcStart":8,"src":["    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity) "],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.add","line":"11-12","logic":"把 (state, action, reward, next_state, done) 五元组追加进缓冲区，满容量时自动丢弃最旧样本。","srcStart":11,"src":["    def add(self, state, action, reward, next_state, done): ","        self.buffer.append((state, action, reward, next_state, done)) "],"pseudo":"buffer.append((s, a, r, s2, done))\nif len(buffer) > capacity:\n    buffer.popleft()"},{"kind":"方法","kc":"method","name":"ReplayBuffer.sample","line":"14-17","logic":"random.sample 抽取 batch_size 条经验，用 zip(*transitions) 拆成五列，states/next_states 转 np.array 后连同 action、reward、done 一起返回。","srcStart":14,"src":["    def sample(self, batch_size): ","        transitions = random.sample(self.buffer, batch_size)","        state, action, reward, next_state, done = zip(*transitions)","        return np.array(state), action, reward, np.array(next_state), done "],"pseudo":"batch = random.sample(buffer, batch_size)\nreturn zip(*batch)   # states, actions, rewards, next_states, dones"},{"kind":"方法","kc":"method","name":"ReplayBuffer.size","line":"19-20","logic":"返回缓冲区当前保存的样本数量。","srcStart":19,"src":["    def size(self): ","        return len(self.buffer)"],"pseudo":""},{"kind":"函数","kc":"func","name":"moving_average","line":"22-28","logic":"借助 np.cumsum 的差分计算窗口均值，并单独处理首尾不足整窗的部分，返回与输入等长的平滑序列。","srcStart":22,"src":["def moving_average(a, window_size):","    cumulative_sum = np.cumsum(np.insert(a, 0, 0)) ","    middle = (cumulative_sum[window_size:] - cumulative_sum[:-window_size]) / window_size","    r = np.arange(1, window_size-1, 2)","    begin = np.cumsum(a[:window_size-1])[::2] / r","    end = (np.cumsum(a[:-window_size:-1])[::2] / r)[::-1]","    return np.concatenate((begin, middle, end))"],"pseudo":"return [mean(x[max(0, i-w+1):i+1]) for i in range(len(x))]"},{"kind":"函数","kc":"func","name":"train_on_policy_agent","line":"30-54","logic":"按 10 段 tqdm 跑同策略训练，每回合收集包含 states/actions/rewards/dones 的整条轨迹后调用 agent.update；采用旧版 gym 的 env.reset()/step 返回值约定，返回每回合回报列表。","srcStart":30,"src":["def train_on_policy_agent(env, agent, num_episodes):","    return_list = []","    for i in range(10):","        with tqdm(total=int(num_episodes/10), desc='Iteration %d' % i) as pbar:","            for i_episode in range(int(num_episodes/10)):","                episode_return = 0","                transition_dict = {'states': [], 'actions': [], 'next_states': [], 'rewards': [], 'dones': []}","                state = env.reset()","                done = False","                while not done:","                    action = agent.take_action(state)","                    next_state, reward, done, _ = env.step(action)","                    transition_dict['states'].append(state)","                    transition_dict['actions'].append(action)","                    transition_dict['next_states'].append(next_state)","                    transition_dict['rewards'].append(reward)","                    transition_dict['dones'].append(done)","                    state = next_state","                    episode_return += reward","                return_list.append(episode_return)","                agent.update(transition_dict)","                if (i_episode+1) % 10 == 0:","                    pbar.set_postfix({'episode': '%d' % (num_episodes/10 * i + i_episode+1), 'return': '%.3f' % np.mean(return_list[-10:])})","                pbar.update(1)","    return return_list"],"pseudo":"for episode in 1 ... num_episodes:\n    rollout = []\n    s = env.reset()\n    done = False\n    while not done:\n        a = agent.take_action(s)\n        s2, r, terminated, truncated, _ = env.step(a)\n        done = terminated or truncated\n        rollout.append((s, a, r, s2, terminated))\n        s = s2\n    agent.update(rollout)"},{"kind":"函数","kc":"func","name":"train_off_policy_agent","line":"56-78","logic":"按 10 段 tqdm 跑异策略训练，每步写入 replay_buffer，缓冲区超过 minimal_size 后采样 batch 组装 transition_dict 调用 agent.update，返回每回合回报列表。","srcStart":56,"src":["def train_off_policy_agent(env, agent, num_episodes, replay_buffer, minimal_size, batch_size):","    return_list = []","    for i in range(10):","        with tqdm(total=int(num_episodes/10), desc='Iteration %d' % i) as pbar:","            for i_episode in range(int(num_episodes/10)):","                episode_return = 0","                state = env.reset()","                done = False","                while not done:","                    action = agent.take_action(state)","                    next_state, reward, done, _ = env.step(action)","                    replay_buffer.add(state, action, reward, next_state, done)","                    state = next_state","                    episode_return += reward","                    if replay_buffer.size() > minimal_size:","                        b_s, b_a, b_r, b_ns, b_d = replay_buffer.sample(batch_size)","                        transition_dict = {'states': b_s, 'actions': b_a, 'next_states': b_ns, 'rewards': b_r, 'dones': b_d}","                        agent.update(transition_dict)","                return_list.append(episode_return)","                if (i_episode+1) % 10 == 0:","                    pbar.set_postfix({'episode': '%d' % (num_episodes/10 * i + i_episode+1), 'return': '%.3f' % np.mean(return_list[-10:])})","                pbar.update(1)","    return return_list"],"pseudo":"for episode in 1 ... num_episodes:\n    s = env.reset()\n    done = False\n    while not done:\n        a = agent.take_action(s, explore=True)\n        s2, r, terminated, truncated, _ = env.step(a)\n        done = terminated or truncated\n        buffer.add(s, a, r, s2, terminated)\n        if buffer.size >= minimal_size:\n            agent.update(buffer.sample(batch_size))\n        s = s2"},{"kind":"函数","kc":"func","name":"compute_advantage","line":"81-89","logic":"把 td_delta detach 成 numpy 后从后往前按 advantage = gamma*lmbda*advantage + delta 累加，反转后转成 torch.float 张量返回（GAE 形式）。","srcStart":81,"src":["def compute_advantage(gamma, lmbda, td_delta):","    td_delta = td_delta.detach().numpy()","    advantage_list = []","    advantage = 0.0","    for delta in td_delta[::-1]:","        advantage = gamma * lmbda * advantage + delta","        advantage_list.append(advantage)","    advantage_list.reverse()","    return torch.tensor(advantage_list, dtype=torch.float)"],"pseudo":"adv = 0\nfor t = T-1 ... 0:\n    adv = td_delta[t] + gamma * lambda * adv\n    advantage[t] = adv\nreturn advantage"}],"stages":[2,3,4,6],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5]}],"funcIdxs":[6,7,8,9],"entryIdxs":[],"constIdx":0},{"path":"03_Double DQN、Dueling DQN/trainer.py","rootId":"03","rootDir":"03_Double DQN、Dueling DQN","name":"trainer.py","dir":"03_Double DQN、Dueling DQN","purpose":"DQN 系列的统一训练循环，含 Pendulum 动作离散化与 Q 值记录。","lines":53,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-4","logic":"导入 numpy 与 tqdm，并从 environment 导入 dis_to_con 以把离散动作映射为连续动作。","srcStart":1,"src":["import numpy as np","from tqdm import tqdm","","from environment import dis_to_con"],"pseudo":""},{"kind":"函数","kc":"func","name":"train_DQN","line":"7-53","logic":"按 10 段 tqdm 跑 num_episodes：每步 agent.take_action 选离散动作，用 0.005/0.995 指数平滑记录 max_q_value，经 dis_to_con 转连续动作送入 Pendulum，把经验存入 replay_buffer，缓冲超过 minimal_size 时采样 batch 调 agent.update；返回 (return_list, max_q_value_list)。","srcStart":7,"src":["def train_DQN(agent, env, num_episodes, replay_buffer, minimal_size, batch_size):","    '''执行统一训练流程，agent内部决定使用哪一种DQN变体。'''","    return_list = []","    max_q_value_list = []","    max_q_value = 0","    for i in range(10):","        with tqdm(total=int(num_episodes / 10), desc='Iteration %d' % i) as pbar:","            for i_episode in range(int(num_episodes / 10)):","                episode_return = 0","                state, _ = env.reset()","                done = False","                while not done:","                    # 1. agent根据当前状态选择离散动作。","                    action = agent.take_action(state)","                    max_q_value = agent.max_q_value(state) * 0.005 + max_q_value * 0.995","                    max_q_value_list.append(max_q_value)","","                    # Pendulum本身需要连续动作；这里把离散动作映射回连续区间。","                    action_continuous = dis_to_con(action, env, agent.action_dim)","                    next_state, reward, terminated, truncated, _ = env.step([action_continuous])","                    done = terminated or truncated","","                    # 2. 保存经验(s, a, r, s', done)，暂时不立即更新网络。","                    replay_buffer.add(state, action, reward, next_state, done)","                    state = next_state","                    episode_return += reward","","                    # 3. buffer积累足够样本后，随机采样batch交给agent.update()。","                    # 随机采样能打散相邻时刻的相关性，提高训练稳定性。","                    if replay_buffer.size() > minimal_size:","                        b_s, b_a, b_r, b_ns, b_d = replay_buffer.sample(batch_size)","                        transition_dict = {","                            'states': b_s,","                            'actions': b_a,","                            'next_states': b_ns,","                            'rewards': b_r,","                            'dones': b_d","                        }","                        agent.update(transition_dict)","                return_list.append(episode_return)","                if (i_episode + 1) % 10 == 0:","                    pbar.set_postfix({","                        'episode': '%d' % (num_episodes / 10 * i + i_episode + 1),","                        'return': '%.3f' % np.mean(return_list[-10:])","                    })","                pbar.update(1)","    return return_list, max_q_value_list"],"pseudo":""}],"stages":[1],"classGroups":[],"funcIdxs":[1],"entryIdxs":[],"constIdx":0},{"path":"03_Double DQN、Dueling DQN/visualization.py","rootId":"03","rootDir":"03_Double DQN、Dueling DQN","name":"visualization.py","dir":"03_Double DQN、Dueling DQN","purpose":"绘制平滑后的回合回报曲线与 max Q 值曲线。","lines":22,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-3","logic":"导入 matplotlib.pyplot 用于绘图，并导入 rl_utils 取滑动平均函数。","srcStart":1,"src":["import matplotlib.pyplot as plt","","import rl_utils"],"pseudo":""},{"kind":"函数","kc":"func","name":"plot_training_results","line":"6-22","logic":"先对 return_list 做窗口 5 的 moving_average 并画出回报-回合曲线且 show；再按帧画 max_q_value_list，加 y=0（橙虚线）与 y=10（红虚线）参考线后再次 show，标题为“算法 on 环境”。","srcStart":6,"src":["def plot_training_results(return_list, max_q_value_list, algorithm, env_name):","    episodes_list = list(range(len(return_list)))","    mv_return = rl_utils.moving_average(return_list, 5)","    plt.plot(episodes_list, mv_return)","    plt.xlabel('Episodes')","    plt.ylabel('Returns')","    plt.title('{} on {}'.format(algorithm, env_name))","    plt.show()","","    frames_list = list(range(len(max_q_value_list)))","    plt.plot(frames_list, max_q_value_list)","    plt.axhline(0, c='orange', ls='--')","    plt.axhline(10, c='red', ls='--')","    plt.xlabel('Frames')","    plt.ylabel('Q value')","    plt.title('{} on {}'.format(algorithm, env_name))","    plt.show()"],"pseudo":""}],"stages":[1],"classGroups":[],"funcIdxs":[1],"entryIdxs":[],"constIdx":0}]},{"id":"04","dir":"04_策略梯度算法_Reinforce","branch":"策略梯度","short":"REINFORCE","summary":"在 CartPole-v1 上实现 REINFORCE 蒙特卡洛策略梯度，按模块拆分为策略网络、agent、同策略训练循环与绘图。","files":[{"path":"04_策略梯度算法_Reinforce/agents.py","rootId":"04","rootDir":"04_策略梯度算法_Reinforce","name":"agents.py","dir":"04_策略梯度算法_Reinforce","purpose":"REINFORCE agent：按策略网络输出概率采样动作，并用整条轨迹的折扣回报更新策略。","lines":39,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-3","logic":"导入 torch、numpy，并从 networks 导入 PolicyNet。","srcStart":1,"src":["import torch","import numpy as np","from networks import PolicyNet"],"pseudo":""},{"kind":"类","kc":"cls","name":"REINFORCE","line":"5-39","logic":"封装 REINFORCE 策略梯度算法，持有策略网络、优化器与折扣因子。","srcStart":5,"src":["class REINFORCE:","    '''定义REINFORCE算法'''","    def __init__(self, state_dim, hidden_dim, action_dim, learning_rate, gamma, device):","        self.policy_net = PolicyNet(state_dim, hidden_dim, action_dim).to(device)","        self.optimizer = torch.optim.Adam(self.policy_net.parameters(), lr=learning_rate)  # 使用Adam优化器","        self.gamma = gamma  # 折扣因子","        self.device = device","","    def take_action(self, state):  # 根据动作概率分布随机采样","        state = torch.as_tensor(np.asarray(state), dtype=torch.float32, device=self.device).unsqueeze(0)","        probs = self.policy_net(state)","        action_dist = torch.distributions.Categorical(probs)","        action = action_dist.sample()","        return action.item()","","    def update(self, transition_dict):","        reward_list = transition_dict['rewards']","        state_list = transition_dict['states']","        action_list = transition_dict['actions']","","        G = 0","        self.optimizer.zero_grad()","        for i in reversed(range(len(reward_list))):  # 从最后一步算起","            reward = reward_list[i]","            state = torch.as_tensor(","                np.asarray(state_list[i]), dtype=torch.float32, device=self.device","            ).unsqueeze(0)","            action = torch.tensor([action_list[i]], dtype=torch.long, device=self.device)","            probs = self.policy_net(state)","            action_dist = torch.distributions.Categorical(probs)","            log_prob = action_dist.log_prob(action)","            G = self.gamma * G + reward","            loss = -log_prob * G  # 每一步的损失函数","            loss.backward()  # 反向传播计算梯度","        self.optimizer.step()  # 梯度下降"],"pseudo":""},{"kind":"方法","kc":"method","name":"REINFORCE.__init__","line":"7-11","logic":"将 PolicyNet 构建到指定 device，用 Adam 包装网络参数并保存 gamma 与 device。","srcStart":7,"src":["    def __init__(self, state_dim, hidden_dim, action_dim, learning_rate, gamma, device):","        self.policy_net = PolicyNet(state_dim, hidden_dim, action_dim).to(device)","        self.optimizer = torch.optim.Adam(self.policy_net.parameters(), lr=learning_rate)  # 使用Adam优化器","        self.gamma = gamma  # 折扣因子","        self.device = device"],"pseudo":""},{"kind":"方法","kc":"method","name":"REINFORCE.take_action","line":"13-18","logic":"把 state 转成 float32 张量并 unsqueeze 成 [1, state_dim] 送入策略网络，用 Categorical(probs).sample() 采样动作并返回 int 索引。","srcStart":13,"src":["    def take_action(self, state):  # 根据动作概率分布随机采样","        state = torch.as_tensor(np.asarray(state), dtype=torch.float32, device=self.device).unsqueeze(0)","        probs = self.policy_net(state)","        action_dist = torch.distributions.Categorical(probs)","        action = action_dist.sample()","        return action.item()"],"pseudo":"logits = pi(s)\ndist = Categorical(softmax(logits))\na = dist.sample()\nreturn a.item()"},{"kind":"方法","kc":"method","name":"REINFORCE.update","line":"20-39","logic":"逆序遍历整条 episode 的奖励，逐步累积折扣回报 G = gamma*G + r，对每步计算 loss = -log_prob * G 并 backward 累积梯度，循环结束后 optimizer.step() 一次性更新。","srcStart":20,"src":["    def update(self, transition_dict):","        reward_list = transition_dict['rewards']","        state_list = transition_dict['states']","        action_list = transition_dict['actions']","","        G = 0","        self.optimizer.zero_grad()","        for i in reversed(range(len(reward_list))):  # 从最后一步算起","            reward = reward_list[i]","            state = torch.as_tensor(","                np.asarray(state_list[i]), dtype=torch.float32, device=self.device","            ).unsqueeze(0)","            action = torch.tensor([action_list[i]], dtype=torch.long, device=self.device)","            probs = self.policy_net(state)","            action_dist = torch.distributions.Categorical(probs)","            log_prob = action_dist.log_prob(action)","            G = self.gamma * G + reward","            loss = -log_prob * G  # 每一步的损失函数","            loss.backward()  # 反向传播计算梯度","        self.optimizer.step()  # 梯度下降"],"pseudo":"G = 0\nloss = 0\nfor t = T-1 ... 0:\n    G = r[t] + gamma * G\n    logp = log pi(a[t] | s[t])\n    loss += -logp * G\nbackprop(loss)\noptimizer.step()"}],"stages":[2,3,4],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4]}],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"04_策略梯度算法_Reinforce/config.py","rootId":"04","rootDir":"04_策略梯度算法_Reinforce","name":"config.py","dir":"04_策略梯度算法_Reinforce","purpose":"集中定义 REINFORCE 的超参数、环境名与运行设备。","lines":12,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-11","logic":"导入 torch 并定义 LR=1e-3、GAMMA=0.98、NUM_EPISODES=1000、HIDDEN_DIM=128、ENV_NAME='CartPole-v1'、SEED=0，以及按 CUDA 可用性选择的 DEVICE。","srcStart":1,"src":["import torch","# 学习率","LR = 1e-3","# 折扣因子","GAMMA = 0.98","","NUM_EPISODES = 1000","HIDDEN_DIM = 128","ENV_NAME = 'CartPole-v1'","SEED = 0",""],"pseudo":""}],"stages":[0],"classGroups":[],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"04_策略梯度算法_Reinforce/environment.py","rootId":"04","rootDir":"04_策略梯度算法_Reinforce","name":"environment.py","dir":"04_策略梯度算法_Reinforce","purpose":"创建 gymnasium 环境并读取状态与动作维度。","lines":7,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-1","logic":"导入 gymnasium 用于构造环境。","srcStart":1,"src":["import gymnasium as gym"],"pseudo":""},{"kind":"函数","kc":"func","name":"make_environment","line":"3-7","logic":"gym.make 创建环境，从 observation_space.shape[0] 取 state_dim、从 action_spa
