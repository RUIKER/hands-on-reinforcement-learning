1,"src":["import random","","import numpy as np","import torch","","import config","from agents import TD3","from environment import make_environment","from rl_utils import ReplayBuffer","from trainer import evaluate_policy, train_off_policy_agent","from visualization import plot_training_results"],"pseudo":""},{"kind":"函数","kc":"func","name":"set_seed","line":"14-18","logic":"分别调用 random.seed、np.random.seed 和 torch.manual_seed 固定同一随机种子，保证实验可复现。","srcStart":14,"src":["def set_seed(seed):","    \"\"\"固定 Python、NumPy、PyTorch 的随机种子，方便复现实验。\"\"\"","    random.seed(seed)","    np.random.seed(seed)","    torch.manual_seed(seed)"],"pseudo":"random.seed(seed)\nnp.random.seed(seed)\ntorch.manual_seed(seed)"},{"kind":"函数","kc":"func","name":"main","line":"21-73","logic":"设置种子并创建环境，按 config 参数实例化 TD3 与 ReplayBuffer；调用 train_off_policy_agent 得到每回合回报，再用 evaluate_policy 以独立评估种子跑 20 回合，打印最后 10 回合均值与评估统计，最后绘图并 env.close()。","srcStart":21,"src":["def main():","    set_seed(config.SEED)","","    env, state_dim, action_dim, action_low, action_high = make_environment(","        config.ENV_NAME","    )","    env.reset(seed=config.SEED)","","    agent = TD3(","        state_dim=state_dim,","        hidden_dim=config.HIDDEN_DIM,","        action_dim=action_dim,","        action_low=action_low,","        action_high=action_high,","        actor_lr=config.ACTOR_LR,","        critic_lr=config.CRITIC_LR,","        gamma=config.GAMMA,","        tau=config.TAU,","        policy_delay=config.POLICY_DELAY,","        target_noise=config.TARGET_NOISE,","        noise_clip=config.NOISE_CLIP,","        exploration_sigma=config.EXPLORATION_SIGMA,","        device=config.DEVICE,","    )","","    replay_buffer = ReplayBuffer(config.BUFFER_SIZE)","","    return_list = train_off_policy_agent(","        env=env,","        agent=agent,","        num_episodes=config.NUM_EPISODES,","        replay_buffer=replay_buffer,","        minimal_size=config.MINIMAL_SIZE,","        batch_size=config.BATCH_SIZE,","        seed=config.SEED,","    )","","    # 训练曲线中的回报包含探索噪声；这里再记录一次无噪声评估。","    # 使用独立且固定的评估种子：所有训练种子面对同一批初始状态。","    eval_returns = evaluate_policy(","        env, agent,","        num_episodes=config.EVAL_EPISODES,","        seed=config.EVAL_SEED,","    )","    print('最后 10 回合训练平均回报: {:.3f}'.format(","        np.mean(return_list[-10:])","    ))","    print('确定性策略评估回报: 均值 {:.3f}, 标准差 {:.3f}, 最佳 {:.3f}'.format(","        eval_returns.mean(), eval_returns.std(), eval_returns.max()","    ))","","    plot_training_results(return_list, config.ENV_NAME)","    env.close()"],"pseudo":""},{"kind":"入口","kc":"entry","name":"if __name__ == '__main__'","line":"76-77","logic":"脚本直接运行时调用 main()。","srcStart":76,"src":["if __name__ == '__main__':","    main()"],"pseudo":""}],"stages":[2,3],"classGroups":[],"funcIdxs":[1,2],"entryIdxs":[3],"constIdx":0},{"path":"10_TD3/Pendulum/networks.py","rootId":"10","rootDir":"10_TD3","name":"networks.py","dir":"10_TD3/Pendulum","purpose":"定义 TD3 使用的确定性 Actor 与 Q(s,a) Critic 网络结构。","lines":60,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-2","logic":"导入 torch 与 torch.nn.functional，无模块级常量。","srcStart":1,"src":["import torch","import torch.nn.functional as F"],"pseudo":""},{"kind":"类","kc":"cls","name":"Actor","line":"5-37","logic":"确定性策略 mu(s)：两层 128 维隐藏层后经 tanh 压缩到 [-1,1]，再用注册为 buffer 的 action_scale/action_bias 映射到环境动作范围。","srcStart":5,"src":["class Actor(torch.nn.Module):","    \"\"\"确定性策略 mu(s)。","","    TD3 的 actor 与 DDPG 一样是确定性的：","        state -> tanh -> 映射到 [action_low, action_high]","    探索不靠随机策略，而是在行为动作上额外加高斯噪声。","    \"\"\"","","    def __init__(self, state_dim, hidden_dim, action_low, action_high):","        super().__init__()","        action_dim = len(action_low)","        # 两层隐藏层比 DDPG 示例中的单层更有表达力，也更接近 Spinning Up。","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, hidden_dim)","        self.fc_out = torch.nn.Linear(hidden_dim, action_dim)","","        # 使用 register_buffer 保存动作边界：","        #   - 它们会跟随 model.to(device) 自动迁移到 GPU/CPU；","        #   - 它们不是可训练参数，不会被优化器更新；","        #   - 它们会随 state_dict 一起保存/加载。","        low = torch.as_tensor(action_low, dtype=torch.float32)","        high = torch.as_tensor(action_high, dtype=torch.float32)","        self.register_buffer('action_scale', (high - low) / 2)","        self.register_buffer('action_bias', (high + low) / 2)","","    def forward(self, states):","        # tanh 输出 [-1, 1]，再线性映射到环境的实际动作范围。","        # 对 Pendulum：action_low=-2, action_high=2，","        # 因此 bias=0、scale=2，tanh 输出会变成 [-2, 2]。","        hidden = F.relu(self.fc1(states))","        hidden = F.relu(self.fc2(hidden))","        squashed = torch.tanh(self.fc_out(hidden))","        return self.action_bias + self.action_scale * squashed"],"pseudo":""},{"kind":"方法","kc":"method","name":"Actor.__init__","line":"13-28","logic":"按 state_dim→hidden_dim→hidden_dim→action_dim 建立三层线性网络，并把 (high-low)/2 与 (high+low)/2 用 register_buffer 保存，使其随 to(device) 迁移且不参与训练。","srcStart":13,"src":["    def __init__(self, state_dim, hidden_dim, action_low, action_high):","        super().__init__()","        action_dim = len(action_low)","        # 两层隐藏层比 DDPG 示例中的单层更有表达力，也更接近 Spinning Up。","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, hidden_dim)","        self.fc_out = torch.nn.Linear(hidden_dim, action_dim)","","        # 使用 register_buffer 保存动作边界：","        #   - 它们会跟随 model.to(device) 自动迁移到 GPU/CPU；","        #   - 它们不是可训练参数，不会被优化器更新；","        #   - 它们会随 state_dict 一起保存/加载。","        low = torch.as_tensor(action_low, dtype=torch.float32)","        high = torch.as_tensor(action_high, dtype=torch.float32)","        self.register_buffer('action_scale', (high - low) / 2)","        self.register_buffer('action_bias', (high + low) / 2)"],"pseudo":""},{"kind":"方法","kc":"method","name":"Actor.forward","line":"30-37","logic":"输入状态依次经过 fc1、fc2 的 ReLU 和 fc_out，再取 tanh 得到 [-1,1] 动作，返回 action_bias + action_scale * squashed。","srcStart":30,"src":["    def forward(self, states):","        # tanh 输出 [-1, 1]，再线性映射到环境的实际动作范围。","        # 对 Pendulum：action_low=-2, action_high=2，","        # 因此 bias=0、scale=2，tanh 输出会变成 [-2, 2]。","        hidden = F.relu(self.fc1(states))","        hidden = F.relu(self.fc2(hidden))","        squashed = torch.tanh(self.fc_out(hidden))","        return self.action_bias + self.action_scale * squashed"],"pseudo":"h = relu(W1 s + b1)\nh = relu(W2 h + b2)\nu = tanh(W3 h + b3)\nreturn action_bias + action_scale * u"},{"kind":"类","kc":"cls","name":"Critic","line":"40-60","logic":"Q(s,a) 网络，把状态与动作拼接后经两层隐藏层输出一个标量 Q 值；TD3 会独立实例化两个这样的网络作为 Q1/Q2。","srcStart":40,"src":["class Critic(torch.nn.Module):","    \"\"\"Q(s, a) 网络。","","    TD3 会创建两个结构相同但初始化独立（且训练数据顺序相同）的 Critic，","    分别记为 Q1 和 Q2。二者不共享参数，这样才能用 min(Q1, Q2)","    降低单个网络对 Q 值的高估。","    \"\"\"","","    def __init__(self, state_dim, hidden_dim, action_dim):","        super().__init__()","        # 状态和动作在输入层拼接，因此第一层输入维度是 state_dim + action_dim。","        self.fc1 = torch.nn.Linear(state_dim + action_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, hidden_dim)","        self.fc_out = torch.nn.Linear(hidden_dim, 1)","","    def forward(self, states, actions):","        features = torch.cat([states, actions], dim=1)","        features = F.relu(self.fc1(features))","        features = F.relu(self.fc2(features))","        # 输出形状 [batch_size, 1]，每个状态-动作对一个标量 Q 值。","        return self.fc_out(features)"],"pseudo":""},{"kind":"方法","kc":"method","name":"Critic.__init__","line":"48-53","logic":"第一层输入维度为 state_dim + action_dim，第二层保持 hidden_dim，输出层为 1 维。","srcStart":48,"src":["    def __init__(self, state_dim, hidden_dim, action_dim):","        super().__init__()","        # 状态和动作在输入层拼接，因此第一层输入维度是 state_dim + action_dim。","        self.fc1 = torch.nn.Linear(state_dim + action_dim, hidden_dim)","        self.fc2 = torch.nn.Linear(hidden_dim, hidden_dim)","        self.fc_out = torch.nn.Linear(hidden_dim, 1)"],"pseudo":""},{"kind":"方法","kc":"method","name":"Critic.forward","line":"55-60","logic":"沿第 1 维拼接 states 与 actions，经 ReLU(fc1)、ReLU(fc2) 后由 fc_out 输出形状 [batch_size, 1] 的 Q 值。","srcStart":55,"src":["    def forward(self, states, actions):","        features = torch.cat([states, actions], dim=1)","        features = F.relu(self.fc1(features))","        features = F.relu(self.fc2(features))","        # 输出形状 [batch_size, 1]，每个状态-动作对一个标量 Q 值。","        return self.fc_out(features)"],"pseudo":"x = concat(s, a)\nh = relu(W1 x + b1)\nh = relu(W2 h + b2)\nreturn W3 h + b3"}],"stages":[2,3],"classGroups":[{"classIdx":1,"methodIdxs":[2,3]},{"classIdx":4,"methodIdxs":[5,6]}],"funcIdxs":[],"entryIdxs":[],"constIdx":0},{"path":"10_TD3/Pendulum/noise.py","rootId":"10","rootDir":"10_TD3","name":"noise.py","dir":"10_TD3/Pendulum","purpose":"提供独立高斯探索噪声与 target policy smoothing 的截断噪声函数。","lines":57,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-2","logic":"导入 numpy 与 torch，无模块级常量。","srcStart":1,"src":["import numpy as np","import torch"],"pseudo":""},{"kind":"类","kc":"cls","name":"GaussianNoise","line":"5-28","logic":"无状态的高斯探索噪声：每步按 sigma 重新采样，配合确定性 actor 形成行为策略。","srcStart":5,"src":["class GaussianNoise:","    \"\"\"独立高斯探索噪声。","","    TD3 的 actor 是确定性策略。为了让智能体在训练时尝试不同动作，","    行为动作使用：","        a_behavior = clip(mu(s) + sigma * epsilon, action_low, action_high)","    其中 epsilon ~ N(0, I)。","","    与 DDPG 教程里的 OU 噪声不同，TD3 论文和 Spinning Up 默认使用","    独立高斯噪声：每一步重新采样，不保留时间相关性。TD3 的平滑性","    主要来自 target policy smoothing，而不是探索噪声。","    \"\"\"","","    def __init__(self, action_dim, sigma):","        self.action_dim = action_dim","        self.sigma = sigma","","    def reset(self):","        # 独立高斯噪声没有历史状态；保留 reset 是为了和训练循环的接口统一。","        pass","","    def sample(self):","        # 返回 float32，避免和 torch 的 float32 张量相加时发生类型提升。","        return self.sigma * np.random.randn(self.action_dim).astype(np.float32)"],"pseudo":""},{"kind":"方法","kc":"method","name":"GaussianNoise.__init__","line":"18-20","logic":"保存动作维度 action_dim 与噪声标准差 sigma。","srcStart":18,"src":["    def __init__(self, action_dim, sigma):","        self.action_dim = action_dim","        self.sigma = sigma"],"pseudo":""},{"kind":"方法","kc":"method","name":"GaussianNoise.reset","line":"22-24","logic":"空实现（pass），因为独立高斯噪声没有需要重置的时间相关状态。","srcStart":22,"src":["    def reset(self):","        # 独立高斯噪声没有历史状态；保留 reset 是为了和训练循环的接口统一。","        pass"],"pseudo":""},{"kind":"方法","kc":"method","name":"GaussianNoise.sample","line":"26-28","logic":"返回 sigma * np.random.randn(action_dim) 的 float32 数组，避免与 torch float32 张量相加时发生类型提升。","srcStart":26,"src":["    def sample(self):","        # 返回 float32，避免和 torch 的 float32 张量相加时发生类型提升。","        return self.sigma * np.random.randn(self.action_dim).astype(np.float32)"],"pseudo":"return sigma * randn(action_dim).astype(float32)"},{"kind":"函数","kc":"func","name":"smooth_target_action","line":"31-57","logic":"对 target actor 的动作按 randn_like 加噪声并乘以 action_scale，把噪声截断到 ±noise_clip·action_scale，最后将 actions+noise 裁剪到 [action_low, action_high] 后返回。","srcStart":31,"src":["def smooth_target_action(actions, target_noise, noise_clip,","                         action_scale, action_low, action_high):","    \"\"\"Target policy smoothing：给 target actor 的下一动作加截断噪声。","","    公式（Spinning Up）：","        a'(s') = clip(mu_target(s') + clip(epsilon, -c, c), a_low, a_high)","        epsilon ~ N(0, sigma^2)","","    为什么需要它？","    确定性 actor 的 target 动作只取决于 s'。如果 critic 在某个","    (s', mu_target(s')) 附近没有训练数据，它可能给出一个错误的尖峰 Q 值，","    而 actor 会利用这个“漏洞”把策略推向该动作。加入噪声后，critic 被要求","    在目标动作附近的一小片区域内都给出相近的 Q 值，从而平滑 Q 函数，","    减少策略利用 critic 误差的机会。","","    注意单位：","    target_noise 和 noise_clip 按归一化动作空间 [-1, 1] 定义，","    这里乘以 action_scale 转成环境动作单位，再用真实动作边界裁剪。","    \"\"\"","    # 与 actions 形状相同，每个样本、每个动作维度独立采样。","    noise = torch.randn_like(actions) * target_noise * action_scale","    # 截断噪声幅度，防止目标动作偏离 target actor 太远。","    noise = torch.clamp(","        noise, -noise_clip * action_scale, noise_clip * action_scale","    )","    # 最后再裁剪到环境合法动作范围，避免 critic 看到越界动作。","    return torch.max(torch.min(actions + noise, action_high), action_low)"],"pseudo":"eps = randn_like(a) * target_noise * action_scale\neps = clip(eps, -noise_clip * action_scale,\n                noise_clip * action_scale)\nreturn clip(a + eps, action_low, action_high)"}],"stages":[4,5,3],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4]}],"funcIdxs":[5],"entryIdxs":[],"constIdx":0},{"path":"10_TD3/Pendulum/practice.py","rootId":"10","rootDir":"10_TD3","name":"practice.py","dir":"10_TD3/Pendulum","purpose":"把 TD3 全部流程压缩进单个脚本的教学版本，便于对照 Spinning Up 与单步调试三项改进。","lines":225,"missingSrc":true,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-38","logic":"文件 docstring 说明这是单文件教学版；导入 collections、random、gymnasium、numpy、torch、F 与 tqdm，并在模块级写入与 config 相同的超参数（学习率、200 episodes、gamma、tau、policy_delay、噪声、buffer、batch）、ENV_NAME 与 DEVICE。","srcStart":1,"src":[],"pseudo":""},{"kind":"类","kc":"cls","name":"Actor","line":"41-58","logic":"用 nn.Sequential 搭建两层隐藏层的确定性策略，tanh 后用 buffer 中的 scale/bias 映射到动作范围。","srcStart":41,"src":[],"pseudo":""},{"kind":"方法","kc":"method","name":"Actor.__init__","line":"42-55","logic":"构建 Linear-ReLU-Linear-ReLU-Linear 序列，并注册 (high-low)/2 与 (high+low)/2 两个 buffer。","srcStart":42,"src":[],"pseudo":""},{"kind":"方法","kc":"method","name":"Actor.forward","line":"57-58","logic":"返回 bias + scale * tanh(net(states))。","srcStart":57,"src":[],"pseudo":"h = relu(W1 s + b1)\nh = relu(W2 h + b2)\nu = tanh(W3 h + b3)\nreturn action_bias + action_scale * u"},{"kind":"类","kc":"cls","name":"Critic","line":"61-73","logic":"Q(s,a) 网络，用 Sequential 把拼接后的状态动作映射为标量 Q 值。","srcStart":61,"src":[],"pseudo":""},{"kind":"方法","kc":"method","name":"Critic.__init__","line":"62-70","logic":"输入层维度为 state_dim+action_dim，两个隐藏层为 hidden_dim，输出 1 维。","srcStart":62,"src":[],"pseudo":""},{"kind":"方法","kc":"method","name":"Critic.forward","line":"72-73","logic":"沿 dim=1 拼接 states 与 actions 后送入 net，返回 Q 值。","srcStart":72,"src":[],"pseudo":"x = concat(s, a)\nh = relu(W1 x + b1)\nh = relu(W2 h + b2)\nreturn W3 h + b3"},{"kind":"类","kc":"cls","name":"ReplayBuffer","line":"76-97","logic":"基于 deque(maxlen=capacity) 的回放池，采样时直接返回设备上的张量，供单文件版 TD3.update 使用。","srcStart":76,"src":[],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.__init__","line":"77-78","logic":"创建容量为 capacity 的 collections.deque，满后自动丢弃最旧经验。","srcStart":77,"src":[],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.add","line":"80-81","logic":"把一条完整 transition 追加进 buffer。","srcStart":80,"src":[],"pseudo":"buffer.append((s, a, r, s2, done))\nif len(buffer) > capacity:\n    buffer.popleft()"},{"kind":"方法","kc":"method","name":"ReplayBuffer.sample","line":"83-94","logic":"随机采样 batch_size 条经验并 zip 拆分，转成 float32 张量放到 DEVICE，其中 rewards 与 dones 用 view(-1,1) 变成列向量。","srcStart":83,"src":[],"pseudo":"batch = random.sample(buffer, batch_size)\nreturn zip(*batch)   # states, actions, rewards, next_states, dones"},{"kind":"方法","kc":"method","name":"ReplayBuffer.__len__","line":"96-97","logic":"返回当前 buffer 中的经验条数，供训练循环判断是否达到 minimal_size。","srcStart":96,"src":[],"pseudo":""},{"kind":"类","kc":"cls","name":"TD3","line":"100-186","logic":"单文件版 TD3，直接在类内使用模块级超参数与 DEVICE，维护 actor/两个 critic 及三个 target 网络和对应优化器。","srcStart":100,"src":[],"pseudo":""},{"kind":"方法","kc":"method","name":"TD3.__init__","line":"101-124","logic":"创建 Actor、两个 Critic 及各自 target 并同步初始参数，建立三个 Adam 优化器，保存动作上下界与 action_scale，并把 update_count 初始化为 0。","srcStart":101,"src":[],"pseudo":""},{"kind":"方法","kc":"method","name":"TD3.take_action","line":"126-138","logic":"状态张量化后经 actor 得到动作，explore=True 时加上 EXPLORATION_SIGMA 的高斯采样，再裁剪到动作边界并转为 NumPy。","srcStart":126,"src":[],"pseudo":"a = actor(s)\nif explore:\n    a = a + noise.sample()\nreturn clip(a, action_low, action_high)"},{"kind":"方法","kc":"method","name":"TD3.soft_update","line":"140-143","logic":"使用模块级 TAU 对 online 与 target 网络参数做 Polyak 原地平均。","srcStart":140,"src":[],"pseudo":"for target_param, online_param:\n    target_param = (1 - tau) * target_param\n                 + tau * online_param"},{"kind":"方法","kc":"method","name":"TD3.update","line":"145-186","logic":"先在 no_grad 下构造带 target smoothing 的 clipped double-Q target，对两个 critic 求 MSE 并分别更新；再每 POLICY_DELAY 次用 -Q1(s,actor(s)).mean() 更新 actor，并软更新 actor 与两个 critic 的 target。","srcStart":145,"src":[],"pseudo":"y = calc_target(r, s', done)\nLq = MSE(Q1(s, a), y) + MSE(Q2(s, a), y)\nupdate Q1, Q2\nupdate_count += 1\nif update_count % policy_delay == 0:\n    Lpi = -mean(Q1(s, mu(s)))\n    update mu\n    soft_update(mu, mu_target)\n    soft_update(Q1, Q1_target)\n    soft_update(Q2, Q2_target)"},{"kind":"函数","kc":"func","name":"main","line":"189-221","logic":"固定三个随机种子，创建 Pendulum-v1、TD3 与 ReplayBuffer；逐 episode 交互并把 (s,a,r,s',terminated) 写入 buffer，buffer 达到 MINIMAL_SIZE 后每步更新一次，训练结束打印最后 10 回合平均回报并关闭环境。","srcStart":189,"src":[],"pseudo":""},{"kind":"入口","kc":"entry","name":"if __name__ == '__main__'","line":"224-225","logic":"脚本直接运行时调用 main()。","srcStart":224,"src":[],"pseudo":""}],"stages":[2,14,16,15,18],"classGroups":[{"classIdx":1,"methodIdxs":[2,3]},{"classIdx":4,"methodIdxs":[5,6]},{"classIdx":7,"methodIdxs":[8,9,10,11]},{"classIdx":12,"methodIdxs":[13,14,15,16]}],"funcIdxs":[17],"entryIdxs":[18],"constIdx":0},{"path":"10_TD3/Pendulum/rl_utils.py","rootId":"10","rootDir":"10_TD3","name":"rl_utils.py","dir":"10_TD3/Pendulum","purpose":"提供 off-policy 经验回放池与回报曲线移动平均工具。","lines":53,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-4","logic":"导入 collections、random 与 numpy，无模块级常量。","srcStart":1,"src":["import collections","import random","","import numpy as np"],"pseudo":""},{"kind":"类","kc":"cls","name":"ReplayBuffer","line":"7-35","logic":"以 deque(maxlen=capacity) 保存 (s, a, r, s', done)，支持追加、随机均匀采样和查询当前大小。","srcStart":7,"src":["class ReplayBuffer:","    \"\"\"off-policy 经验回放池。","","    每条数据是 (s, a, r, s', done)：","        done 在写入时只使用 terminated，不使用 truncated。","    deque(maxlen=capacity) 会在容量满时自动丢弃最旧的数据。","    \"\"\"","","    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity)","","    def add(self, state, action, reward, next_state, done):","        self.buffer.append((state, action, reward, next_state, done))","","    def sample(self, batch_size):","        # 随机均匀采样，打破连续 transition 之间的时间相关性。","        transitions = random.sample(self.buffer, batch_size)","        states, actions, rewards, next_states, dones = zip(*transitions)","        # 统一转成 NumPy 数组，方便 agents.py 一次性转成 batch tensor。","        return (","            np.asarray(states, dtype=np.float32),","            np.asarray(actions, dtype=np.float32),","            np.asarray(rewards, dtype=np.float32),","            np.asarray(next_states, dtype=np.float32),","            np.asarray(dones, dtype=np.float32),","        )","","    def size(self):","        return len(self.buffer)"],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.__init__","line":"15-16","logic":"创建容量为 capacity 的 deque，超容量时自动丢弃最旧 transition。","srcStart":15,"src":["    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity)"],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.add","line":"18-19","logic":"把 (state, action, reward, next_state, done) 追加到 buffer。","srcStart":18,"src":["    def add(self, state, action, reward, next_state, done):","        self.buffer.append((state, action, reward, next_state, done))"],"pseudo":"buffer.append((s, a, r, s2, done))\nif len(buffer) > capacity:\n    buffer.popleft()"},{"kind":"方法","kc":"method","name":"ReplayBuffer.sample","line":"21-32","logic":"用 random.sample 均匀抽取 batch_size 条经验，zip 拆成五元组并统一转成 float32 NumPy 数组返回。","srcStart":21,"src":["    def sample(self, batch_size):","        # 随机均匀采样，打破连续 transition 之间的时间相关性。","        transitions = random.sample(self.buffer, batch_size)","        states, actions, rewards, next_states, dones = zip(*transitions)","        # 统一转成 NumPy 数组，方便 agents.py 一次性转成 batch tensor。","        return (","            np.asarray(states, dtype=np.float32),","            np.asarray(actions, dtype=np.float32),","            np.asarray(rewards, dtype=np.float32),","            np.asarray(next_states, dtype=np.float32),","            np.asarray(dones, dtype=np.float32),","        )"],"pseudo":"batch = random.sample(buffer, batch_size)\nreturn zip(*batch)   # states, actions, rewards, next_states, dones"},{"kind":"方法","kc":"method","name":"ReplayBuffer.size","line":"34-35","logic":"返回 len(self.buffer)，即当前经验条数。","srcStart":34,"src":["    def size(self):","        return len(self.buffer)"],"pseudo":""},{"kind":"函数","kc":"func","name":"moving_average","line":"38-53","logic":"把序列转成 float32 数组；若长度不足 window_size 则原样返回，否则用累积和计算中段滑动平均，并对首尾用逐步增大的窗口补齐，最后拼接返回。","srcStart":38,"src":["def moving_average(values, window_size):","    \"\"\"计算移动平均，用于平滑训练回报曲线。","","    两端不足一个窗口时使用逐步增大的窗口，避免曲线开头缺失。","    \"\"\"","    values = np.asarray(values, dtype=np.float32)","    if len(values) < window_size:","        return values","    cumulative_sum = np.cumsum(np.insert(values, 0, 0))","    middle = (","        cumulative_sum[window_size:] - cumulative_sum[:-window_size]","    ) / window_size","    radius = np.arange(1, window_size - 1, 2)","    begin = np.cumsum(values[:window_size - 1])[::2] / radius","    end = (np.cumsum(values[:-window_size:-1])[::2] / radius)[::-1]","    return np.concatenate((begin, middle, end))"],"pseudo":"return [mean(x[max(0, i-w+1):i+1]) for i in range(len(x))]"}],"stages":[2,3,4,6],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5]}],"funcIdxs":[6],"entryIdxs":[],"constIdx":0},{"path":"10_TD3/Pendulum/trainer.py","rootId":"10","rootDir":"10_TD3","name":"trainer.py","dir":"10_TD3/Pendulum","purpose":"实现 TD3 的 off-policy 训练循环与无噪声确定性策略评估。","lines":85,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-2","logic":"导入 numpy 与 tqdm 进度条，无模块级常量。","srcStart":1,"src":["import numpy as np","from tqdm import tqdm"],"pseudo":""},{"kind":"函数","kc":"func","name":"train_off_policy_agent","line":"5-58","logic":"按 num_episodes 循环，用 seed+episode 重置环境；每步调用 agent.take_action(explore=True) 与环境交互，把 done 记为 terminated or truncated，但只把 terminated 写入 buffer，buffer 达到 minimal_size 后每步调用 agent.update；每 10 回合更新 tqdm 后置信息并返回每回合回报列表。","srcStart":5,"src":["def train_off_policy_agent(env, agent, num_episodes, replay_buffer,","                           minimal_size, batch_size, seed=None):","    \"\"\"运行 TD3 的 off-policy 训练流程。","","    循环结构：","        episode -> 与环境交互 -> 存入 replay buffer","                -> buffer 足够大后，每个环境步做一次 TD3 update","","    TD3 的 update() 内部已经处理了 delayed policy update：","    每个环境步都会更新 critic，但每 policy_delay 步才更新一次 actor。","    \"\"\"","    return_list = []","    with tqdm(total=num_episodes, desc='Training') as progress:","        for episode in range(num_episodes):","            # 每个 episode 使用不同 seed：实验整体可复现，","            # 但 Pendulum 的初始角度/速度不会每个 episode 完全相同。","            if seed is None:","                state, _ = env.reset()","            else:","                state, _ = env.reset(seed=seed + episode)","","            done = False","            episode_return = 0.0","","            while not done:","                # 训练时动作 = actor(s) + 高斯噪声，再裁剪到动作边界。","                action = agent.take_action(state, explore=True)","                next_state, reward, terminated, truncated, _ = env.step(action)","","                # terminated 和 truncated 都会结束交互循环，","                # 但只有 terminated 才是“真正终止”。","                done = terminated or truncated","                # 时间上限造成的 truncated 不应停止 Bellman bootstrap。","                # 例如 Pendulum 每 200 步被截断，但摆仍然可以继续运动，","                # 因此写入 buffer 的 done 必须是 terminated。","                replay_buffer.add(","                    state, action, reward, next_state, terminated","                )","                state = next_state","                episode_return += reward","","                # buffer 积累到 minimal_size 后开始学习。","                # 每个环境步更新一次，保持 1:1 的样本/梯度比例。","                if replay_buffer.size() >= minimal_size:","                    agent.update(replay_buffer.sample(batch_size))","","            return_list.append(episode_return)","            if (episode + 1) % 10 == 0:","                progress.set_postfix({","                    'episode': episode + 1,","                    'return': '%.3f' % np.mean(return_list[-10:]),","                })","            progress.update(1)","    return return_list"],"pseudo":"for episode in 1 ... num_episodes:\n    s = env.reset()\n    done = False\n    while not done:\n        a = agent.take_action(s, explore=True)\n        s2, r, terminated, truncated, _ = env.step(a)\n        done = terminated or truncated\n        buffer.add(s, a, r, s2, terminated)\n        if buffer.size >= minimal_size:\n            agent.update(buffer.sample(batch_size))\n        s = s2"},{"kind":"函数","kc":"func","name":"evaluate_policy","line":"61-85","logic":"以 explore=False 的确定性策略运行 num_episodes 个回合，每个回合可用 seed+episode 固定初始状态，累加奖励后返回 float32 的回合回报数组。","srcStart":61,"src":["def evaluate_policy(env, agent, num_episodes=10, seed=None):","    \"\"\"用不带探索噪声的确定性策略评估。","","    训练回报包含探索噪声，不能代表策略本身的好坏。","    训练结束后关闭噪声再跑若干 episode，才是真正的 evaluation return。","","    seed 不为 None 时，每个评估 episode 使用固定的初始状态。","    这样比较不同训练种子时，评估面对的是同一批初始状态，","    减少“运气好/坏”带来的评估方差。","    \"\"\"","    returns = []","    for episode in range(num_episodes):","        if seed is None:","            state, _ = env.reset()","        else:","            state, _ = env.reset(seed=seed + episode)","        done = False","        episode_return = 0.0","        while not done:","            action = agent.take_action(state, explore=False)","            state, reward, terminated, truncated, _ = env.step(action)","            done = terminated or truncated","            episode_return += reward","        returns.append(episode_return)","    return np.asarray(returns, dtype=np.float32)"],"pseudo":"for i in 1 ... n_episodes:\n    s, _ = env.reset(seed=seed + i)\n    done = False\n    total = 0\n    while not done:\n        a = agent.take_action(s, explore=False)\n        s, r, terminated, truncated, _ = env.step(a)\n        done = terminated or truncated\n        total += r\n    returns.append(total)\nreturn mean(returns), std(returns)"}],"stages":[1,2],"classGroups":[],"funcIdxs":[1,2],"entryIdxs":[],"constIdx":0},{"path":"10_TD3/Pendulum/visualization.py","rootId":"10","rootDir":"10_TD3","name":"visualization.py","dir":"10_TD3/Pendulum","purpose":"绘制 TD3 训练回报及移动平均曲线。","lines":28,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-3","logic":"导入 matplotlib.pyplot，并从 rl_utils 引入 moving_average。","srcStart":1,"src":["import matplotlib.pyplot as plt","","from rl_utils import moving_average"],"pseudo":""},{"kind":"函数","kc":"func","name":"plot_training_results","line":"6-28","logic":"创建 1×2 子图，左图绘制逐回合原始回报，右图绘制 window_size=9 的移动平均，设置坐标轴与含环境名的标题后 tight_layout 并 show。","srcStart":6,"src":["def plot_training_results(return_list, env_name, window_size=9):","    \"\"\"绘制原始回报和移动平均回报。","","    TD3/DDPG 属于 off-policy 算法，训练回报受探索噪声影响较大，","    单条 episode 曲线会出现明显抖动。判断是否学会时应重点看移动平均。","    \"\"\"","    episodes = list(range(len(return_list)))","    plt.figure(figsize=(10, 4))","","    plt.subplot(1, 2, 1)","    plt.plot(episodes, return_list, linewidth=1)","    plt.xlabel('Episodes')","    plt.ylabel('Returns')","    plt.title('TD3 on {}'.format(env_name))","","    plt.subplot(1, 2, 2)","    plt.plot(episodes, moving_average(return_list, window_size))","    plt.xlabel('Episodes')","    plt.ylabel('Moving average returns')","    plt.title('TD3 moving average')","","    plt.tight_layout()","    plt.show()"],"pseudo":""}],"stages":[1],"classGroups":[],"funcIdxs":[1],"entryIdxs":[],"constIdx":0}]},{"id":"11","dir":"11_SAC","branch":"连续控制","short":"最大熵 + 自动温度","summary":"SAC（双 critic 取最小值、重参数化高斯策略、自动熵温度调节）在 Pendulum-v1 上的模块化实现，包含奖励重塑、回放池、训练循环与曲线绘制。","files":[{"path":"11_SAC/Pendulum/agents.py","rootId":"11","rootDir":"11_SAC","name":"agents.py","dir":"11_SAC/Pendulum","purpose":"定义 SAC 智能体，封装随机策略、双 critic 及 target、自动温度参数与三类更新。","lines":126,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-5","logic":"导入 numpy、torch 与 torch.nn.functional，并从 networks 引入 Critic 与 GaussianPolicy；模块内无常量定义。","srcStart":1,"src":["import numpy as np","import torch","import torch.nn.functional as F","","from networks import Critic, GaussianPolicy"],"pseudo":""},{"kind":"类","kc":"cls","name":"SAC","line":"8-126","logic":"维护 GaussianPolicy、两个 online critic、两个 target critic、actor/critic/alpha 三个优化器以及奖励重塑参数，实现随机动作采样、soft Bellman target 计算和单批更新。","srcStart":8,"src":["class SAC:","    \"\"\"连续动作 Soft Actor-Critic agent。","","    SAC 同时学习一个随机 actor、两个 online critic 和两个 target critic。","    随机策略的熵被加入目标函数，用于平衡探索和利用。","    \"\"\"","","    def __init__(self, state_dim, hidden_dim, action_low, action_high,","                 actor_lr, critic_lr, alpha_lr, target_entropy, tau, gamma,","                 reward_shift, reward_scale, device):","        self.actor = GaussianPolicy(","            state_dim, hidden_dim, action_low, action_high","        ).to(device)","        # 两个独立 Q 网络，用 min(Q1,Q2) 缓解单个 critic 的过高估计。","        action_dim = len(action_low)","        self.critic_1 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.critic_2 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.target_critic_1 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.target_critic_2 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.target_critic_1.load_state_dict(self.critic_1.state_dict())","        self.target_critic_2.load_state_dict(self.critic_2.state_dict())","","        self.actor_optimizer = torch.optim.Adam(self.actor.parameters(), lr=actor_lr)","        self.critic_1_optimizer = torch.optim.Adam(self.critic_1.parameters(), lr=critic_lr)","        self.critic_2_optimizer = torch.optim.Adam(self.critic_2.parameters(), lr=critic_lr)","","        # alpha 是熵正则项的权重。优化 log(alpha) 而不是 alpha，","        # 可以保证 alpha=exp(log_alpha)>0。","        self.log_alpha = torch.tensor(","            np.log(0.01), dtype=torch.float32, device=device, requires_grad=True","        )","        self.log_alpha_optimizer = torch.optim.Adam([self.log_alpha], lr=alpha_lr)","        self.target_entropy = target_entropy","        self.gamma = gamma","        self.tau = tau","        self.reward_shift = reward_shift","        self.reward_scale = reward_scale","        self.device = device","","    def take_action(self, state):","        # 推理时仍从随机策略采样，因此 SAC 不像 DDPG 那样需要外加探索噪声。","        state = torch.as_tensor(","            np.asarray(state), dtype=torch.float32, device=self.device","        ).unsqueeze(0)","        with torch.no_grad():","            action, _ = self.actor(state)","        return action.squeeze(0).cpu().numpy()","","    def calc_target(self, rewards, next_states, dones):","        \"\"\"计算两个 critic 共同使用的 soft Bellman target。","","        y = r + gamma * (min(Q1_target,Q2_target) - alpha*log pi(a'|s'))","        done=1 时不再 bootstrap 下一状态价值。","        \"\"\"","        with torch.no_grad():","            # 从当前 actor 对下一状态进行重参数化采样。","            next_actions, next_log_probs = self.actor(next_states)","            next_q_1 = self.target_critic_1(next_states, next_actions)","            next_q_2 = self.target_critic_2(next_states, next_actions)","            next_q = torch.min(next_q_1, next_q_2)","            # 因为 log_prob 通常为负，减去 alpha*log_prob 等价于加入熵奖励。","            soft_next_q = next_q - self.log_alpha.exp().detach() * next_log_probs","            return rewards + self.gamma * soft_next_q * (1 - dones)","","    def soft_update(self, online_net, target_net):","        \"\"\"使用 Polyak averaging 缓慢同步 target 网络。\"\"\"","        for target_param, online_param in zip(","            target_net.parameters(), online_net.parameters()","        ):","            target_param.data.mul_(1 - self.tau)","            target_param.data.add_(self.tau * online_param.data)","","    def update(self, batch):","        # 一个 batch 中的形状通常为：","        # states [B, state_dim]，actions [B, action_dim]，rewards/dones [B, 1]。","        states, actions, rewards, next_states, dones = batch","        states = torch.as_tensor(states, dtype=torch.float32, device=self.device)","        actions = torch.as_tensor(actions, dtype=torch.float32, device=self.device)","        rewards = torch.as_tensor(rewards, dtype=torch.float32, device=self.device).view(-1, 1)","        next_states = torch.as_tensor(next_states, dtype=torch.float32, device=self.device)","        dones = torch.as_tensor(dones, dtype=torch.float32, device=self.device).view(-1, 1)","        # 只缩放 critic 的训练目标，return_list 仍记录环境原始回报。","        scaled_rewards = (rewards + self.reward_shift) / self.reward_scale","","        # 两个 critic 都回归同一个、无梯度的 soft TD target。","        td_target = self.calc_target(scaled_rewards, next_states, dones)","        critic_1_loss = F.mse_loss(self.critic_1(states, actions), td_target)","        critic_2_loss = F.mse_loss(self.critic_2(states, actions), td_target)","        self.critic_1_optimizer.zero_grad()","        critic_1_loss.backward()","        self.critic_1_optimizer.step()","        self.critic_2_optimizer.zero_grad()","        critic_2_loss.backward()","        self.critic_2_optimizer.step()","","        # 重参数化采样让 actor 的梯度可以穿过随机动作到达网络参数。","        new_actions, log_probs = self.actor(states)","        new_q = torch.min(","            self.critic_1(states, new_actions),","            self.critic_2(states, new_actions),","        )","        # actor 同时希望 Q 值高、log_prob 小（熵高）。","        alpha = self.log_alpha.exp().detach()","        actor_loss = (alpha * log_probs - new_q).mean()","        self.actor_optimizer.zero_grad()","        actor_loss.backward()","        self.actor_optimizer.step()","","        # 自动温度调节：当前熵低于目标时增大 alpha，强化熵奖励；","        # 当前熵高于目标时减小 alpha，让策略更关注回报。","        alpha_loss = -(","            self.log_alpha * (log_probs + self.target_entropy).detach()","        ).mean()","        self.log_alpha_optimizer.zero_grad()","        alpha_loss.backward()","        self.log_alpha_optimizer.step()","","        self.soft_update(self.critic_1, self.target_critic_1)","        self.soft_update(self.critic_2, self.target_critic_2)"],"pseudo":""},{"kind":"方法","kc":"method","name":"SAC.__init__","line":"15-45","logic":"构建 GaussianPolicy 与两套 Critic，把 online critic 参数复制给 target；建立三个 Adam 优化器，把可学习 log_alpha 初始化为 log(0.01)，记录 target_entropy、tau、gamma、reward_shift 与 reward_scale。","srcStart":15,"src":["    def __init__(self, state_dim, hidden_dim, action_low, action_high,","                 actor_lr, critic_lr, alpha_lr, target_entropy, tau, gamma,","                 reward_shift, reward_scale, device):","        self.actor = GaussianPolicy(","            state_dim, hidden_dim, action_low, action_high","        ).to(device)","        # 两个独立 Q 网络，用 min(Q1,Q2) 缓解单个 critic 的过高估计。","        action_dim = len(action_low)","        self.critic_1 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.critic_2 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.target_critic_1 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.target_critic_2 = Critic(state_dim, hidden_dim, action_dim).to(device)","        self.target_critic_1.load_state_dict(self.critic_1.state_dict())","        self.target_critic_2.load_state_dict(self.critic_2.state_dict())","","        self.actor_optimizer = torch.optim.Adam(self.actor.parameters(), lr=actor_lr)","        self.critic_1_optimizer = torch.optim.Adam(self.critic_1.parameters(), lr=critic_lr)","        self.critic_2_optimizer = torch.optim.Adam(self.critic_2.parameters(), lr=critic_lr)","","        # alpha 是熵正则项的权重。优化 log(alpha) 而不是 alpha，","        # 可以保证 alpha=exp(log_alpha)>0。","        self.log_alpha = torch.tensor(","            np.log(0.01), dtype=torch.float32, device=device, requires_grad=True","        )","        self.log_alpha_optimizer = torch.optim.Adam([self.log_alpha], lr=alpha_lr)","        self.target_entropy = target_entropy","        self.gamma = gamma","        self.tau = tau","        self.reward_shift = reward_shift","        self.reward_scale = reward_scale","        self.device = device"],"pseudo":""},{"kind":"方法","kc":"method","name":"SAC.take_action","line":"47-54","logic":"在 no_grad 下把单个状态转成 [1, state_dim] 张量送入随机策略采样一次动作（同时丢弃 log_prob），squeeze 后返回 NumPy 动作；策略本身带随机性，不需额外探索噪声。","srcStart":47,"src":["    def take_action(self, state):","        # 推理时仍从随机策略采样，因此 SAC 不像 DDPG 那样需要外加探索噪声。","        state = torch.as_tensor(","            np.asarray(state), dtype=torch.float32, device=self.device","        ).unsqueeze(0)","        with torch.no_grad():","            action, _ = self.actor(state)","        return action.squeeze(0).cpu().numpy()"],"pseudo":"with no_grad:\n    a, _ = mu(s)\nreturn a"},{"kind":"方法","kc":"method","name":"SAC.calc_target","line":"56-70","logic":"在 no_grad 下对 next_states 重参数化采样得到 a' 与 log pi(a'|s')，用两个 target critic 的较小 Q 值减去 exp(log_alpha)·log pi 得到 soft Q，再返回 r + gamma·(1-done)·soft Q。","srcStart":56,"src":["    def calc_target(self, rewards, next_states, dones):","        \"\"\"计算两个 critic 共同使用的 soft Bellman target。","","        y = r + gamma * (min(Q1_target,Q2_target) - alpha*log pi(a'|s'))","        done=1 时不再 bootstrap 下一状态价值。","        \"\"\"","        with torch.no_grad():","            # 从当前 actor 对下一状态进行重参数化采样。","            next_actions, next_log_probs = self.actor(next_states)","            next_q_1 = self.target_critic_1(next_states, next_actions)","            next_q_2 = self.target_critic_2(next_states, next_actions)","            next_q = torch.min(next_q_1, next_q_2)","            # 因为 log_prob 通常为负，减去 alpha*log_prob 等价于加入熵奖励。","            soft_next_q = next_q - self.log_alpha.exp().detach() * next_log_probs","            return rewards + self.gamma * soft_next_q * (1 - dones)"],"pseudo":"a2, logp2 = mu_target(s')\nq2 = min(Q1_target(s', a2), Q2_target(s', a2))\ny = r + gamma * (1 - done) * (q2 - alpha * logp2)\nreturn y"},{"kind":"方法","kc":"method","name":"SAC.soft_update","line":"72-78","logic":"对 online 与 target 网络参数逐对做 Polyak 平均 target ← (1-tau)·target + tau·online，使用 data 原地修改。","srcStart":72,"src":["    def soft_update(self, online_net, target_net):","        \"\"\"使用 Polyak averaging 缓慢同步 target 网络。\"\"\"","        for target_param, online_param in zip(","            target_net.parameters(), online_net.parameters()","        ):","            target_param.data.mul_(1 - self.tau)","            target_param.data.add_(self.tau * online_param.data)"],"pseudo":"for target_param, online_param:\n    target_param = (1 - tau) * target_param\n                 + tau * online_param"},{"kind":"方法","kc":"method","name":"SAC.update","line":"80-126","logic":"把 batch 转成张量并按 (r+shift)/scale 重塑奖励；先计算无梯度的 soft TD target，对两个 critic 分别做 MSE 更新；再用重参数化采样求 (alpha·log pi - min(Q1,Q2)).mean() 更新 actor，用 -(log_alpha·(log pi+target_entropy)) 更新温度参数，最后软更新两个 target critic。","srcStart":80,"src":["    def update(self, batch):","        # 一个 batch 中的形状通常为：","        # states [B, state_dim]，actions [B, action_dim]，rewards/dones [B, 1]。","        states, actions, rewards, next_states, dones = batch","        states = torch.as_tensor(states, dtype=torch.float32, device=self.device)","        actions = torch.as_tensor(actions, dtype=torch.float32, device=self.device)","        rewards = torch.as_tensor(rewards, dtype=torch.float32, device=self.device).view(-1, 1)","        next_states = torch.as_tensor(next_states, dtype=torch.float32, device=self.device)","        dones = torch.as_tensor(dones, dtype=torch.float32, device=self.device).view(-1, 1)","        # 只缩放 critic 的训练目标，return_list 仍记录环境原始回报。","        scaled_rewards = (rewards + self.reward_shift) / self.reward_scale","","        # 两个 critic 都回归同一个、无梯度的 soft TD target。","        td_target = self.calc_target(scaled_rewards, next_states, dones)","        critic_1_loss = F.mse_loss(self.critic_1(states, actions), td_target)","        critic_2_loss = F.mse_loss(self.critic_2(states, actions), td_target)","        self.critic_1_optimizer.zero_grad()","        critic_1_loss.backward()","        self.critic_1_optimizer.step()","        self.critic_2_optimizer.zero_grad()","        critic_2_loss.backward()","        self.critic_2_optimizer.step()","","        # 重参数化采样让 actor 的梯度可以穿过随机动作到达网络参数。","        new_actions, log_probs = self.actor(states)","        new_q = torch.min(","            self.critic_1(states, new_actions),","            self.critic_2(states, new_actions),","        )","        # actor 同时希望 Q 值高、log_prob 小（熵高）。","        alpha = self.log_alpha.exp().detach()","        actor_loss = (alpha * log_probs - new_q).mean()","        self.actor_optimizer.zero_grad()","        actor_loss.backward()","        self.actor_optimizer.step()","","        # 自动温度调节：当前熵低于目标时增大 alpha，强化熵奖励；","        # 当前熵高于目标时减小 alpha，让策略更关注回报。","        alpha_loss = -(","            self.log_alpha * (log_probs + self.target_entropy).detach()","        ).mean()","        self.log_alpha_optimizer.zero_grad()","        alpha_loss.backward()","        self.log_alpha_optimizer.step()","","        self.soft_update(self.critic_1, self.target_critic_1)","        self.soft_update(self.critic_2, self.target_critic_2)"],"pseudo":"y = calc_target(r, s', done)\nLq1 = MSE(Q1(s, a), y); update Q1\nLq2 = MSE(Q2(s, a), y); update Q2\na2, logp = mu(s)                  # reparameterized\nLpi = mean(alpha * logp - min(Q1(s, a2), Q2(s, a2)))\nupdate mu\nLalpha = -mean(log_alpha * (logp + target_entropy))\nupdate log_alpha\nsoft_update(Q1, Q1_target); soft_update(Q2, Q2_target)"}],"stages":[2,3,6,4,5],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5,6]}],"f ","        # states: [batch_size, state_dim]","        hidden = F.relu(self.fc1(states))","        # mean/log_std: [batch_size, action_dim]","        mean = self.fc_mu(hidden)","        log_std = torch.clamp(self.fc_log_std(hidden), -20, 2)","        std = log_std.exp()","        distribution = Normal(mean, std)","","        # rsample 使用 z = mean + std * epsilon，epsilon 与网络参数无关，","        # 因此梯度可以穿过随机采样过程回到 mean/std 网络。","        pre_tanh = distribution.rsample()","        squashed = torch.tanh(pre_tanh)","        # 把[-1, 1]映射到环境的[action_low, action_high]。","        actions = self.action_bias + self.action_scale * squashed","","        # tanh 和动作缩放会改变概率密度，必须减去变量变换的Jacobian项。","        correction = torch.log(","            self.action_scale * (1 - squashed.pow(2)) + 1e-6","        )","        log_probs = distribution.log_prob(pre_tanh) - correction","        # 多维动作的联合 log probability 等于各维 log probability 之和。","        return actions, log_probs.sum(dim=-1, keepdim=True)"],"pseudo":""},{"kind":"方法","kc":"method","name":"GaussianPolicy.__init__","line":"13-22","logic":"构建 state_dim→hidden_dim 的共享层和 fc_mu、fc_log_std 两个输出头，并把 (high-low)/2 与 (high+low)/2 注册为 buffer 以便随设备迁移。","srcStart":13,"src":["    def __init__(self, state_dim, hidden_dim, action_low, action_high):","        super().__init__()","        action_dim = len(action_low)","        self.fc1 = torch.nn.Linear(state_dim, hidden_dim)","        self.fc_mu = torch.nn.Linear(hidden_dim, action_dim)","        self.fc_log_std = torch.nn.Linear(hidden_dim, action_dim)","        low = torch.as_tensor(action_low, dtype=torch.float32)","        high = torch.as_tensor(action_high, dtype=torch.float32)","        self.register_buffer('action_scale', (high - low) / 2)","        self.register_buffer('action_bias', (high + low) / 2)"],"pseudo":""},{"kind":"方法","kc":"method","name":"GaussianPolicy.forward","line":"24-46","logic":"对状态求均值与截断到 [-20,2] 的 log_std 构造 Normal；用 rsample 得到 pre_tanh，经 tanh 与 action_bias/action_scale 映射为动作， 持追加、随机采样与大小查询。","srcStart":7,"src":["class ReplayBuffer:","    \"\"\"SAC使用的off-policy经验回放池。\"\"\"","","    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity)","","    def add(self, state, action, reward, next_state, done):","        # 每条经验保存(s, a, r, s', terminal)。","        self.buffer.append((state, action, reward, next_state, done))","","    def sample(self, batch_size):","        # 随机采样打散相邻时间步的相关性，提高off-policy训练稳定性。","        states, actions, rewards, next_states, dones = zip(","            *random.sample(self.buffer, batch_size)","        )","        return (","            np.asarray(states), np.asarray(actions), np.asarray(rewards),","            np.asarray(next_states), np.asarray(dones),","        )","","    def size(self):","        return len(self.buffer)"],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.__init__","line":"10-11","logic":"创建容量为 capacity 的 deque，满后自动移除最旧经验。","srcStart":10,"src":["    def __init__(self, capacity):","        self.buffer = collections.deque(maxlen=capacity)"],"pseudo":""},{"kind":"方法","kc":"method","name":"ReplayBuffer.add","line":"13-15","logic":"把 (state, action, reward, next_state, done) 追加进 buffer。","srcStart":13,"src":["    def add(self, state, action, reward, next_state, done):","        # 每条经验保存(s, a, r, s', terminal)。","        self.buffer.append((state, action, reward, next_state, done))"],"pseudo":"buffer.append((s, a, r, s2, done))\nif len(buffer) > capacity:\n    buffer.popleft()"},{"kind":"方法","kc":"method","name":"ReplayBuffer.sample","line":"17-25","logic":"用 random.sample 均匀抽取 batch_size 条经验，zip 拆成五元组并各转成 NumPy 数组返回。","srcStart":17,"src":["    def sample(self, batch_size):","        # 随机采样打散相邻时间步的相关性，提高off-policy训练稳定性。","        states, actions, rewards, next_states, dones = zip(","            *random.sample(self.buffer, batch_size)","        )","        return (","            np.asarray(states), np.asarray(actions), np.asarray(rewards),","            np.asarray(next_states), np.asarray(dones),","        )"],"pseudo":"batch = random.sample(buffer, batch_size)\nreturn zip(*batch)   # states, actions, rewards, next_states, dones"},{"kind":"方法","kc":"method","name":"ReplayBuffer.size","line":"27-28","logic":"返回 len(self.buffer)，即当前经验条数。","srcStart":27,"src":["    def size(self):","        return len(self.buffer)"],"pseudo":""},{"kind":"函数","kc":"func","name":"moving_average","line":"31-41","logic":"转成 float32 数组；长度不足 window_size 时原样返回，否则用累积和计算中段滑动平均，并用逐步增大的窗口补齐首尾后拼接返回。","srcStart":31,"src":["def moving_average(values, window_size):","    \"\"\"平滑训练回报；样本不足一个窗口时返回原始序列。\"\"\"","    values = np.asarray(values, dtype=np.float32)","    if len(values) < window_size:","        return values","    cumulative_sum = np.cumsum(np.insert(values, 0, 0))","    middle = (cumulative_sum[window_size:] - cumulative_sum[:-window_size]) / window_size","    radius = np.arange(1, window_size - 1, 2)","    begin = np.cumsum(values[:window_size - 1])[::2] / radius","    end = (np.cumsum(values[:-window_size:-1])[::2] / radius)[::-1]","    return np.concatenate((begin, middle, end))"],"pseudo":"return [mean(x[max(0, i-w+1):i+1]) for i in range(len(x))]"}],"stages":[2,3,4,6],"classGroups":[{"classIdx":1,"methodIdxs":[2,3,4,5]}],"funcIdxs":[6],"entryIdxs":[],"constIdx":0},{"path":"11_SAC/Pendulum/trainer.py","rootId":"11","rootDir":"11_SAC","name":"trainer.py","dir":"11_SAC/Pendulum","purpose":"实现 SAC 的 off-policy 训练循环，逐回合交互并在回放池足够后更新。","lines":39,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-2","logic":"导入 numpy 与 tqdm 进度条，无模块级常量。","srcStart":1,"src":["import numpy as np","from tqdm import tqdm"],"pseudo":""},{"kind":"函数","kc":"func","name":"train_off_policy_agent","line":"5-39","logic":"按 num_episodes 循环，用 seed+episode（或默认）重置环境；每步调用 agent.take_action(state) 与环境交互，把 done 记为 terminated or truncated 但只将 terminated 写入 buffer，buffer 达到 minimal_size 后每步调用 agent.update；每 10 回合更新 tqdm 后置回报信息并返回回报列表。","srcStart":5,"src":["def train_off_policy_agent(env, agent, num_episodes, replay_buffer,","                           minimal_size, batch_size, seed=None):","    \"\"\"执行 SAC 的 off-policy 训练。","","    和 PPO/TRPO 不同，SAC 不要求数据来自当前策略；","    transition 会长期保存在 replay buffer 中并被重复采样。","    \"\"\"","    return_list = []","    with tqdm(total=num_episodes, desc='Training') as progress:","        for episode in range(num_episodes):","            # 每个 episode 可以使用不同 seed，保证实验可复现但初始状态不完全相同。","            state, _ = env.reset() if seed is None else env.reset(seed=seed + episode)","            done = False","            episode_return = 0.0","            while not done:","                # SAC actor 自带随机性，不需要额外的 epsilon/OU 噪声。","                # SAC actor 本身是随机策略，不需要额外的 epsilon 或 OU 噪声。","                action = agent.take_action(state)","                next_state, reward, terminated, truncated, _ = env.step(action)","                done = terminated or truncated","                # done 控制交互循环；terminated 才写入 buffer 作为真正 terminal。","                # truncated 通常只是时间上限，Bellman target 仍然可以 bootstrap。","                replay_buffer.add(state, action, reward, next_state, terminated)","                state = next_state","                episode_return += reward","                if replay_buffer.size() >= minimal_size:","                    agent.update(replay_buffer.sample(batch_size))","            return_list.append(episode_return)","            if (episode + 1) % 10 == 0:","                progress.set_postfix({","                    'episode': episode + 1,","                    'return': '%.3f' % np.mean(return_list[-10:]),","                })","            progress.update(1)","    return return_list"],"pseudo":"for episode in 1 ... num_episodes:\n    s = env.reset()\n    done = False\n    while not done:\n        a = agent.take_action(s, explore=True)\n        s2, r, terminated, truncated, _ = env.step(a)\n        done = terminated or truncated\n        buffer.add(s, a, r, s2, terminated)\n        if buffer.size >= minimal_size:\n            agent.update(buffer.sample(batch_size))\n        s = s2"}],"stages":[1],"classGroups":[],"funcIdxs":[1],"entryIdxs":[],"constIdx":0},{"path":"11_SAC/Pendulum/visualization.py","rootId":"11","rootDir":"11_SAC","name":"visualization.py","dir":"11_SAC/Pendulum","purpose":"绘制 SAC 训练回报及移动平均曲线。","lines":20,"missingSrc":false,"blocks":[{"kind":"导入与常量","kc":"const","name":"导入与常量","line":"1-3","logic":"导入 matplotlib.pyplot，并从 rl_utils 引入 moving_average。","srcStart":1,"src":["import matplotlib.pyplot as plt","","from rl_utils import moving_average"],"pseudo":""},{"kind":"函数","kc":"func","name":"plot_training_results","line":"6-20","logic":"创建 1×2 子图，左图绘制逐回合原始回报，右图绘制 window_size=9 的移动平均，设置坐标轴与含环境名的标题后 tight_layout 并 show。","srcStart":6,"src":["def plot_training_results(return_list, env_name, window_size=9):","    episodes = list(range(len(return_list)))","    plt.figure(figsize=(10, 4))","    plt.subplot(1, 2, 1)","    plt.plot(episodes, return_list)","    plt.xlabel('Episodes')","    plt.ylabel('Returns')","    plt.title('SAC on {}'.format(env_name))","    plt.subplot(1, 2, 2)","    plt.plot(episodes, moving_average(return_list, window_size))","    plt.xlabel('Episodes')","    plt.ylabel('Moving average returns')","    plt.title('SAC moving average')","    plt.tight_layout()","    plt.show()"],"pseudo":""}],"stages":[1],"classGroups":[],"funcIdxs":[1],"entryIdxs":[],"constIdx":0}]}],"search":[{"path":"01_Cliff Walking/config.py","root":"01_Cliff Walking","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"无 import；定义地图宽 12、高 4、4 个动作、3000 回合，以及学习率 0.1、折扣因子 0.9、探索率 0.1 和打印间隔 20。"},{"path":"01_Cliff Walking/environment.py","root":"01_Cliff Walking","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 random 和 time，供环境中的随机行为与渲染帧间隔使用。"},{"path":"01_Cliff Walking/environment.py","root":"01_Cliff Walking","idx":1,"kind":"类","name":"Env","logic":"Env 保存地图宽高与智能体坐标，提供渲染、单步转移和复位接口，供训练循环交互。"},{"path":"01_Cliff Walking/environment.py","root":"01 ":"创建环境与算法表，循环 NUM_EPISODES 个回合；每步选择动作、调用 env.step，非终止时预选下一动作，调用 table.update，累计奖励并推进状态；每 PRINT_INTERVAL 回合打印分数，回合结束后 env.reset。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 random、gymnasium、numpy、collections、tqdm、torch、torch.nn.functional、matplotlib 和 rl_utils，为回放池、网络与可视化准备依赖。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":1,"kind":"类","name":"ReplayBuffer","logic":"ReplayBuffer 用 deque 保存固定容量的经验五元组，支持追加、随机采样和读取当前大小。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":2,"kind":"方法","name":"ReplayBuffer.__init__","logic":"用最大长度为 capacity 的 collections.deque 创建先进先出回放池，超出容量时自动丢弃最旧经验。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":3,"kind":"方法","name":"ReplayBuffer.add","logic":"把 (state, action, reward, next_state, done) 五元组追加到回放池尾部。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":4,"kind":"方法","name":"ReplayBuffer.sample","logic":"随机抽取 batch_size 条经验并用 zip(*transitions) 解包，返回 numpy 状态/下一状态数组以及动作、奖励、done 元组。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":5,"kind":"方法","name":"ReplayBuffer.size","logic":"返回回放池当前保存的经验条数。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":6,"kind":"类","name":"Qnet","logic":"Qnet 是单隐藏层多层感知机，将状态映射为每个离散动作的 Q 值。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":7,"kind":"方法","name":"Qnet.__init__","logic":"注册 state_dim→hidden_dim 的 fc1 与 hidden_dim→action_dim 的 fc2 两个线性层。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":8,"kind":"方法","name":"Qnet.forward","logic":"对输入先做 fc1 线性变换和 ReLU 激活，再经 fc2 输出各动作的 Q 值。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":9,"kind":"类","name":"DQN","logic":"DQN 维护在线网络、目标网络与 Adam 优化器，提供 epsilon-greedy 动作选择和基于 TD 目标的批量更新。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":10,"kind":"方法","name":"DQN.__init__","logic":"保存动作维度、gamma、epsilon、目标网络更新周期和 device；构建在线/目标 Qnet 并用 Adam 优化在线网络参数，更新计数器 count 初始化为 0。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":11,"kind":"方法","name":"DQN.take_action","logic":"以 epsilon 概率随机返回一个动作，否则将 state 转为 float tensor 送入 q_net，并返回 Q 值最大的动作编号。"},{"path":"02_DQN/practice.py","root":"02_DQN","idx":12,"kind":"方法","name":"DQN.update","logic":"把 transition_dict 批量转为 tensor（当前实现中 states 实际取自 rewards 字段），用 gather 取 Q(s,a)，用目标网络计算下一状态最大 Q，构造 r + gamma*maxQ*(1-done)，计算 MSE 后反向传播并更新参数；每 target_update 次把在线网络参数复制到目标网络并递增 count。"},{"path":"02_DQN/rl_utils.py","root":"02_DQN","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 tqdm、numpy、torch、collections 和 random，供训练进度、数值计算、回放池与采样使用。"},{"path":"02_DQN/rl_utils.py","root":"02_DQN","idx":1,"kind":"类","name":"ReplayBuffer","logic":"ReplayBuffer 用 deque 保存经验五元组，支持 add、随机 sample 和 size 查询。"},{"path":"02_DQN/rl_utils.py","root":"02_DQN","idx":2,"kind":"方法","name":"ReplayBuffer.__init__","logic":"按给定 capacity 创建有最大长度的 deque，作为先进先出经验池。"},{"path":"02_DQN/rl_utils.py","root":"02_DQN","idx":3,"kind":"方法","name":"ReplayBuffer.add","logic":"将 (state, action, reward, next_state, done) 追加到回放池。"},{"path":"02_DQN/rl_utils.py","root":"02_DQN","idx":4,"kind":"方法","name":"ReplayBuffer.sample","logic":"随机抽取 batch_size 条经验并用 zip(*transitions) 解包，返回 numpy 状态/下一状态数组以及动作、奖励、done 元组。"},{"path":"02_DQN/rl_utils.py","root":"02_DQN","idx":5,"kind":"方法","name":"ReplayBuffer.size","logic":"返回回放池中的经验条数。"},{"path":"02_DQN/rl_utils.py","root":"02_DQN","idx":6,"kind":"函数","name":"moving_average","logic":"先算序列前缀和，再用差分求中间完整窗口的均值，并分别用累积和计算首尾不完整窗口的均值，最后拼接返回滑动平均序列。"},{"path":"02_DQN/rl_utils.py","root":"02_DQN","idx":7,"kind":"函数","name":"train_on_policy_agent","logic":"把 num_episodes 均分为 10 轮并用 tqdm 显示进度；每回合重置环境，循环 take_action 与 env.step 收集 transition_dict 和累计回报，回合结束后调用 agent.update，记录 return_list 并每 10 回合显示最近 10 次平均回报。"},{"path":"02_DQN/rl_utils.py","root":"02_DQN","idx":8,"kind":"函数","name":"train_off_policy_agent","logic":"同样分 10 轮训练；每步把交互结果写入 replay_buffer，当 buffer 大小超过 minimal_size 时采样 batch_size 条组成 transition_dict 调用 agent.update，同时记录每回合回报并每 10 回合显示最近均值。"},{"path":"02_DQN/rl_utils.py","root":"02_DQN","idx":9,"kind":"函数","name":"compute_advantage","logic":"将 td_delta 转为 numpy 后逆序递推 advantage = gamma*lambda*advantage + delta，再反转顺序并转为 float tensor 返回。"},{"path":"03_Double DQN、Dueling DQN/agents.py","root":"03_Double DQN、Dueling DQN","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"引入 numpy 负责随机探索、torch 与 F 负责张量和 MSE 损失，并从 networks 导入 Qnet 与 DuelingQnet。"},{"path":"03_Double DQN、Dueling DQN/agents.py","root":"03_Double DQN、Dueling DQN","idx":1,"kind":"类","name":"DQN","logic":"DQN/Double DQN/Dueling DQN 共用的 agent 类，内部由 dqn_type 决定网络结构和下一状态价值的计算方式。"},{"path":"03_Double DQN、Dueling DQN/agents.py","root":"03_Double DQN、Dueling DQN","idx":2,"kind":"方法","name":"DQN.__init__","logic":"按 dqn_type 选择 DuelingQnet 或 Qnet 构建在线网络与目标网络，把在线权重同步给目标网络，创建 Adam 优化器并保存 gamma、epsilon、target_update、device 等超参。"},{"path":"03_Double DQN、Dueling DQN/agents.py","root":"03_Double DQN、Dueling DQN","idx":3,"kind":"方法","name":"DQN.take_action","logic":"epsilon-greedy 策略：以 epsilon 概率用 np.random.randint 随机选动作，否则把 state 转成张量送入 q_net，取 argmax 对应动作索引。"},{"path":"03_Double DQN、Dueling DQN/agents.py","root":"03_Double DQN、Dueling DQN","idx":4,"kind":"方法","name":"DQN.max_q_value","logic":"把单个 state 转为 [1, state_dim] 张量输入 q_net，返回所有动作 Q 值中的最大值，供训练时记录 Q 值曲线。"},{"path":"03_Double DQN、Dueling DQN/agents.py","root":"03_Double DQN、Dueling DQN","idx":5,"kind":"方法","name":"DQN.update","logic":"把 transition_dict 转成张量并用 gather 取 Q(s,a)；DoubleDQN 由在线网络 argmax 选动作、目标网络评估该动作，其余变体直接用目标网络 max；再以 r + gamma*Q'*(1-done) 为 TD 目标做 MSE 反传，并按 count % target_update 同步目标网络。"},{"path":"03_Double DQN、Dueling DQN/agents.py","root":"03_Double DQN、Dueling DQN","idx":6,"kind":"函数","name":"build_agent","logic":"工厂函数：把别名 VanillaDQN 归一为 DQN，校验算法名只在 DQN/DoubleDQN/DuelingDQN 之内（否则抛 ValueError），返回对应 dqn_type 的 DQN 实例。"},{"path":"03_Double DQN、Dueling DQN/config.py","root":"03_Double DQN、Dueling DQN","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch 并定义全局配置：ALGORITHM 手动选择 DQN/DoubleDQN/DuelingDQN，另有 LR、GAMMA、EPSILON、TARGET_UPDATE、NUM_EPISODES、HIDDEN_DIM、BUFFER_SIZE、MINIMAL_SIZE、BATCH_SIZE、SEED、ENV_NAME='Pendulum-v1'、ACTION_DIM 以及按 CUDA 可用性选择的 DEVICE。"},{"path":"03_Double DQN、Dueling DQN/environment.py","root":"03_Double DQN、Dueling DQN","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 gymnasium 用于构造环境。"},{"path":"03_Double DQN、Dueling DQN/environment.py","root":"03_Double DQN、Dueling DQN","idx":1,"kind":"函数","name":"make_environment","logic":"调用 gym.make 创建环境，从 observation_space.shape[0] 读出状态维度，原样带回 action_dim，返回 (env, state_dim, action_dim)。"},{"path":"03_Double DQN、Dueling DQN/environment.py","root":"03_Double DQN、Dueling DQN","idx":2,"kind":"函数","name":"dis_to_con","logic":"把离散动作索引按 action_dim-1 等分，线性映射到 env.action_space 的 [low[0], high[0]] 连续区间，供 Pendulum 执行。"},{"path":"03_Double DQN、Dueling DQN/main.py","root":"03_Double DQN、Dueling DQN","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 random/numpy/torch 三个随机源、config 配置，以及 agents.build_agent、environment.make_environment、trainer.train_DQN、visualization.plot_training_results。"},{"path":"03_Double DQN、Dueling DQN/main.py","root":"03_Double DQN、Dueling DQN","idx":1,"kind":"函数","name":"set_seed","logic":"分别设置 random、numpy、torch 的随机种子，保证实验可复现。"},{"path":"03_Double DQN、Dueling DQN/main.py","root":"03_Double DQN、Dueling DQN","idx":2,"kind":"函数","name":"main","logic":"按顺序设置种子、创建环境、构造 ReplayBuffer，用 config 中各项超参调用 build_agent 建 agent，再交给 train_DQN 训练，最后把回报列表、max Q 值列表与算法/环境名传给 plot_training_results 绘图。"},{"path":"03_Double DQN、Dueling DQN/main.py","root":"03_Double DQN、Dueling DQN","idx":3,"kind":"入口","name":"if __name__ == '__main__'","logic":"脚本直接运行时调用 main()。"},{"path":"03_Double DQN、Dueling DQN/networks.py","root":"03_Double DQN、Dueling DQN","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch 构建网络层，导入 F 使用 relu。"},{"path":"03_Double DQN、Dueling DQN/networks.py","root":"03_Double DQN、Dueling DQN","idx":1,"kind":"类","name":"Qnet","logic":"普通 DQN 网络：输入状态，输出每个离散动作的 Q 值。"},{"path":"03_Double DQN、Dueling DQN/networks.py","root":"03_Double DQN、Dueling DQN","idx":2,"kind":"方法","name":"Qnet.__init_ ualization.py","root":"03_Double DQN、Dueling DQN","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 matplotlib.pyplot 用于绘图，并导入 rl_utils 取滑动平均函数。"},{"path":"03_Double DQN、Dueling DQN/visualization.py","root":"03_Double DQN、Dueling DQN","idx":1,"kind":"函数","name":"plot_training_results","logic":"先对 return_list 做窗口 5 的 moving_average 并画出回报-回合曲线且 show；再按帧画 max_q_value_list，加 y=0（橙虚线）与 y=10（红虚线）参考线后再次 show，标题为“算法 on 环境”。"},{"path":"04_策略梯度算法_Reinforce/agents.py","root":"04_策略梯度算法_Reinforce","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch、numpy，并从 networks 导入 PolicyNet。"},{"path":"04_策略梯度算法_Reinforce/agents.py","root":"04_策略梯度算法_Reinforce","idx":1,"kind":"类","name":"REINFORCE","logic":"封装 REINFORCE 策略梯度算法，持有策略网络、优化器与折扣因子。"},{"path":"04_策略梯度算法_Reinforce/agents.py","root":"04_策略梯度算法_Reinforce","idx":2,"kind":"方法","name":"REINFORCE.__init__","logic":"将 PolicyNet 构建到指定 device，用 Adam 包装网络参数并保存 gamma 与 device。"},{"path":"04_策略梯度算法_Reinforce/agents.py","root":"04_策略梯度算法_Reinforce","idx":3,"kind":"方法","name":"REINFORCE.take_action","logic":"把 state 转成 float32 张量并 unsqueeze 成 [1, state_dim] 送入策略网络，用 Categorical(probs).sample() 采样动作并返回 int 索引。"},{"path":"04_策略梯度算法_Reinforce/agents.py","root":"04_策略梯度算法_Reinforce","idx":4,"kind":"方法","name":"REINFORCE.update","logic":"逆序遍历整条 episode 的奖励，逐步累积折扣回报 G = gamma*G + r，对每步计算 loss = -log_prob * G 并 backward 累积梯度，循环结束后 optimizer.step() 一次性更新。"},{"path":"04_策略梯度算法_Reinforce/config.py","root":"04_策略梯度算法_Reinforce","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch 并定义 LR=1e-3、GAMMA=0.98、NUM_EPISODES=1000、HIDDEN_DIM=128、ENV_NAME='CartPole-v1'、SEED=0，以及按 CUDA 可用性选择的 DEVICE。"},{"path":"04_策略梯度算法_Reinforce/environment.py","root":"04_策略梯度算法_Reinforce","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 gymnasium 用于构造环境。"},{"path":"04_策略梯度算法_Reinforce/environment.py","root":"04_策略梯度算法_Reinforce","idx":1,"kind":"函数","name":"make_environment","logic":"gym.make 创建环境，从 observation_space.shape[0] 取 state_dim、从 action_space.n 取离散动作数 action_dim，返
