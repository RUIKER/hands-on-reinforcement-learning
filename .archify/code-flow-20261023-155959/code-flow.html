t，并从 rl_utils 引入 moving_average。"},{"path":"10_TD3/Pendulum/visualization.py","root":"10_TD3","idx":1,"kind":"函数","name":"plot_training_results","logic":"创建 1×2 子图，左图绘制逐回合原始回报，右图绘制 window_size=9 的移动平均，设置坐标轴与含环境名的标题后 tight_layout 并 show。"},{"path":"11_SAC/Pendulum/agents.py","root":"11_SAC","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy、torch 与 torch.nn.functional，并从 networks 引入 Critic 与 GaussianPolicy；模块内无常量定义。"},{"path":"11_SAC/Pendulum/agents.py","root":"11_SAC","idx":1,"kind":"类","name":"SAC","logic":"维护 GaussianPolicy、两个 online critic、两个 target critic、actor/critic/alpha 三个优化器以及奖励重塑参数，实现随机动作采样、soft Bellman target 计算和单批更新。"},{"path":"11_SAC/Pendulum/agents.py","root":"11_SAC","idx":2,"kind":"方法","name":"SAC.__init__","logic":"构建 GaussianPolicy 与两套 Critic，把 online critic 参数复制给 target；建立三个 Adam 优化器，把可学习 log_alpha 初始化为 log(0.01)，记录 target_entropy、tau、gamma、reward_shift 与 reward_scale。"},{"path":"11_SAC/Pendulum/agents.py","root":"11_SAC","idx":3,"kind":"方法","name":"SAC.take_action","logic":"在 no_grad 下把单个状态转成 [1, state_dim] 张量送入随机策略采样一次动作（同时丢弃 log_prob），squeeze 后返回 NumPy 动作；策略本身带随机性，不需额外探索噪声。"},{"path":"11_SAC/Pendulum/agents.py","root":"11_SAC","idx":4,"kind":"方法","name":"SAC.calc_target","logic":"在 no_grad 下对 next_states 重参数化采样得到 a' 与 log pi(a'|s')，用两个 target critic 的较小 Q 值减去 exp(log_alpha)·log pi 得到 soft Q，再返回 r + gamma·(1-done)·soft Q。"},{"path":"11_SAC/Pendulum/agents.py","root":"11_SAC","idx":5,"kind":"方法","name":"SAC.soft_update","logic":"对 online 与 target 网络参数逐对做 Polyak 平均 target ← (1-tau)·target + tau·online，使用 data 原地修改。"},{"path":"11_SAC/Pendulum/agents.py","root":"11_SAC","idx":6,"kind":"方法","name":"SAC.update","logic":"把 batch 转成张量并按 (r+shift)/scale 重塑奖励；先计算无梯度的 soft TD target，对两个 critic 分别做 MSE 更新；再用重参数化采样求 (alpha·log pi - min(Q1,Q2)).mean() 更新 actor，用 -(log_alpha·(log pi+target_entropy)) 更新温度参数，最后软更新两个 target critic。"},{"path":"11_SAC/Pendulum/config.py","root":"11_SAC","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"仅导入 torch，随后定义 actor/alpha 学习率 3e-4、critic 学习率 3e-3、100 个 episode、隐藏层 128、gamma 0.99、tau 0.005、buffer 10 万与 batch 64、REWARD_SHIFT 与 REWARD_SCALE 均为 8、SEED=0、ENV_NAME='Pendulum-v1' 以及自动选择 cuda/cpu 的 DEVICE。"},{"path":"11_SAC/Pendulum/environment.py","root":"11_SAC","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 gymnasium，无模块级常量。"},{"path":"11_SAC/Pendulum/environment.py","root":"11_SAC","idx":1,"kind":"函数","name":"make_environment","logic":"调用 gym.make 创建环境，若 action_space 没有 shape 属性则抛出 TypeError 提示需要 Box 连续动作空间；否则返回 env、state_dim、action_dim 以及 copy 后的动作上下界。"},{"path":"11_SAC/Pendulum/main.py","root":"11_SAC","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 random、numpy、torch、config，以及本目录的 SAC、make_environment、ReplayBuffer、train_off_policy_agent 与 plot_training_results。"},{"path":"11_SAC/Pendulum/main.py","root":"11_SAC","idx":1,"kind":"函数","name":"set_seed","logic":"用 random.seed、np.random.seed、torch.manual_seed 固定 Python、NumPy 与 PyTorch 的随机种子。"},{"path":"11_SAC/Pendulum/main.py","root":"11_SAC","idx":2,"kind":"函数","name":"main","logic":"设置种子并创建环境，按 config 的参数实例化 SAC（target_entropy 传 -action_dim），建立 ReplayBuffer 后调用 train_off_policy_agent 训练，最后绘制回报曲线并 env.close()。"},{"path":"11_SAC/Pendulum/main.py","root":"11_SAC","idx":3,"kind":"入口","name":"if __name__ == '__main__'","logic":"脚本直接运行时调用 main()。"},{"path":"11_SAC/Pendulum/networks.py","root":"11_SAC","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch、torch.nn.functional 以及 torch.distributions.Normal，无模块级常量。"},{"path":"11_SAC/Pendulum/networks.py","root":"11_SAC","idx":1,"kind":"类","name":"GaussianPolicy","logic":"随机高斯策略：共享隐藏层后输出均值与 log 标准差，经重参数化采样、tanh 压缩和线性缩放得到合法动作，并返回修正后的对数概率。"},{"path":"11_SAC/Pendulum/networks.py","root":"11_SAC","idx":2,"kind":"方法","name":"GaussianPolicy.__init__","logic":"构建 state_dim→hidden_dim 的共享层和 fc_mu、fc_log_std 两个输出头，并把 (high-low)/2 与 (high+low)/2 注册为 buffer 以便随设备迁移。"},{"path":"11_SAC/Pendulum/networks.py","root":"11_SAC","idx":3,"kind":"方法","name":"GaussianPolicy.forward","logic":"对状态求均值与截断到 [-20,2] 的 log_std 构造 Normal；用 rsample 得到 pre_tanh，经 tanh 与 action_bias/action_scale 映射为动作，同时减去 log(action_scale·(1-tanh²)+1e-6) 修正密度，按动作维度求和后返回 (actions, log_probs)。"},{"path":"11_SAC/Pendulum/networks.py","root":"11_SAC","idx":4,"kind":"类","name":"Critic","logic":"Q(s,a) 网络，将状态与动作拼接后经两层隐藏层输出标量 Q 值；SAC 独立实例化两个以减少高估。"},{"path":"11_SAC/Pendulum/networks.py","root":"11_SAC","idx":5,"kind":"方法","name":"Critic.__init__","logic":"第一层输入维度为 state_dim+action_dim，第二层为 hidden_dim，输出层为 1 维。"},{"path":"11_SAC/Pendulum/networks.py","root":"11_SAC","idx":6,"kind":"方法","name":"Critic.forward","logic":"沿 dim=1 拼接 states 与 actions，经 ReLU(fc1)、ReLU(fc2) 后由 fc_out 返回 [batch_size, 1] 的 Q 值。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 random、gym、numpy、tqdm、torch、F、Normal、matplotlib 以及本目录的 rl_utils；模块级超参数与实验代码放在文件末尾。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":1,"kind":"类","name":"PolicyNetContinuous","logic":"连续动作随机策略：fc1 提取特征后由 fc_mu/fc_std 给出高斯参数，softplus 保证标准差为正，rsample 后经 tanh 乘 action_bound 输出动作及 log_prob。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":2,"kind":"方法","name":"PolicyNetContinuous.__init__","logic":"建立 state_dim→hidden_dim 的 fc1，以及输出 action_dim 维的 fc_mu 与 fc_std，并保存标量动作上界 action_bound。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":3,"kind":"方法","name":"PolicyNetContinuous.forward","logic":"ReLU 后算 mu 与 softplus(std) 构造 Normal，rsample 得 normal_sample，tanh 后减去 log(1-tanh(action)²+1e-7) 修正 log_prob，再乘 action_bound 返回动作与逐维 log_prob。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":4,"kind":"类","name":"QValueNetContinuous","logic":"Q(s,a) 网络，把状态动作拼接后经两层隐藏层输出标量价值。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":5,"kind":"方法","name":"QValueNetContinuous.__init__","logic":"输入层维度为 state_dim+action_dim，隐藏层为 hidden_dim，输出 1 维。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":6,"kind":"方法","name":"QValueNetContinuous.forward","logic":"沿 dim=1 拼接 x 与 a，经 ReLU(fc1)、ReLU(fc2) 后由 fc_out 输出 Q 值。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":7,"kind":"类","name":"SACContinuous","logic":"单文件版连续动作 SAC，维护策略网络、两个 Q 网络及 target、可学习 log_alpha 与三个优化器。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":8,"kind":"方法","name":"SACContinuous.__init__","logic":"创建 PolicyNetContinuous、两个 QValueNetContinuous 及对应 target 并同步初始参数，建立 actor/critic 优化器；把 log_alpha 设为可求导张量并记录 target_entropy、gamma、tau 与 device。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":9,"kind":"方法","name":"SACContinuous.take_action","logic":"把状态包成张量送入 actor 取第一个返回值（动作），用 item() 取出标量并以列表形式返回，适配 Pendulum 单维动作。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":10,"kind":"方法","name":"SACContinuous.calc_target","logic":"对 next_states 采样得到 next_actions 与 log_prob，令 entropy=-log_prob，用两个 target critic 的较小值加 alpha·entropy 构成 next_value，再算 r + gamma·(1-done)·next_value。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":11,"kind":"方法","name":"SACContinuous.soft_update","logic":"用 copy_ 把 target 参数更新为 target·(1-tau) + online·tau。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":12,"kind":"方法","name":"SACContinuous.update","logic":"从 transition_dict 取五元组转成张量并对奖励做 (r+8)/8 重塑；计算 td_target 后分别对两个 Q 网络做 MSE 更新，再以 -alpha·entropy - min(Q1,Q2) 更新 actor、以 (entropy-target_entropy)·alpha 更新 log_alpha，最后软更新两个 target critic。"},{"path":"11_SAC/Pendulum/practice.py","root":"11_SAC","idx":13,"kind":"入口","name":"模块级训练脚本","logic":"模块导入时即执行：创建 Pendulum-v0、读取维度与 action_bound、设置各随机种子与超参数，构建 ReplayBuffer 和 SACContinuous，调用 rl_utils.train_off_policy_agent 训练后分别绘制原始回报与 9 窗口移动平均并 show。"},{"path":"11_SAC/Pendulum/rl_utils.py","root":"11_SAC","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 collections、random 与 numpy，无模块级常量。"},{"path":"11_SAC/Pendulum/rl_utils.py","root":"11_SAC","idx":1,"kind":"类","name":"ReplayBuffer","logic":"以 deque(maxlen=capacity) 存储 (s, a, r, s', terminal)，支持追加、随机采样与大小查询。"},{"path":"11_SAC/Pendulum/rl_utils.py","root":"11_SAC","idx":2,"kind":"方法","name":"ReplayBuffer.__init__","logic":"创建容量为 capacity 的 deque，满后自动移除最旧经验。"},{"path":"11_SAC/Pendulum/rl_utils.py","root":"11_SAC","idx":3,"kind":"方法","name":"ReplayBuffer.add","logic":"把 (state, action, reward, next_state, done) 追加进 buffer。"},{"path":"11_SAC/Pendulum/rl_utils.py","root":"11_SAC","idx":4,"kind":"方法","name":"ReplayBuffer.sample","logic":"用 random.sample 均匀抽取 batch_size 条经验，zip 拆成五元组并各转成 NumPy 数组返回。"},{"path":"11_SAC/Pendulum/rl_utils.py","root":"11_SAC","idx":5,"kind":"方法","name":"ReplayBuffer.size","logic":"返回 len(self.buffer)，即当前经验条数。"},{"path":"11_SAC/Pendulum/rl_utils.py","root":"11_SAC","idx":6,"kind":"函数","name":"moving_average","logic":"转成 float32 数组；长度不足 window_size 时原样返回，否则用累积和计算中段滑动平均，并用逐步增大的窗口补齐首尾后拼接返回。"},{"path":"11_SAC/Pendulum/trainer.py","root":"11_SAC","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 tqdm 进度条，无模块级常量。"},{"path":"11_SAC/Pendulum/trainer.py","root":"11_SAC","idx":1,"kind":"函数","name":"train_off_policy_agent","logic":"按 num_episodes 循环，用 seed+episode（或默认）重置环境；每步调用 agent.take_action(state) 与环境交互，把 done 记为 terminated or truncated 但只将 terminated 写入 buffer，buffer 达到 minimal_size 后每步调用 agent.update；每 10 回合更新 tqdm 后置回报信息并返回回报列表。"},{"path":"11_SAC/Pendulum/visualization.py","root":"11_SAC","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 matplotlib.pyplot，并从 rl_utils 引入 moving_average。"},{"path":"11_SAC/Pendulum/visualization.py","root":"11_SAC","idx":1,"kind":"函数","name":"plot_training_results","logic":"创建 1×2 子图，左图绘制逐回合原始回报，右图绘制 window_size=9 的移动平均，设置坐标轴与含环境名的标题后 tight_layout 并 show。"}]};
const $ = (sel, el=document) => el.querySelector(sel);
const state = {path:null, block:null, tab:"pseudo"};
const fileMap = new Map();
DATA.roots.forEach(root => root.files.forEach(file => fileMap.set(file.path, file)));

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[ch]));
}
function initials(root){
  return root.files.length;
}
function updateHash(path, idx){
  const hash = idx == null ? encodeURIComponent(path) : encodeURIComponent(path) + "::" + idx;
  history.replaceState(null, "", "#" + hash);
}
function renderNav(){
  $("#nav").innerHTML = DATA.roots.map(root => `
    <div class="root-group" data-root="${root.id}">
      <button class="root-head" data-root-toggle="${root.id}" aria-expanded="false">
        <span class="root-id">${esc(root.id)}</span>
        <span class="root-name">${esc(root.dir.replace(/^\d+_/, ""))}</span>
        <span class="root-count">${initials(root)}</span>
      </button>
      <div class="root-files">
        ${root.files.map(file => `
          <button class="file-item" data-path="${esc(file.path)}">
            <span>${esc(file.name)}</span>
            <span class="file-blocks">${file.blocks.length}</span>
          </button>`).join("")}
      </div>
    </div>`).join("");
  $("#file-count").textContent = DATA.stats.files + " files";
  $("#brand-sub").textContent = `${DATA.stats.files} 个文件 · ${DATA.stats.blocks} 个逻辑块 · 点击块看伪代码`;
  $("#mobile-file").innerHTML = DATA.roots.map(root => `
    <optgroup label="${esc(root.dir)}">
      ${root.files.map(file => `<option value="${esc(file.path)}">${esc(file.name)}</option>`).join("")}
    </optgroup>`).join("");
}
function expandRoot(id){
  const group = document.querySelector(`.root-group[data-root="${id}"]`);
  if(!group) return;
  group.classList.add("open");
  const head = $(".root-head", group);
  if(head) head.setAttribute("aria-expanded", "true");
}
function markActive(){
  document.querySelectorAll(".file-item").forEach(el => {
    el.classList.toggle("active", el.dataset.path === state.path);
  });
  document.querySelectorAll(".root-head").forEach(el => {
    const group = el.closest(".root-group");
    const active = group && [...group.querySelectorAll(".file-item")].some(f => f.dataset.path === state.path);
    el.classList.toggle("active", !!active);
  });
  const mobile = $("#mobile-file");
  if(mobile && mobile.value !== state.path) mobile.value = state.path;
}
function renderBlock(file, idx){
  const b = file.blocks[idx];
  if(!b) return "";
  return `<button class="block-card" data-idx="${idx}">
    <div class="block-top">
      <span class="badge ${b.kc}">${esc(b.kind)}</span>
      <span class="block-name">${esc(b.name)}</span>
      <span class="block-line">${esc(b.line)}</span>
    </div>
    <p class="block-logic">${esc(b.logic)}</p>
    ${b.pseudo ? '<span class="key-flag">伪代码</span>' : ""}
  </button>`;
}
function renderMain(){
  const file = fileMap.get(state.path);
  if(!file){ $("#main").innerHTML = '<p class="file-sub">选择一个文件开始。</p>'; return; }
  const classGroups = file.classGroups.map(group => `
    <article class="class-group">
      ${renderBlock(file, group.classIdx)}
      ${group.methodIdxs.length ? `<div class="methods">${group.methodIdxs.map(i => renderBlock(file, i)).join("")}</div>` : ""}
    </article>`).join("");
  const funcs = file.funcIdxs.map((idx, n) => `
    ${n ? '<span class="down-arrow">↓</span>' : ""}
    ${renderBlock(file, idx)}`).join("");
  const entries = file.entryIdxs.map(idx => renderBlock(file, idx)).join("");
  const constChip = file.constIdx == null ? "" : `
    <button class="const-chip" data-idx="${file.constIdx}">
      <span>导入与常量</span><span>${esc(file.blocks[file.constIdx].line)}</span>
    </button>`;
  const stages = file.stages.map((idx, n) => {
    const b = file.blocks[idx];
    if(!b) return "";
    return `${n ? '<span class="flow-arrow">→</span>' : ""}
      <button class="stage" data-idx="${idx}">
        ${b.pseudo ? '<span class="key-dot"></span>' : ""}
        <span class="stage-num">${String(n + 1).padStart(2, "0")}</span>
        <span class="stage-name">${esc(b.name)}</span>
        <span class="stage-sub">${esc(b.logic)}</span>
      </button>`;
  }).join("");
  $("#main").innerHTML = `
    <div class="crumbs"><span>${esc(file.rootId)}</span><b>/</b><span>${esc(file.dir)}</span><b>/</b><b>${esc(file.name)}</b></div>
    <h2 class="file-title">${esc(file.name)}</h2>
    <p class="file-sub">${esc(file.purpose)}</p>
    <div class="meta-row">
      <span class="pill"><b>${file.lines}</b> 行</span>
      <span class="pill"><b>${file.blocks.length}</b> 逻辑块</span>
      <span class="pill"><b>${file.classGroups.length}</b> 类</span>
      <span class="pill"><b>${file.blocks.filter(b => b.pseudo).length}</b> 个伪代码入口</span>
      <span class="pill">点击块查看详情</span>
    </div>
    ${file.missingSrc ? '<p class="src-warn">源文件当前不在磁盘上，页面保留已提取的块逻辑；源码视图不可用。</p>' : ""}
    <div class="section-label">主流程</div>
    ${stages ? `<div class="pipeline${file.stages.length === 1 ? " single" : ""}">${stages}</div>` : '<p class="file-sub">这个文件没有可展开的执行阶段。</p>'}
    ${constChip}
    <div class="section-label">类与函数逻辑</div>
    ${classGroups}
    ${funcs ? `<div class="func-flow">${funcs}</div>` : ""}
    ${entries ? `<div class="entry-wrap">${entries}</div>` : ""}
  `;
}
function selectFile(path, blockIdx){
  if(!fileMap.has(path)) return;
  state.path = path;
  state.block = null;
  expandRoot(fileMap.get(path).rootId);
  renderMain();
  markActive();
  updateHash(path, null);
  $("#main").scrollTop = 0;
  closeDrawer();
  if(blockIdx != null) setTimeout(() => openDrawer(blockIdx), 0);
}
function openDrawer(idx){
  const file = fileMap.get(state.path);
  if(!file) return;
  const b = file.blocks[idx];
  if(!b) return;
  state.block = idx;
  $("#drawer-kind").className = "badge " + b.kc;
  $("#drawer-kind").textContent = b.kind;
  $("#drawer-name").textContent = b.name;
  $("#drawer-path").textContent = `${file.path} · ${b.line}`;
  $("#drawer-logic").textContent = b.logic;
  const pseudoSection = $("#tab-pseudo");
  const pseudoTab = document.querySelector('.tab[data-tab="pseudo"]');
  if(b.pseudo){
    pseudoSection.hidden = false;
    pseudoTab.hidden = false;
    $("#pseudo-code").textContent = b.pseudo;
  } else {
    pseudoSection.hidden = true;
    pseudoTab.hidden = true;
    $("#pseudo-code").textContent = "";
  }
  const src = b.src && b.src.length
    ? b.src.map((line, i) => String(b.srcStart + i).padStart(4, " ") + "  " + line).join("\n")
    : (file.missingSrc
        ? "源文件当前不在磁盘上。这里只保留已提取的逻辑注释与伪代码，源码视图不可用。"
        : "（源码未嵌入）");
  $("#source-code").textContent = src;
  setTab(b.pseudo ? "pseudo" : "source");
  $("#drawer").classList.add("open");
  $("#drawer").setAttribute("aria-hidden", "false");
  $("#drawer-backdrop").hidden = false;
  document.body.style.overflow = "hidden";
  updateHash(state.path, idx);
  setTimeout(() => $("#drawer-close").focus(), 20);
}
function closeDrawer(){
  $("#drawer").classList.remove("open");
  $("#drawer").setAttribute("aria-hidden", "true");
  $("#drawer-backdrop").hidden = true;
  document.body.style.overflow = "";
  state.block = null;
  if(state.path) updateHash(state.path, null);
}
function setTab(name){
  state.tab = name;
  document.querySelectorAll(".tab").forEach(tab => {
    tab.classList.toggle("active", tab.dataset.tab === name);
    tab.setAttribute("aria-selected", tab.dataset.tab === name ? "true" : "false");
  });
  $("#tab-pseudo").hidden = name !== "pseudo";
  $("#tab-source").hidden = name !== "source";
}
function search(query){
  const q = query.trim().toLowerCase();
  const box = $("#search-results");
  if(!q){ box.hidden = true; box.innerHTML = ""; return; }
  const hits = [];
  for(const item of DATA.search){
    if(hits.length >= 40) break;
    const text = (item.path + " " + item.name + " " + item.logic).toLowerCase();
    if(text.includes(q)) hits.push(item);
  }
  if(!hits.length){
    box.innerHTML = '<div class="search-empty">没有匹配的文件或代码块。</div>';
    box.hidden = false;
    return;
  }
  box.innerHTML = hits.map(item => `
    <button class="result" data-path="${esc(item.path)}" data-idx="${item.idx}">
      <span class="result-path">${esc(item.path)} · ${esc(item.kind)} · ${esc(item.name)}</span>
      <span class="result-name"><span class="result-kind">${esc(item.name)}</span>${esc(item.logic)}</span>
    </button>`).join("");
  box.hidden = false;
}
function bind(){
  $("#nav").addEventListener("click", event => {
    const toggle = event.target.closest("[data-root-toggle]");
    if(toggle){
      const group = toggle.closest(".root-group");
      const open = group.classList.toggle("open");
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
      return;
    }
    const file = event.target.closest("[data-path]");
    if(file) selectFile(file.dataset.path);
  });
  $("#main").addEventListener("click", event => {
    const target = event.target.closest("[data-idx]");
    if(target) openDrawer(Number(target.dataset.idx));
  });
  $("#search").addEventListener("input", event => search(event.target.value));
  $("#search-results").addEventListener("click", event => {
    const hit = event.target.closest(".result");
    if(!hit) return;
    $("#search").value = "";
    $("#search-results").hidden = true;
    selectFile(hit.dataset.path, Number(hit.dataset.idx));
  });
  $("#mobile-file").addEventListener("change", event => selectFile(event.target.value));
  $("#drawer-close").addEventListener("click", closeDrawer);
  $("#drawer-backdrop").addEventListener("click", closeDrawer);
  document.querySelectorAll(".tab").forEach(tab => {
    tab.addEventListener("click", () => setTab(tab.dataset.tab));
  });
  document.addEventListener("keydown", event => {
    if(event.key === "Escape"){
      if(!$("#drawer").classList.contains("open")){
        $("#search-results").hidden = true;
      } else closeDrawer();
    }
    if(event.key === "/" && document.activeElement !== $("#search")){
      event.preventDefault();
      $("#search").focus();
    }
  });
}
function boot(){
  renderNav();
  bind();
  const raw = decodeURIComponent(location.hash.slice(1));
  const [hashPath, hashIdx] = raw.split("::");
  const fallback = "10_TD3/Pendulum/agents.py";
  const path = fileMap.has(hashPath) ? hashPath : (fileMap.has(fallback) ? fallback : DATA.roots[0].files[0].path);
  selectFile(path, hashIdx != null && hashIdx !== "" ? Number(hashIdx) : null);
}
function runAudit(){
  const out = {files:0, badCards:[], pseudoMiss:[], zeroStage:[], overflow:[]};
  const original = state.path;
  DATA.roots.forEach(root => root.files.forEach(file => {
    state.path = file.path;
    renderMain();
    out.files += 1;
    const cards = document.querySelectorAll("#main .block-card").length;
    const expected = file.blocks.filter(b => b.kind !== "导入与常量").length;
    if(cards !== expected) out.badCards.push(`${file.path}:${cards}/${expected}`);
    file.blocks.forEach((block, i) => {
      if(!block.pseudo) return;
      openDrawer(i);
      if(!$("#pseudo-code").textContent.trim()) out.pseudoMiss.push(`${file.path}#${i}`);
      closeDrawer();
    });
    if(!file.stages.length) out.zeroStage.push(file.path);
    if(document.documentElement.scrollWidth > innerWidth + 1){
      out.overflow.push(`${file.path}:${document.documentElement.scrollWidth}`);
    }
  }));
  state.path = original;
  renderMain();
  markActive();
  const pre = document.createElement("pre");
  pre.id = "audit-output";
  pre.textContent = JSON.stringify(out);
  document.body.appendChild(pre);
}
function runSelfTest(){
  const out = {fileItems: document.querySelectorAll(".file-item").length};
  selectFile("10_TD3/Pendulum/agents.py");
  out.stages = document.querySelectorAll(".stage").length;
  const cards = [...document.querySelectorAll(".block-card")];
  const update = cards.find(card => $(".block-name", card)?.textContent === "TD3.update");
  out.hasUpdate = !!update;
  update?.click();
  out.drawer = $("#drawer").classList.contains("open");
  out.pseudo = $("#pseudo-code").textContent.includes("target");
  closeDrawer();
  const input = $("#search");
  input.value = "SAC.update";
  input.dispatchEvent(new Event("input", {bubbles:true}));
  out.viewport = innerWidth;
  out.docScroll = document.documentElement.scrollWidth;
  out.overflow = [...document.querySelectorAll("body *")]
    .filter(el => !el.closest("#drawer, #drawer-backdrop"))
    .filter(el => el.getBoundingClientRect().right > innerWidth + 1)
    .slice(0, 8)
    .map(el => `${el.tagName}.${String(el.className).replace(/\s+/g, ".")}@${Math.round(el.getBoundingClientRect().right)}`);
  setTimeout(() => {
    out.search = document.querySelectorAll("#search-results .result").length;
    const pre = document.createElement("pre");
    pre.id = "selftest-output";
    pre.textContent = JSON.stringify(out);
    document.body.appendChild(pre);
  }, 150);
}
document.addEventListener("DOMContentLoaded", () => {
  boot();
  const params = new URLSearchParams(location.search);
  if(params.has("audit")) setTimeout(runAudit, 120);
  else if(params.has("selftest")) setTimeout(runSelfTest, 120);
});
</script>
