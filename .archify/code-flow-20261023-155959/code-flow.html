te, action, reward, next_state, done) 五元组追加进缓冲区，超出容量时丢弃最旧样本。"},{"path":"04_策略梯度算法_Reinforce/rl_utils.py","root":"04_策略梯度算法_Reinforce","idx":4,"kind":"方法","name":"ReplayBuffer.sample","logic":"random.sample 抽 batch_size 条经验并用 zip 拆成五列，states/next_states 转 numpy 数组后返回。"},{"path":"04_策略梯度算法_Reinforce/rl_utils.py","root":"04_策略梯度算法_Reinforce","idx":5,"kind":"方法","name":"ReplayBuffer.size","logic":"返回缓冲区当前样本数。"},{"path":"04_策略梯度算法_Reinforce/rl_utils.py","root":"04_策略梯度算法_Reinforce","idx":6,"kind":"函数","name":"moving_average","logic":"用 np.cumsum 的差分求窗口均值，并单独拼接首尾不足整窗的部分，输出与输入等长的平滑序列。"},{"path":"04_策略梯度算法_Reinforce/rl_utils.py","root":"04_策略梯度算法_Reinforce","idx":7,"kind":"函数","name":"train_off_policy_agent","logic":"按 10 段 tqdm 跑异策略训练，每步写入 replay_buffer，超过 minimal_size 后采样 batch 调 agent.update，返回每回合回报列表（本目录的 REINFORCE 未使用该函数）。"},{"path":"04_策略梯度算法_Reinforce/rl_utils.py","root":"04_策略梯度算法_Reinforce","idx":8,"kind":"函数","name":"compute_advantage","logic":"把 td_delta detach 为 numpy，逆序按 gamma*lmbda 衰减累加得到优势，再反转并转回 torch.float 张量。"},{"path":"04_策略梯度算法_Reinforce/trainer.py","root":"04_策略梯度算法_Reinforce","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 用于统计近 10 回合平均回报，导入 tqdm 显示全局进度条。"},{"path":"04_策略梯度算法_Reinforce/trainer.py","root":"04_策略梯度算法_Reinforce","idx":1,"kind":"函数","name":"train_on_policy_agent","logic":"用单个 tqdm 跑 num_episodes：每回合按 gymnasium 的 5 返回值 API 收集 states/actions/rewards/dones，回合结束后调用一次 agent.update，每 10 回合在 postfix 显示近 10 回合平均回报，返回 return_list。"},{"path":"04_策略梯度算法_Reinforce/visualization.py","root":"04_策略梯度算法_Reinforce","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 matplotlib.pyplot 绘图，并导入 rl_utils 使用滑动平均。"},{"path":"04_策略梯度算法_Reinforce/visualization.py","root":"04_策略梯度算法_Reinforce","idx":1,"kind":"函数","name":"plot_returns","logic":"回合数不少于 9 时用窗口 9 的 moving_average 平滑，否则直接用原始回报；绘制 Episodes-Returns 曲线，标题固定为“REINFORCE on CartPole-v1”，最后 show。"},{"path":"05_Mountain Car/code.py","root":"05_Mountain Car","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"模块 docstring 说明这是 actor-critic pipeline 的兼容入口，唯一依赖是从 main 模块导入 main 函数。"},{"path":"05_Mountain Car/code.py","root":"05_Mountain Car","idx":1,"kind":"入口","name":"if __name__ == '__main__'","logic":"仅当脚本被直接执行时调用 main()，行为与运行 main.py 完全一致。"},{"path":"05_Mountain Car/config.py","root":"05_Mountain Car","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"无 import，仅用模块级常量定义环境名 MountainCarContinuous-v0、NUM_EPISODES=50、折扣 0.95、policy/value 学习率 0.001 与 0.1、RBF 采样 10000 点与 100 个分量、四组 gamma、平滑窗口 10 和随机种子 42，供 main 导入。"},{"path":"05_Mountain Car/environment.py","root":"05_Mountain Car","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy、gymnasium、gymnasium.spaces.Box，以及 typing 的 Any、Optional、Protocol、cast，用于环境创建与静态类型标注。"},{"path":"05_Mountain Car/environment.py","root":"05_Mountain Car","idx":1,"kind":"类","name":"MountainCarEnvironment","logic":"以 Protocol 描述环境接口：声明 observation_space、action_space、spec 三个属性与 reset/step/close 的签名，仅用于类型检查，不提供实现。"},{"path":"05_Mountain Car/environment.py","root":"05_Mountain Car","idx":2,"kind":"方法","name":"MountainCarEnvironment.reset","logic":"声明 reset(*, seed) 返回 (observation, info) 二元组的签名，函数体为省略号占位。"},{"path":"05_Mountain Car/environment.py","root":"05_Mountain Car","idx":3,"kind":"方法","name":"MountainCarEnvironment.step","logic":"声明 step(action) 返回 (observation, reward, terminated, truncated, info) 五元组的签名，函数体为省略号占位。"},{"path":"05_Mountain Car/environment.py","root":"05_Mountain Car","idx":4,"kind":"方法","name":"MountainCarEnvironment.close","logic":"声明 close() 无返回值的签名，函数体为省略号占位。"},{"path":"05_Mountain Car/environment.py","root":"05_Mountain Car","idx":5,"kind":"函数","name":"make_environment","logic":"调用 gym.make(name) 创建环境；若传入 seed，则先 reset(seed=seed) 再设置 action_space 的随机种子，最后 cast 成协议类型返回。"},{"path":"05_Mountain Car/environment.py","root":"05_Mountain Car","idx":6,"kind":"函数","name":"reset_environment","logic":"调用 env.reset() 并丢弃 info，把 observation 转成 float64 ndarray 返回，屏蔽 Gymnasium 版本差异。"},{"path":"05_Mountain Car/environment.py","root":"05_Mountain Car","idx":7,"kind":"函数","name":"step_environment","logic":"调用 env.step(action)，把 observation 转成 float64、reward 转成 float，并原样返回 terminated 与 truncated，便于调用方对截断状态继续 bootstrap。"},{"path":"05_Mountain Car/estimators.py","root":"05_Mountain Car","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"只导入 numpy，用于权重向量与特征向量的线性运算。"},{"path":"05_Mountain Car/estimators.py","root":"05_Mountain Car","idx":1,"kind":"类","name":"ValueEstimator","logic":"用线性函数 V(s)=w·φ(s) 近似状态价值，提供预测与基于 TD 误差的增量更新。"},{"path":"05_Mountain Car/estimators.py","root":"05_Mountain Car","idx":2,"kind":"方法","name":"ValueEstimator.__init__","logic":"按特征维度把所有初始化为 0 的 float64 权重，并保存学习率（默认 0.1）。"},{"path":"05_Mountain Car/estimators.py","root":"05_Mountain Car","idx":3,"kind":"方法","name":"ValueEstimator.predict","logic":"返回权重与输入特征的 np.dot 结果并转成 float，即当前状态价值估计。"},{"path":"05_Mountain Car/estimators.py","root":"05_Mountain Car","idx":4,"kind":"方法","name":"ValueEstimator.update","logic":"计算 TD 误差 target-prediction，按 w += learning_rate * error * features 更新权重，并把该误差返回给调用方。"},{"path":"05_Mountain Car/estimators.py","root":"05_Mountain Car","idx":5,"kind":"类","name":"GaussianPolicy","logic":"连续动作的线性高斯策略：均值与 log 标准差都由特征线性组合得到，采样后裁剪到动作区间，并按策略梯度加熵正则更新。"},{"path":"05_Mountain Car/estimators.py","root":"05_Mountain Car","idx":6,"kind":"方法","name":"GaussianPolicy.__init__","logic":"初始化全零均值权重；standard_deviation 为 None 时 log_std 初值取 0（即 softplus(0)），否则用 log(expm1(σ)) 反解初值；保存学习率、熵系数、动作上下界，并建立 default_rng(seed)。"},{"path":"05_Mountain Car/estimators.py","root":"05_Mountain Car","idx":7,"kind":"方法","name":"GaussianPolicy.mean","logic":"返回均值权重与特征的点积（float），作为高斯分布的均值。"},{"path":"05_Mountain Car/estimators.py","root":"05_Mountain Car","idx":8,"kind":"方法","name":"GaussianPolicy.log_standard_deviation","logic":"返回 log_std 权重与特征的点积（float），即标准差的对数表示。"},{"path":"05_Mountain Car/estimators.py","root":"05_Mountain Car","idx":9,"kind":"方法","name":"GaussianPolicy.standard_deviation","logic":"把 raw 值 clip 到 [-10, 5] 后取 softplus（log1p(exp(raw))）并加 1e-5，得到恒正的标准差，同时避免指数溢出。"},{"path":"05_Mountain Car/estimators.py","root":"05_Mountain Car","idx":10,"kind":"方法","name":"GaussianPolicy.sample","logic":"用 rng.normal(mean, std) 采样一个连续动作，并 np.clip 到 [action_low, action_high] 后返回。"},{"path":"05_Mountain Car/estimators.py","root":"05_Mountain Car","idx":11,"kind":"方法","name":"GaussianPolicy.update","logic":"按高斯 log 概率对均值与 log_std 的梯度乘上 advantage，log_std 方向再加 entropy_coefficient * features；两路更新分别裁剪到 ±0.05 后累加，随后做 nan_to_num 与权重 ±10 / log_std ±5 的裁剪以防止线性策略发散。"},{"path":"05_Mountain Car/features.py","root":"05_Mountain Car","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 sklearn 的 RBFSampler、FeatureUnion、StandardScaler，用于构建归一化加多尺度 RBF 特征。"},{"path":"05_Mountain Car/features.py","root":"05_Mountain Car","idx":1,"kind":"类","name":"RBFStateFeaturizer","logic":"把二维 observation 转换成长度固定为 len(gammas)*components 的随机傅里叶 RBF 特征向量。"},{"path":"05_Mountain Car/features.py","root":"05_Mountain Car","idx":2,"kind":"方法","name":"RBFStateFeaturizer.__init__","logic":"按 observation_space 的上下界均匀采样 samples 个状态点拟合 StandardScaler；再为每个 gamma 建一个 n_components=components 的 RBFSampler，用 FeatureUnion 合并后在标准化样本上 fit。"},{"path":"05_Mountain Car/features.py","root":"05_Mountain Car","idx":3,"kind":"方法","name":"RBFStateFeaturizer.feature_count","logic":"property：对占位状态 [0.0, 0.0] 做一次 transform 并取长度，得到特征维度，供构造 actor/critic 使用。"},{"path":"05_Mountain Car/features.py","root":"05_Mountain Car","idx":4,"kind":"方法","name":"RBFStateFeaturizer.transform","logic":"把单个 state reshape 成 (1, 2) 并转 float64，先 StandardScaler 标准化再经 FeatureUnion 变换，返回第一行一维特征向量。"},{"path":"05_Mountain Car/main.py","root":"05_Mountain Car","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 Path 与 numpy，从 config 取出全部超参数，并导入 environment.make_environment、estimators、features、trainer.train 与 visualization.plot_episode_stats。"},{"path":"05_Mountain Car/main.py","root":"05_Mountain Car","idx":1,"kind":"函数","name":"main","logic":"解析脚本同级的 output 目录并创建；用 config 构造带种子的环境、RBFStateFeaturizer、GaussianPolicy（动作界取自 action_space 的 low/high）与 ValueEstimator，调用 train 得到统计后写出 episode_stats.csv 和 run_config.txt，再以 show=False 绘图，finally 中关闭环境。"},{"path":"05_Mountain Car/main.py","root":"05_Mountain Car","idx":2,"kind":"入口","name":"if __name__ == '__main__'","logic":"直接运行 main.py 时调用 main() 启动训练。"},{"path":"05_Mountain Car/trainer.py","root":"05_Mountain Car","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 dataclass、numpy，以及 environment 的 reset/step 封装与协议类型、estimators 的 GaussianPolicy/ValueEstimator、features 的 RBFStateFeaturizer。"},{"path":"05_Mountain Car/trainer.py","root":"05_Mountain Car","idx":1,"kind":"类","name":"EpisodeStats","logic":"dataclass，保存每个 episode 的总奖励 episode_rewards 与步数 episode_lengths 两个数组，供保存 CSV 与绘图使用。"},{"path":"05_Mountain Car/trainer.py","root":"05_Mountain Car","idx":2,"kind":"函数","name":"train","logic":"外层按 episodes 循环、内层按 spec.max_episode_steps 逐步执行：特征化状态、策略采样、环境 step；terminated 时 target=reward，truncated 时 target=reward+γV(s')，用 advantage 同时更新 critic 与 policy，累计奖励与步数并按 print_interval 打印，最后返回 EpisodeStats。"},{"path":"05_Mountain Car/visualization.py","root":"05_Mountain Car","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy、matplotlib 的 pyplot/Axes/Figure、Path、Optional，以及 trainer.EpisodeStats 作为绘图输入类型。"},{"path":"05_Mountain Car/visualization.py","root":"05_Mountain Car","idx":1,"kind":"函数","name":"plot_episode_stats","logic":"对奖励做长度为 smoothing_window 的滑动平均（序列过短则用原值），画 2x1 子图展示原始与平滑奖励、每 episode 步数并设标题；若给 output_dir 则保存 training_curves.png，show 为假时关闭 figure，返回 (figure, axes)。"},{"path":"06_Mountain Car PyTorch/config.py","root":"06_Mountain Car PyTorch","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"无 import，仅定义常量并用注释解释取值：环境名、200 个 episode、折扣 0.95、actor/critic 学习率 3e-4 与 1e-3、隐藏层 128、熵系数 1e-2、n 步 5、奖励缩放 0.01、种子 42、平滑窗口 10 与打印间隔 10。"},{"path":"06_Mountain Car PyTorch/environment.py","root":"06_Mountain Car PyTorch","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 typing 的 Optional/Tuple、gymnasium 与 numpy。"},{"path":"06_Mountain Car PyTorch/environment.py","root":"06_Mountain Car PyTorch","idx":1,"kind":"函数","name":"make_environment","logic":"调用 gym.make(name) 创建环境；若给定 seed，则 reset(seed=seed) 并设置 action_space 的种子后返回环境对象。"},{"path":"06_Mountain Car PyTorch/environment.py","root":"06_Mountain Car PyTorch","idx":2,"kind":"函数","name":"reset_environment","logic":"调用 environment.reset() 丢弃 info，把 observation 转成 float32 ndarray 返回，与网络输入精度一致。"},{"path":"06_Mountain Car PyTorch/environment.py","root":"06_Mountain Car PyTorch","idx":3,"kind":"函数","name":"step_environment","logic":"调用 environment.step(action)，返回 (float32 observation, float reward, bool terminated, bool truncated)，保留截断标记以便继续 bootstrap。"},{"path":"06_Mountain Car PyTorch/main.py","root":"06_Mountain Car PyTorch","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 Path、random、numpy、torch，从 config 取出全部超参数，并导入 environment、networks 的 Actor/Critic、trainer.train 与 visualization 的绘图函数。"},{"path":"06_Mountain Car PyTorch/main.py","root":"06_Mountain Car PyTorch","idx":1,"kind":"函数","name":"main","logic":"先用 RANDOM_SEED 固定 random、numpy、torch 的随机性；创建环境后由其 observation/action 维度构造 Actor 与 Critic 及两个 Adam 优化器，调用 train 训练；随后创建 output 目录，写出 episode_stats.csv、保存 actor_critic.pt 并绘图，finally 中关闭环境。"},{"path":"06_Mountain Car PyTorch/main.py","root":"06_Mountain Car PyTorch","idx":2,"kind":"入口","name":"if __name__ == '__main__'","logic":"直接运行 main.py 时调用 main() 启动训练。"},{"path":"06_Mountain Car PyTorch/networks.py","root":"06_Mountain Car PyTorch","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 typing.Tuple、torch、torch.nn 与 torch.distributions.Normal。"},{"path":"06_Mountain Car PyTorch/networks.py","root":"06_Mountain Car PyTorch","idx":1,"kind":"类","name":"Actor","logic":"两层 ReLU MLP 输出高斯均值，log_std 为独立可学习参数；采样后直接 clip 到 [-1,1]（而非 tanh），docstring 说明这样能形成 bang-bang 摆动以爬坡。"},{"path":"06_Mountain Car PyTorch/networks.py","root":"06_Mountain Car PyTorch","idx":2,"kind":"方法","name":"Actor.__init__","logic":"构建 state→hidden→hidden 的两层 ReLU Sequential 与输出均值的 Linear(hidden, action_size)，并把 log_std 初始化为 0（std=1）的可学习 Parameter。"},{"path":"06_Mountain Car PyTorch/networks.py","root":"06_Mountain Car PyTorch","idx":3,"kind":"方法","name":"Actor.distribution","logic":"前向得到均值，把 log_std clamp 到 [-5, 1] 后取 exp 得标准差，返回 Normal(mean, std) 分布对象。"},{"path":"06_Mountain Car PyTorch/networks.py","root":"06_Mountain Car PyTorch","idx":4,"kind":"方法","name":"Actor.sample","logic":"对分布 rsample 得动作并 clamp 到 [-1,1]；log_prob 用未裁剪的 raw_action 按最后一维求和，同时返回 entropy 之和，组成 (action, log_prob, entropy)。"},{"path":"06_Mountain Car PyTorch/networks.py","root":"06_Mountain Car PyTorch","idx":5,"kind":"类","name":"Critic","logic":"状态价值网络 V(s)：两层 ReLU 隐藏层后接单输出线性层。"},{"path":"06_Mountain Car PyTorch/networks.py","root":"06_Mountain Car PyTorch","idx":6,"kind":"方法","name":"Critic.__init__","logic":"构建 Linear(state,hidden)→ReLU→Linear(hidden,hidden)→ReLU→Linear(hidden,1) 的 Sequential。"},{"path":"06_Mountain Car PyTorch/networks.py","root":"06_Mountain Car PyTorch","idx":7,"kind":"方法","name":"Critic.forward","logic":"对输入状态做前向并对最后一维 squeeze(-1)，返回形状 (batch,) 的价值估计。"},{"path":"06_Mountain Car PyTorch/trainer.py","root":"06_Mountain Car PyTorch","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 dataclass、Any、numpy、torch、torch.nn，以及 environment 的 reset/step 封装与 networks 的 Actor/Critic；文件头部 docstring 解释为何采用 episode 批量 n 步更新。"},{"path":"06_Mountain Car PyTorch/trainer.py","root":"06_Mountain Car PyTorch","idx":1,"kind":"类","name":"EpisodeStats","logic":"dataclass，记录每个 episode 的 rewards 与 lengths 数组，供保存 CSV 与绘图使用。"},{"path":"06_Mountain Car PyTorch/trainer.py","root":"06_Mountain Car PyTorch","idx":2,"kind":"函数","name":"normalize_state","logic":"用 observation_space 的 low/high 把状态按 2*(s-low)/(high-low)-1 映射到约 [-1,1]，并转成 float32 torch tensor。"},{"path":"06_Mountain Car PyTorch/trainer.py","root":"06_Mountain Car PyTorch","idx":3,"kind":"函数","name":"n_step_targets","logic":"对 episode 内每个时刻 t，向前累加最多 n_step 步的 reward*reward_scale 并按 γ 折扣；若中途 terminated 则提前停止，否则加上最后一步 γ 折扣后的 V(s_last) 作为 bootstrap，返回逐时刻目标 tensor。"},{"path":"06_Mountain Car PyTorch/trainer.py","root":"06_Mountain Car PyTorch","idx":4,"kind":"函数","name":"train","logic":"每个 episode 在 no_grad 下用 actor 采样动作并收集 state/action/reward/terminated/next_state；结束后算 next_values 与 n 步 targets，以 MSE 更新 critic、以 -(log_prob*advantage) 减熵项更新 actor（两者都做 1.0 梯度裁剪），按 print_interval 打印并返回 EpisodeStats。"},{"path":"06_Mountain Car PyTorch/visualization.py","root":"06_Mountain Car PyTorch","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 Path、Optional、matplotlib.pyplot、numpy 与 trainer.EpisodeStats。"},{"path":"06_Mountain Car PyTorch/visualization.py","root":"06_Mountain Car PyTorch","idx":1,"kind":"函数","name":"plot_episode_stats","logic":"序列足够长时对奖励做滑动平均并计算偏移量，否则用原值；画 2x1 子图展示原始/平滑奖励与步数，设标题；若给 output_dir 则保存 training_curves.png，最后关闭 figure。"},{"path":"07_TRPO/CartPole/agents.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 copy、numpy、torch、torch.nn.functional，以及本地 rl_utils 和 networks 中的 PolicyNet、ValueNet；无模块级常量。"},{"path":"07_TRPO/CartPole/agents.py","root":"07_TRPO","idx":1,"kind":"类","name":"TRPO","logic":"封装 CartPole 上的 TRPO：actor 输出离散动作概率，critic 回归 TD 目标，策略更新通过自然梯度方向加 KL 信赖域约束完成。"},{"path":"07_TRPO/CartPole/agents.py","root":"07_TRPO","idx":2,"kind":"方法","name":"TRPO.__init__","logic":"按 state_dim、hidden_dim、action_dim 构建 PolicyNet 与 ValueNet，只为 critic 建 Adam 优化器（actor 由 TRPO 直接改参数），保存 gamma、lmbda、kl_constraint、alpha 与 device。"},{"path":"07_TRPO/CartPole/agents.py","root":"07_TRPO","idx":3,"kind":"方法","name":"TRPO.take_action","logic":"把单条 state 转成 [1, state_dim] 的 float32 张量，经 actor 得动作概率并构造 Categorical 分布，采样后返回 Python int 动作。"},{"path":"07_TRPO/CartPole/agents.py","root":"07_TRPO","idx":4,"kind":"方法","name":"TRPO.hessian_matrix_vector_product","logic":"以旧分布与当前策略的平均 KL 为标量，create_graph=True 对 actor 参数求一阶导，拼接后与 vector 点积再求导，返回 detach 后的 H·v。"},{"path":"07_TRPO/CartPole/agents.py","root":"07_TRPO","idx":5,"kind":"方法","name":"TRPO.conjugate_gradient","logic":"用最多 10 次共轭梯度迭代求解 H^{-1}g，每步调用 Hessian-向量积，残差平方和小于 1e-10 时提前退出，返回近似自然梯度方向 x。"},{"path":"07_TRPO/CartPole/agents.py","root":"07_TRPO","idx":6,"kind":"方法","name":"TRPO._log_probs","logic":"静态方法：用给定 actor 构造 Categorical 分布，对 actions.squeeze(-1) 取 log_prob 并 unsqueeze(-1) 成列向量。"},{"path":"07_TRPO/CartPole/agents.py","root":"07_TRPO","idx":7,"kind":"方法","name":"TRPO.compute_surrogate_obj","logic":"用新 actor 的对数概率减去 old_log_probs 取 exp 得 ratio，返回 mean(ratio * advantage) 作为 surrogate 目标。"},{"path":"07_TRPO/CartPole/agents.py","root":"07_TRPO","idx":8,"kind":"方法","name":"TRPO.line_search","logic":"把 actor 参数展平为向量，按 alpha^i（i=0..14）沿 max_vector 搜索候选参数；每个候选 deepcopy actor 后写入参数，若 surrogate 提升且平均 KL 小于 kl_constraint 则返回该参数，否则最终回退旧参数。"},{"path":"07_TRPO/CartPole/agents.py","root":"07_TRPO","idx":9,"kind":"方法","name":"TRPO.policy_learn","logic":"对 surrogate 目标求 actor 梯度并拼接为一维，经共轭梯度得下降方向，用 H·d 计算缩放 sqrt(2*kl/(d^T H d))，线搜索后把新参数 vector_to_parameters 写回 actor。"},{"path":"07_TRPO/CartPole/agents.py","root":"07_TRPO","idx":10,"kind":"方法","name":"TRPO.update","logic":"把 transition_dict 的五个字段转成张量，计算 td_target 与 td_delta，调用 rl_utils.compute_advantage 得 GAE 优势；记录 old_log_probs 与旧 Categorical 分布，先用 MSE 更新 critic，再调用 policy_learn 更新策略。"},{"path":"07_TRPO/CartPole/config.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch，并定义 NUM_EPISODES=500、HIDDEN_DIM=128、GAMMA=0.98、LMBDA=0.95、CRITIC_LR=1e-2、KL_CONSTRAINT=0.0005、ALPHA=0.5、SEED=0、ENV_NAME='CartPole-v1'，按 CUDA 可用性选择 DEVICE。"},{"path":"07_TRPO/CartPole/environment.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 gymnasium（前两行为空行），无模块级常量。"},{"path":"07_TRPO/CartPole/environment.py","root":"07_TRPO","idx":1,"kind":"函数","name":"make_environment","logic":"调用 gym.make(env_name)，若 action_space 没有 n 属性则抛 TypeError；随后从 observation_space.shape[0] 与 action_space.n 取维度，返回 (env, state_dim, action_dim)。"},{"path":"07_TRPO/CartPole/main.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 random、numpy、torch，以及本地 config、TRPO、make_environment、train_on_policy_agent、plot_training_results；无模块级常量。"},{"path":"07_TRPO/CartPole/main.py","root":"07_TRPO","idx":1,"kind":"函数","name":"set_seed","logic":"依次调用 random.seed、np.random.seed、torch.manual_seed，用同一 seed 固定三处随机源。"},{"path":"07_TRPO/CartPole/main.py","root":"07_TRPO","idx":2,"kind":"函数","name":"main","logic":"先设随机种子，用 make_environment 取 env 与状态/动作维度，按 config 超参构造 TRPO，调用 train_on_policy_agent 训练 NUM_EPISODES 局，绘图后 env.close()。"},{"path":"07_TRPO/CartPole/main.py","root":"07_TRPO","idx":3,"kind":"入口","name":"if __name__ == '__main__'","logic":"脚本直接运行时调用 main() 启动训练。"},{"path":"07_TRPO/CartPole/networks.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch 与 torch.nn.functional，无模块级常量。"},{"path":"07_TRPO/CartPole/networks.py","root":"07_TRPO","idx":1,"kind":"类","name":"PolicyNet","logic":"两层全连接网络，输入状态，输出每个离散动作的 softmax 概率。"},{"path":"07_TRPO/CartPole/networks.py","root":"07_TRPO","idx":2,"kind":"方法","name":"PolicyNet.__init__","logic":"建立 fc1(state_dim→hidden_dim) 与 fc2(hidden_dim→action_dim) 两个线性层。"},{"path":"07_TRPO/CartPole/networks.py","root":"07_TRPO","idx":3,"kind":"方法","name":"PolicyNet.forward","logic":"先对 fc1 输出做 ReLU，再经 fc2 并在 dim=1 上 softmax，返回动作概率分布。"},{"path":"07_TRPO/CartPole/networks.py","root":"07_TRPO","idx":4,"kind":"类","name":"ValueNet","logic":"状态价值网络，输入状态，输出标量 V(s)。"},{"path":"07_TRPO/CartPole/networks.py","root":"07_TRPO","idx":5,"kind":"方法","name":"ValueNet.__init__","logic":"建立 fc1(state_dim→hidden_dim) 与 fc2(hidden_dim→1) 两个线性层。"},{"path":"07_TRPO/CartPole/networks.py","root":"07_TRPO","idx":6,"kind":"方法","name":"ValueNet.forward","logic":"对 fc1 输出做 ReLU 后过 fc2，返回形状 [batch, 1] 的状态价值。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch、numpy、gymnasium、matplotlib.pyplot、F、rl_utils 与 copy；无模块级常量。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":1,"kind":"类","name":"PolicyNet","logic":"与 networks.py 相同的离散策略网络，输出各动作概率。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":2,"kind":"方法","name":"PolicyNet.__init__","logic":"建立 fc1(state_dim→hidden_dim) 与 fc2(hidden_dim→action_dim)。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":3,"kind":"方法","name":"PolicyNet.forward","logic":"fc1 后接 ReLU，再过 fc2 并在 dim=1 上 softmax 返回概率。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":4,"kind":"类","name":"ValueNet","logic":"状态价值网络，输出标量状态价值。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":5,"kind":"方法","name":"ValueNet.__init__","logic":"建立 fc1(state_dim→hidden_dim) 与 fc2(hidden_dim→1)。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":6,"kind":"方法","name":"ValueNet.forward","logic":"fc1 后接 ReLU，再经 fc2 输出 [batch, 1] 价值。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":7,"kind":"类","name":"TRPO","logic":"练习版 TRPO agent，直接接收 gym 的 state_space/action_space 对象，流程与模块版一致（surrogate、HVP、CG、线搜索）。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":8,"kind":"方法","name":"TRPO.__init__","logic":"从 state_space.shape[0] 与 action_space.n 取维度，构建 actor/critic 及 critic 的 Adam 优化器，保存 gamma、lmbda、kl_constraint、alpha、device。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":9,"kind":"方法","name":"TRPO.take_action","logic":"把 state 包成 [1, state_dim] 的 float 张量，经 actor 得概率并构造 Categorical 分布，采样后返回 item。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":10,"kind":"方法","name":"TRPO.hessian_matrix_vector_product","logic":"计算新旧 Categorical 分布的平均 KL，create_graph 求一阶导后与 vector 点积，再次求导并拼接，返回 H·v（未做 damping）。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":11,"kind":"方法","name":"TRPO.conjugate_gradient","logic":"最多 10 次共轭梯度迭代求解 H^{-1}g，残差平方和小于 1e-10 时 break，返回解向量。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":12,"kind":"方法","name":"TRPO.compute_surrogate_obj","logic":"用 actor(states).gather(1, actions) 取所选动作对数概率，计算 ratio = exp(logp - old_logp)，返回 mean(ratio * advantage)。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":13,"kind":"方法","name":"TRPO.line_search","logic":"把参数展平，按 alpha^i 尝试 15 个候选参数，deepcopy actor 并写入候选参数，比较 surrogate 与平均 KL，返回首个满足提升且 KL 小于约束的参数，否则返回原参数。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":14,"kind":"方法","name":"TRPO.policy_learn","logic":"对 surrogate 求 actor 梯度并拼接，用共轭梯度得方向，按 sqrt(2*kl/(d^T H d)) 缩放后线搜索，最后 vector_to_parameters 写回 actor。"},{"path":"07_TRPO/CartPole/practice.py","root":"07_TRPO","idx":15,"kind":"方法","name":"TRPO.update","logic":"张量化 transition 的五个字段，计算 td_target、td_delta 并用 rl_utils.compute_advantage（先转 CPU）得 GAE 优势；取 old_log_probs 与旧分布后，用 MSE 更新 critic，再调用 policy_learn。"},{"path":"07_TRPO/CartPole/rl_utils.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 torch，无模块级常量。"},{"path":"07_TRPO/CartPole/rl_utils.py","root":"07_TRPO","idx":1,"kind":"函数","name":"moving_average","logic":"把输入转成 float32 数组，长度小于 window_size 时原样返回；否则用 cumsum 计算中间段窗口均值，两端用半径 1,3,5... 的前缀/后缀累积均值补齐，最后 concatenate。"},{"path":"07_TRPO/CartPole/rl_utils.py","root":"07_TRPO","idx":2,"kind":"函数","name":"compute_advantage","logic":"将 td_delta 转为一维 numpy，从后向前递推 advantage = gamma*lmbda*advantage + delta，反转序列后返回 float32 的 torch 张量。"},{"path":"07_TRPO/CartPole/trainer.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 tqdm 进度条，无模块级常量。"},{"path":"07_TRPO/CartPole/trainer.py","root":"07_TRPO","idx":1,"kind":"函数","name":"train_on_policy_agent","logic":"用 tqdm 循环 num_episodes 局：每局 reset 后反复调用 agent.take_action 与 env.step，直到 terminated 或 truncated，沿途收集 states/actions/next_states/rewards/dones；整局结束后调用一次 agent.update 并记录回报，每 10 局打印最近 10 局均值，最终返回 return_list。"},{"path":"07_TRPO/CartPole/visualization.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 matplotlib.pyplot 与本地 rl_utils.moving_average，无模块级常量。"},{"path":"07_TRPO/CartPole/visualization.py","root":"07_TRPO","idx":1,"kind":"函数","name":"plot_training_results","logic":"创建 1x2 子图：左图绘制每局原始回报；右图在样本数不少于 9 时用 moving_average(window=9) 平滑、否则用原始值，设置坐标轴标题后 tight_layout 并 plt.show()。"},{"path":"07_TRPO/Pendulum/agents.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 copy、numpy、torch、torch.nn.functional，以及本地 rl_utils 与 networks 中的 PolicyNetContinuous、ValueNet；无模块级常量。"},{"path":"07_TRPO/Pendulum/agents.py","root":"07_TRPO","idx":1,"kind":"类","name":"TRPOContinuous","logic":"面向 Pendulum 的连续动作 TRPO：策略为 Normal 分布，KL 按动作维求和，Hessian-向量积带阻尼，配合共轭梯度、信赖域缩放与线搜索更新策略。"},{"path":"07_TRPO/Pendulum/agents.py","root":"07_TRPO","idx":2,"kind":"方法","name":"TRPOContinuous.__init__","logic":"构建 PolicyNetContinuous（传入动作上下界）与 ValueNet，把 action_low/action_high 存为张量，为 critic 建 Adam 优化器，保存 gamma、lmbda、kl_constraint、alpha、reward_shift、reward_scale 与 device。"},{"path":"07_TRPO/Pendulum/agents.py","root":"07_TRPO","idx":3,"kind":"方法","name":"TRPOContinuous._distribution","logic":"调用 actor 得到均值与标准差，返回 torch.distributions.Normal 分布对象。"},{"path":"07_TRPO/Pendulum/agents.py","root":"07_TRPO","idx":4,"kind":"方法","name":"TRPOContinuous.take_action","logic":"把 state 转为 [1, state_dim] 张量，从 Normal 分布采样，再用 clamp 裁剪到 [action_low, action_high]，返回去掉 batch 维的 numpy 动作。"},{"path":"07_TRPO/Pendulum/agents.py","root":"07_TRPO","idx":5,"kind":"方法","name":"TRPOContinuous.hessian_matrix_vector_product","logic":"计算新旧 Normal 分布 KL（动作维求和后取均值），create_graph 求一阶导并与 vector 点积后再求导，返回 H·v 加上阻尼项 damping*vector（默认 0.1）。"},{"path":"07_TRPO/Pendulum/agents.py","root":"07_TRPO","idx":6,"kind":"方法","name":"TRPOContinuous.conjugate_gradient","logic":"最多 10 次共轭梯度迭代求解 H^{-1}g，每步调用带阻尼的 Hessian-向量积，残差平方和小于 1e-10 时提前退出并返回解向量。"},{"path":"07_TRPO/Pendulum/agents.py","root":"07_TRPO","idx":7,"kind":"方法","name":"TRPOContinuous._log_probs","logic":"静态方法：用 actor 输出的 mean/std 构造 Normal，对 actions 求 log_prob 并在动作维求和，返回列向量对数概率。"},{"path":"07_TRPO/Pendulum/agents.py","root":"07_TRPO","idx":8,"kind":"方法","name":"TRPOContinuous.compute_surrogate_obj","logic":"由新旧对数概率之差取 exp 得 ratio，返回 mean(ratio * advantage) 作为 surrogate 目标。"},{"path":"07_TRPO/Pendulum/agents.py","root":"07_TRPO","idx":9,"kind":"方法","name":"TRPOContinuous.line_search","logic":"沿 max_vector 按 alpha^i（i=0..14）生成候选参数，deepcopy actor 后写入并计算 KL（动作维求和取均值）与 surrogate，返回首个同时满足目标提升和 KL 小于约束的参数，否则回退旧参数。"},{"path":"07_TRPO/Pendulum/agents.py","root":"07_TRPO","idx":10,"kind":"方法","name":"TRPOContinuous.policy_learn","logic":"对 surrogate 求 actor 梯度并拼接为一维，经共轭梯度得下降方向，用 clamp 后的曲率 d^T H d 计算缩放 sqrt(2*kl/curvature)，线搜索后用 vector_to_parameters 写回 actor。"},{"path":"07_TRPO/Pendulum/agents.py","root":"07_TRPO","idx":11,"kind":"方法","name":"TRPOContinuous.update","logic":"把 transition_dict 转成张量（动作为 float），先用 (reward+reward_shift)/reward_scale 缩放奖励，再算 td_target、td_delta 与 GAE 优势；记录 old_log_probs 和 detach 后的旧 Normal 分布，以 MSE 更新 critic，最后调用 policy_learn 更新策略。"},{"path":"07_TRPO/Pendulum/config.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch，定义 NUM_EPISODES=2000、HIDDEN_DIM=128、GAMMA=0.9、LMBDA=0.9、CRITIC_LR=1e-2、KL_CONSTRAINT=0.00005、ALPHA=0.5、REWARD_SHIFT=8.0、REWARD_SCALE=8.0、SEED=0、ENV_NAME='Pendulum-v1'，并按 CUDA 可用性选择 DEVICE。"},{"path":"07_TRPO/Pendulum/environment.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 gymnasium as gym，无模块级常量。"},{"path":"07_TRPO/Pendulum/environment.py","root":"07_TRPO","idx":1,"kind":"函数","name":"make_environment","logic":"调用 gym.make(env_name)，检查 action_space 是否有非 None 的 shape，不满足则抛 TypeError；随后读取状态维、动作维，并返回 (env, state_dim, action_dim, action_space.low.copy(), action_space.high.copy())。"},{"path":"07_TRPO/Pendulum/main.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 random、numpy、torch，以及本地 config、TRPOContinuous、make_environment、train_on_policy_agent、plot_training_results；无模块级常量。"},{"path":"07_TRPO/Pendulum/main.py","root":"07_TRPO","idx":1,"kind":"函数","name":"set_seed","logic":"依次设置 random、numpy 与 torch 的随机种子以固定实验随机性。"},{"path":"07_TRPO/Pendulum/main.py","root":"07_TRPO","idx":2,"kind":"函数","name":"main","logic":"设种子后解包 make_environment 返回的 5 个值，按 config 超参（含动作边界、reward_shift/scale）构造 TRPOContinuous，训练 NUM_EPISODES 局，绘图并 env.close()。"},{"path":"07_TRPO/Pendulum/main.py","root":"07_TRPO","idx":3,"kind":"入口","name":"if __name__ == '__main__'","logic":"脚本直接运行时调用 main() 启动训练。"},{"path":"07_TRPO/Pendulum/networks.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch 与 torch.nn.functional，无模块级常量。"},{"path":"07_TRPO/Pendulum/networks.py","root":"07_TRPO","idx":1,"kind":"类","name":"PolicyNetContinuous","logic":"连续动作策略网络，输出动作高斯分布的均值与标准差，均值经 tanh 映射到动作区间。"},{"path":"07_TRPO/Pendulum/networks.py","root":"07_TRPO","idx":2,"kind":"方法","name":"PolicyNetContinuous.__init__","logic":"建立 fc1、fc_mu、fc_std 三个线性层，并把动作上下界转成张量后以 register_buffer 保存 action_scale=(high-low)/2 与 action_bias=(high+low)/2。"},{"path":"07_TRPO/Pendulum/networks.py","root":"07_TRPO","idx":3,"kind":"方法","name":"PolicyNetContinuous.forward","logic":"fc1 后接 ReLU，分两路输出：mu = bias + scale*tanh(fc_mu)，std = softplus(fc_std)+1e-5，返回 (mu, std)。"},{"path":"07_TRPO/Pendulum/networks.py","root":"07_TRPO","idx":4,"kind":"类","name":"ValueNet","logic":"状态价值网络，输入状态输出标量 V(s)。"},{"path":"07_TRPO/Pendulum/networks.py","root":"07_TRPO","idx":5,"kind":"方法","name":"ValueNet.__init__","logic":"建立 fc1(state_dim→hidden_dim) 与 fc2(hidden_dim→1)。"},{"path":"07_TRPO/Pendulum/networks.py","root":"07_TRPO","idx":6,"kind":"方法","name":"ValueNet.forward","logic":"将输入经 fc1、ReLU、fc2 后返回 [batch, 1] 状态价值。"},{"path":"07_TRPO/Pendulum/rl_utils.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 torch，无模块级常量。"},{"path":"07_TRPO/Pendulum/rl_utils.py","root":"07_TRPO","idx":1,"kind":"函数","name":"moving_average","logic":"把输入转成 float32 数组，长度不足窗口时原样返回；否则用 cumsum 计算中间段窗口均值，两端按半径 1,3,5... 的前后缀累积均值补齐并拼接返回。"},{"path":"07_TRPO/Pendulum/rl_utils.py","root":"07_TRPO","idx":2,"kind":"函数","name":"compute_advantage","logic":"将 td_delta 转一维 numpy 后从后向前递推 advantage = gamma*lmbda*advantage + delta，反转并转成 float32 torch 张量返回。"},{"path":"07_TRPO/Pendulum/trainer.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 tqdm 进度条，无模块级常量。"},{"path":"07_TRPO/Pendulum/trainer.py","root":"07_TRPO","idx":1,"kind":"函数","name":"train_on_policy_agent","logic":"用 tqdm 循环 num_episodes 局，每局 reset 后循环执行 agent.take_action 与 env.step 直到 done，积累回报并收集五类 transition 字段；每局结束调用一次 agent.update，每 10 局打印最近 10 局平均回报，最终返回 return_list。"},{"path":"07_TRPO/Pendulum/visualization.py","root":"07_TRPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 matplotlib.pyplot 与本地 rl_utils.moving_average，无模块级常量。"},{"path":"07_TRPO/Pendulum/visualization.py","root":"07_TRPO","idx":1,"kind":"函数","name":"plot_training_results","logic":"创建 1x2 子图，左图画每局原始回报，右图画 moving_average(return_list, 9) 平滑曲线，设置坐标轴标题后 tight_layout 并 plt.show()。"},{"path":"08_PPO/CartPole/agents.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy、torch、torch.nn.functional，以及本地 rl_utils 和 networks 中的 PolicyNet、ValueNet；本文件没有模块级常量。"},{"path":"08_PPO/CartPole/agents.py","root":"08_PPO","idx":1,"kind":"类","name":"PPO","logic":"离散动作 PPO 智能体，持有 actor（策略网络）、critic（价值网络）及各自的 Adam 优化器，并用 gamma、lmbda、epochs、eps 控制折扣、GAE 与裁剪更新。"},{"path":"08_PPO/CartPole/agents.py","root":"08_PPO","idx":2,"kind":"方法","name":"PPO.__init__","logic":"按 state_dim/hidden_dim/action_dim 构造 PolicyNet 与 ValueNet 并搬到 device，分别为两者建立 Adam 优化器，同时保存 gamma、lmbda、epochs、eps 与 device。"},{"path":"08_PPO/CartPole/agents.py","root":"08_PPO","idx":3,"kind":"方法","name":"PPO.take_action","logic":"把单个 state 转为 float32 张量并 unsqueeze 成 [1, state_dim]，送入 actor 得到动作概率，用 torch.distributions.Categorical 采样并返回 .item() 的整数动作。"},{"path":"08_PPO/CartPole/agents.py","root":"08_PPO","idx":4,"kind":"方法","name":"PPO._log_probs","logic":"静态方法：用 actor 输出构造 Categorical，把形状 [B, 1] 的 actions squeeze 成 [B] 调用 log_prob，再 unsqueeze(-1) 还原为 [B, 1] 以对齐 advantage 与 ratio。"},{"path":"08_PPO/CartPole/agents.py","root":"08_PPO","idx":5,"kind":"方法","name":"PPO.update","logic":"将 transition_dict 的 states/actions/rewards/next_states/dones 转为张量，按 r + gamma*V(s')*(1-done) 算 td_target 与 td_delta，用 rl_utils.compute_advantage 得 GAE 并 unsqueeze 成 [T,1]；记录 detach 的 old_log_probs 后循环 epochs 次，计算 ratio 与 clamp 后的保守目标得到 actor_loss，critic 用 MSE 拟合 td_target，两者分别反向传播并 step。"},{"path":"08_PPO/CartPole/config.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch，定义 actor/critic 学习率（1e-3、1e-2）、NUM_EPISODES=500、HIDDEN_DIM=128、GAMMA=0.98、LMBDA=0.95、EPOCHS=10、EPS=0.2、SEED=0、ENV_NAME='CartPole-v1'，并按 CUDA 可用性设置 DEVICE。"},{"path":"08_PPO/CartPole/environment.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"仅导入 gymnasium 的 gym 模块，无模块级常量。"},{"path":"08_PPO/CartPole/environment.py","root":"08_PPO","idx":1,"kind":"函数","name":"make_environment","logic":"用 gym.make(env_name) 创建环境，若 action_space 没有 n 属性则抛 TypeError 提示需要离散动作空间；随后从 observation_space 与 action_space 取出 state_dim、action_dim 并连同 env 一起返回。"},{"path":"08_PPO/CartPole/main.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 random、numpy、torch，以及本地 config、PPO、make_environment、train_on_policy_agent、plot_training_results；无模块级常量。"},{"path":"08_PPO/CartPole/main.py","root":"08_PPO","idx":1,"kind":"函数","name":"set_seed","logic":"依次调用 random.seed、np.random.seed、torch.manual_seed 设置同一随机种子，保证实验可复现。"},{"path":"08_PPO/CartPole/main.py","root":"08_PPO","idx":2,"kind":"函数","name":"main","logic":"设种子后调用 make_environment 得到 env 与维度，env.reset(seed=...) 固定初始状态；用 config 中的超参数构造 PPO，调用 train_on_policy_agent 训练 NUM_EPISODES 个 episode，最后绘制回报曲线并 env.close()。"},{"path":"08_PPO/CartPole/main.py","root":"08_PPO","idx":3,"kind":"入口","name":"if __name__ == '__main__'","logic":"脚本直接运行时调用 main() 启动 CartPole 的 PPO 训练。"},{"path":"08_PPO/CartPole/networks.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch 与 torch.nn.functional，无模块级常量。"},{"path":"08_PPO/CartPole/networks.py","root":"08_PPO","idx":1,"kind":"类","name":"PolicyNet","logic":"两层全连接策略网络，输入状态、输出每个离散动作的概率分布。"},{"path":"08_PPO/CartPole/networks.py","root":"08_PPO","idx":2,"kind":"方法","name":"PolicyNet.__init__","logic":"建立 state_dim→hidden_dim 的 fc1 与 hidden_dim→action_dim 的 fc2 两个线性层。"},{"path":"08_PPO/CartPole/networks.py","root":"08_PPO","idx":3,"kind":"方法","name":"PolicyNet.forward","logic":"对 fc1 输出做 ReLU 再过 fc2，最后在 dim=1 上 softmax，使每行成为合法动作概率分布，形状 [B, action_dim]。"},{"path":"08_PPO/CartPole/networks.py","root":"08_PPO","idx":4,"kind":"类","name":"ValueNet","logic":"状态价值网络，输入状态输出标量 V(s)，不依赖具体动作。"},{"path":"08_PPO/CartPole/networks.py","root":"08_PPO","idx":5,"kind":"方法","name":"ValueNet.__init__","logic":"建立 state_dim→hidden_dim 的 fc1 与 hidden_dim→1 的 fc2。"},{"path":"08_PPO/CartPole/networks.py","root":"08_PPO","idx":6,"kind":"方法","name":"ValueNet.forward","logic":"fc1 后接 ReLU 再经 fc2，输出形状 [B, 1] 的状态价值估计。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入旧版 gym、torch、F、numpy、matplotlib.pyplot 与 rl_utils；本文件不使用 config 模块，超参数散落在模块级脚本中。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":1,"kind":"类","name":"PolicyNet","logic":"教程版离散策略网络，两层线性层加 ReLU、softmax 输出动作概率。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":2,"kind":"方法","name":"PolicyNet.__init__","logic":"调用 super 初始化 Module，建立 fc1（state_dim→hidden_dim）与 fc2（hidden_dim→action_dim）。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":3,"kind":"方法","name":"PolicyNet.forward","logic":"先 ReLU(fc1(x))，再对 fc2 输出在 dim=1 做 softmax 得到动作概率。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":4,"kind":"类","name":"ValueNet","logic":"教程版状态价值网络，输出 V(s)。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":5,"kind":"方法","name":"ValueNet.__init__","logic":"建立 fc1（state_dim→hidden_dim）与 fc2（hidden_dim→1）。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":6,"kind":"方法","name":"ValueNet.forward","logic":"ReLU(fc1(x)) 后过 fc2，返回形状 [B, 1] 的价值。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":7,"kind":"类","name":"PPO","logic":"教程版离散动作 PPO，采用截断（clip）方式，持有 actor/critic 与两个 Adam 优化器。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":8,"kind":"方法","name":"PPO.__init__","logic":"创建 PolicyNet 与 ValueNet 并搬到 device，分别建立 Adam 优化器，保存 gamma、lmbda、epochs、eps、device 等超参数。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":9,"kind":"方法","name":"PPO.take_action","logic":"用 torch.tensor([state]) 构造 batch 输入 actor 得到概率，Categorical 采样后返回 action.item()。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":10,"kind":"方法","name":"PPO.update","logic":"把 transition_dict 转张量，计算 td_target= r+gamma*V(s')*(1-done) 与 td_delta，经 rl_utils.compute_advantage 得优势；用 log(actor(states).gather(1, actions)) 得到 old_log_probs，循环 epochs 次以 ratio、clamp 截断构造 surrogate 并取 min 作为 actor 损失，critic 用 MSE 拟合 td_target，分别反向传播更新。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":11,"kind":"导入与常量","name":"模块级 CartPole 训练脚本","logic":"在模块顶层直接定义 CartPole 超参数（actor_lr=1e-3、critic_lr=1e-2、epochs=10、eps=0.2 等），用 gym.make('CartPole-v0') 建环境并设种子，构造 PPO 后调用 rl_utils.train_on_policy_agent 训练 500 个 episode，随后绘制原始回报与 moving_average(9) 两条曲线。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":12,"kind":"类","name":"PolicyNetContinuous","logic":"连续动作策略网络，输出正态分布的均值与标准差。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":13,"kind":"方法","name":"PolicyNetContinuous.__init__","logic":"建立共享特征层 fc1，以及分别输出均值的 fc_mu 和输出标准差的 fc_std（均为 hidden_dim→action_dim）。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":14,"kind":"方法","name":"PolicyNetContinuous.forward","logic":"ReLU 过 fc1 后，mu 用 2.0*tanh(fc_mu(x)) 限制在 [-2, 2]，std 用 softplus(fc_std(x)) 保证为正，返回 (mu, std)。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":15,"kind":"类","name":"PPOContinuous","logic":"教程版连续动作 PPO，actor 输出 Normal 分布，并对 Pendulum 奖励做平移缩放。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":16,"kind":"方法","name":"PPOContinuous.__init__","logic":"构造 PolicyNetContinuous 与 ValueNet 并搬到 device，分别建立 Adam 优化器，保存 gamma、lmbda、epochs、eps、device。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":17,"kind":"方法","name":"PPOContinuous.take_action","logic":"把 state 包成 [1, state_dim] 张量送入 actor 得 mu、sigma，构造 Normal 分布采样动作，并返回单元素列表 [action.item()]。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":18,"kind":"方法","name":"PPOContinuous.update","logic":"转换 states/actions/rewards/next_states/dones 为张量，先做 rewards=(rewards+8.0)/8.0 的奖励缩放，再算 td_target 与 td_delta 并经 rl_utils.compute_advantage 得优势；以 Normal(mu.detach(), std.detach()) 的 log_prob 作为 old_log_probs，循环 epochs 次计算 ratio 与截断 surrogate 得 actor 损失、critic MSE 损失，并分别反向传播更新。"},{"path":"08_PPO/CartPole/practice.py","root":"08_PPO","idx":19,"kind":"导入与常量","name":"模块级 Pendulum 训练脚本","logic":"在模块顶层定义连续控制超参数（actor_lr=1e-4、critic_lr=5e-3、gamma=0.9、num_episodes=2000 等），用 gym.make('Pendulum-v0') 建环境并按 action_space.shape 取 action_dim，构造 PPOContinuous 训练后绘制原始回报与 moving_average(21) 平滑曲线。"},{"path":"08_PPO/CartPole/rl_utils.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 torch，无模块级常量。"},{"path":"08_PPO/CartPole/rl_utils.py","root":"08_PPO","idx":1,"kind":"函数","name":"moving_average","logic":"把输入转成 float32 数组；长度小于 window_size 时原样返回，否则用 cumsum 差分求中段窗口均值，并分别用 radius 处理首尾不足一个窗口的部分，最后 concatenate 成长度与原序列对齐的平滑序列。"},{"path":"08_PPO/CartPole/rl_utils.py","root":"08_PPO","idx":2,"kind":"函数","name":"compute_advantage","logic":"把 td_delta 转 numpy 一维数组，从最后一步向前按 A[t]=td_delta[t]+gamma*lmbda*A[t+1] 递推，逆序后转成 float32 的 torch 张量返回形状 [T] 的优势。"},{"path":"08_PPO/CartPole/trainer.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 tqdm 进度条，无模块级常量。"},{"path":"08_PPO/CartPole/trainer.py","root":"08_PPO","idx":1,"kind":"函数","name":"train_on_policy_agent","logic":"外层循环 num_episodes 个 episode，先 env.reset() 取 state，内层 while 直到 terminated 或 truncated：agent.take_action 采样、env.step 得五元组、把 (s,a,r,s',done) 累积到 transition_dict；episode 结束后调用 agent.update，记录该 episode 总回报，每 10 个 episode 用 tqdm 显示最近 10 次平均回报，最终返回 return_list。"},{"path":"08_PPO/CartPole/visualization.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 matplotlib.pyplot 与 rl_utils.moving_average，无模块级常量。"},{"path":"08_PPO/CartPole/visualization.py","root":"08_PPO","idx":1,"kind":"函数","name":"plot_training_results","logic":"创建 10x4 画布的 1x2 子图：左图绘制逐 episode 原始回报，右图绘制 moving_average(return_list, 9) 的平滑回报，均标注 Episodes/Returns 与标题，tight_layout 后 plt.show() 显示。"},{"path":"08_PPO/Pendulum/agents.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy、torch、torch.nn.functional，以及本地 rl_utils 和 networks 中的 PolicyNetContinuous、ValueNet；无模块级常量。"},{"path":"08_PPO/Pendulum/agents.py","root":"08_PPO","idx":1,"kind":"类","name":"PPOContinuous","logic":"连续动作 PPO 智能体，actor 输出 Normal 分布参数，critic 估计 V(s)，共享 PPO-Clip 目标与 GAE，并保存动作上下界与奖励平移缩放系数。"},{"path":"08_PPO/Pendulum/agents.py","root":"08_PPO","idx":2,"kind":"方法","name":"PPOContinuous.__init__","logic":"用 action_low/action_high 构造 PolicyNetContinuous 与 ValueNet 并搬到 device，建立两个 Adam 优化器，把动作上下界存为 device 上的 float32 张量，并保存 gamma、lmbda、epochs、eps、reward_shift、reward_scale。"},{"path":"08_PPO/Pendulum/agents.py","root":"08_PPO","idx":3,"kind":"方法","name":"PPOContinuous._distribution","logic":"静态方法：调用 actor(states) 得到 mean 与 std，返回 torch.distributions.Normal(mean, std)，两者形状均为 [B, action_dim]。"},{"path":"08_PPO/Pendulum/agents.py","root":"08_PPO","idx":4,"kind":"方法","name":"PPOContinuous.take_action","logic":"把单个 state 转成 [1, state_dim] 张量，用 _distribution 构造 Normal 后采样动作，squeeze 并 detach 后返回 numpy 数组；刻意不 clamp，以保持采样动作与 log_prob 一致。"},{"path":"08_PPO/Pendulum/agents.py","root":"08_PPO","idx":5,"kind":"方法","name":"PPOContinuous._log_probs","logic":"静态方法：用 _distribution 对 states 构造 Normal，对 actions 求 log_prob 后在动作维 sum 并 keepdim，得到联合动作的 [B, 1] 对数概率。"},{"path":"08_PPO/Pendulum/agents.py","root":"08_PPO","idx":6,"kind":"方法","name":"PPOContinuous.update","logic":"把 transition_dict 的 states/actions（float 而非 long）/rewards/next_states/dones 转张量；按 (reward+shift)/scale 缩放奖励后计算 td_target 与 td_delta，经 rl_utils.compute_advantage 得 GAE 并 unsqueeze 成 [T,1]；记录 detach 的 old_log_probs 后循环 epochs 次，用 ratio 与 clamp 后的 surrogate 取 min 得 actor 损失、MSE 拟合 td_target 得 critic 损失，分别反向传播并 step。"},{"path":"08_PPO/Pendulum/config.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch，定义 ACTOR_LR=1e-4、CRITIC_LR=5e-3、NUM_EPISODES=2000、HIDDEN_DIM=128、GAMMA=0.9、LMBDA=0.9、EPOCHS=10、EPS=0.2、REWARD_SHIFT=8.0、REWARD_SCALE=8.0、SEED=0、ENV_NAME='Pendulum-v1'，并按 CUDA 可用性设置 DEVICE。"},{"path":"08_PPO/Pendulum/environment.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"仅导入 gymnasium 的 gym 模块，无模块级常量。"},{"path":"08_PPO/Pendulum/environment.py","root":"08_PPO","idx":1,"kind":"函数","name":"make_environment","logic":"用 gym.make(env_name) 创建环境，若 action_space 无 shape 或 shape 为 None 则抛 TypeError 提示需要 Box 动作空间；随后取 state_dim、action_dim，并复制 action_space.low/high 作为动作上下界，连同 env 一起返回。"},{"path":"08_PPO/Pendulum/main.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 random、numpy、torch，以及本地 config、PPOContinuous、make_environment、train_on_policy_agent、plot_training_results；无模块级常量。"},{"path":"08_PPO/Pendulum/main.py","root":"08_PPO","idx":1,"kind":"函数","name":"set_seed","logic":"依次设置 random、numpy、torch 的随机种子以保证实验可复现。"},{"path":"08_PPO/Pendulum/main.py","root":"08_PPO","idx":2,"kind":"函数","name":"main","logic":"设种子后调用 make_environment 取回 env、维度与 action_low/high，env.reset(seed=...) 后按 config 的超参数（含 REWARD_SHIFT、REWARD_SCALE）构造 PPOContinuous，训练 NUM_EPISODES 个 episode，绘制回报曲线并关闭环境。"},{"path":"08_PPO/Pendulum/main.py","root":"08_PPO","idx":3,"kind":"入口","name":"if __name__ == '__main__'","logic":"脚本直接运行时调用 main() 启动 Pendulum 的连续 PPO 训练。"},{"path":"08_PPO/Pendulum/networks.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch 与 torch.nn.functional，无模块级常量。"},{"path":"08_PPO/Pendulum/networks.py","root":"08_PPO","idx":1,"kind":"类","name":"PolicyNetContinuous","logic":"连续动作策略网络，输出正态分布的均值与标准差，并把 tanh 输出映射到环境动作区间。"},{"path":"08_PPO/Pendulum/networks.py","root":"08_PPO","idx":2,"kind":"方法","name":"PolicyNetContinuous.__init__","logic":"建立 fc1、fc_mu、fc_std 三个线性层，并把 action_low/high 换算成 register_buffer 的 action_scale=(high-low)/2 与 action_bias=(high+low)/2。"},{"path":"08_PPO/Pendulum/networks.py","root":"08_PPO","idx":3,"kind":"方法","name":"PolicyNetContinuous.forward","logic":"ReLU 过 fc1 得特征，均值 mu = bias + scale*tanh(fc_mu(features)) 落入动作区间，标准差 std = softplus(fc_std(features))+1e-5 保证为正，返回 (mu, std)。"},{"path":"08_PPO/Pendulum/networks.py","root":"08_PPO","idx":4,"kind":"类","name":"ValueNet","logic":"连续 PPO 使用的状态价值网络，只评价状态本身，输出 V(s)。"},{"path":"08_PPO/Pendulum/networks.py","root":"08_PPO","idx":5,"kind":"方法","name":"ValueNet.__init__","logic":"建立 state_dim→hidden_dim 的 fc1 与 hidden_dim→1 的 fc2。"},{"path":"08_PPO/Pendulum/networks.py","root":"08_PPO","idx":6,"kind":"方法","name":"ValueNet.forward","logic":"fc1 后接 ReLU 再经 fc2，返回形状 [B, 1] 的状态价值。"},{"path":"08_PPO/Pendulum/rl_utils.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 torch，无模块级常量。"},{"path":"08_PPO/Pendulum/rl_utils.py","root":"08_PPO","idx":1,"kind":"函数","name":"moving_average","logic":"将序列转为 float32 数组，长度不足 window_size 时直接返回；否则用 cumsum 差分求中段窗口均值，并用 radius 计算首尾不足窗口的均值，拼接成与原序列等长的平滑结果。"},{"path":"08_PPO/Pendulum/rl_utils.py","root":"08_PPO","idx":2,"kind":"函数","name":"compute_advantage","logic":"把 td_delta 展平为一维 numpy 数组，从末尾向前按 A[t]=td_delta[t]+gamma*lmbda*A[t+1] 递推，逆序后转成 float32 torch 张量返回形状 [T] 的优势序列。"},{"path":"08_PPO/Pendulum/trainer.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 tqdm 进度条，无模块级常量。"},{"path":"08_PPO/Pendulum/trainer.py","root":"08_PPO","idx":1,"kind":"函数","name":"train_on_policy_agent","logic":"对每个 episode 先 env.reset() 取 state，循环直到 terminated/truncated：agent.take_action 返回连续动作向量、env.step 得五元组，并把转移累积到 transition_dict；episode 结束后 agent.update 更新，记录 episode_return，每 10 个 episode 用 tqdm 显示最近 10 次平均回报，最后返回 return_list。"},{"path":"08_PPO/Pendulum/visualization.py","root":"08_PPO","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 matplotlib.pyplot 与 rl_utils.moving_average，无模块级常量。"},{"path":"08_PPO/Pendulum/visualization.py","root":"08_PPO","idx":1,"kind":"函数","name":"plot_training_results","logic":"在 1x2 子图中分别绘制逐 episode 的原始回报和 moving_average(return_list, 21) 的平滑回报，设置坐标轴标签与标题后 tight_layout 并 plt.show()。"},{"path":"09_DDPG/CartPole/agents.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy、torch 与 F，并从 networks 引入 Actor/Critic、从 noise 引入 NormalNoise/OUNoise；模块内无自定义常量。"},{"path":"09_DDPG/CartPole/agents.py","root":"09_DDPG","idx":1,"kind":"类","name":"DDPG","logic":"车杆任务的 DDPG 适配器类：actor 输出一维连续信号，由环境层再映射成左右两个离散动作。"},{"path":"09_DDPG/CartPole/agents.py","root":"09_DDPG","idx":2,"kind":"方法","name":"DDPG.__init__","logic":"接收状态/动作维度、动作上下界、学习率、gamma、tau 与噪声参数；构建 actor/critic 及各自 target 网络并复制参数，创建两个 Adam 优化器，按 noise_type 选择 OUNoise 或 NormalNoise，非法取值抛 ValueError。"},{"path":"09_DDPG/CartPole/agents.py","root":"09_DDPG","idx":3,"kind":"方法","name":"DDPG.reset_noise","logic":"每回合开始时调用噪声对象的 reset，清除 OU 噪声的历史状态。"},{"path":"09_DDPG/CartPole/agents.py","root":"09_DDPG","idx":4,"kind":"方法","name":"DDPG.take_action","logic":"把状态转成 (1, state_dim) 张量，no_grad 下经 actor 得到动作；explore 为真时叠加噪声采样，最后裁剪到 [-1, 1] 并返回 numpy 数组。"},{"path":"09_DDPG/CartPole/agents.py","root":"09_DDPG","idx":5,"kind":"方法","name":"DDPG.soft_update","logic":"对 target 与 online 网络的同名参数逐一对齐，执行 target = (1-tau)*target + tau*online 的原地软更新。"},{"path":"09_DDPG/CartPole/agents.py","root":"09_DDPG","idx":6,"kind":"方法","name":"DDPG.update","logic":"把回放批次转为张量，用 target_actor/target_critic 计算 q_targets = r + gamma*Q'*(1-done)；先以 MSE 更新 critic，再以 -mean(Q(s, actor(s))) 更新 actor，最后对两对网络各做一次软更新。"},{"path":"09_DDPG/CartPole/config.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch 后定义 actor_lr=3e-4、critic_lr=3e-3、NUM_EPISODES=500、HIDDEN_DIM=64、GAMMA=0.98、TAU=0.005、BUFFER_SIZE/MINIMAL_SIZE/BATCH_SIZE、NOISE_TYPE='normal'、NOISE_SIGMA、OU_THETA、SEED、ENV_NAME='CartPole-v1'，并按 CUDA 可用性选择 DEVICE。"},{"path":"09_DDPG/CartPole/environment.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 gymnasium；无模块级常量。"},{"path":"09_DDPG/CartPole/environment.py","root":"09_DDPG","idx":1,"kind":"函数","name":"make_environment","logic":"以 env_name 创建 gym 环境，校验动作空间为两个离散动作（否则 TypeError），返回 env、状态维度、动作维度 1 以及 [-1.0] / [1.0] 的动作上下界。"},{"path":"09_DDPG/CartPole/environment.py","root":"09_DDPG","idx":2,"kind":"函数","name":"continuous_to_discrete","logic":"取连续动作第一个分量，>=0 映射为 1，否则为 0，作为 CartPole 的左右推力动作。"},{"path":"09_DDPG/CartPole/main.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 random、numpy、torch 以及本目录的 config、DDPG、make_environment、ReplayBuffer、train_off_policy_agent、plot_training_results。"},{"path":"09_DDPG/CartPole/main.py","root":"09_DDPG","idx":1,"kind":"函数","name":"set_seed","logic":"同时设置 random、numpy 与 torch 的随机种子，保证实验可复现。"},{"path":"09_DDPG/CartPole/main.py","root":"09_DDPG","idx":2,"kind":"函数","name":"main","logic":"设定种子后创建 CartPole 环境，用 config 中的参数实例化 DDPG 与 ReplayBuffer，调用 train_off_policy_agent 得到每回合回报，随后绘图并关闭环境。"},{"path":"09_DDPG/CartPole/main.py","root":"09_DDPG","idx":3,"kind":"入口","name":"if __name__ == '__main__'","logic":"脚本直接运行时调用 main()。"},{"path":"09_DDPG/CartPole/networks.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch 与 torch.nn.functional 作为 F；无模块级常量。"},{"path":"09_DDPG/CartPole/networks.py","root":"09_DDPG","idx":1,"kind":"类","name":"Actor","logic":"确定性策略网络，输出映射到动作上下界之间的连续动作。"},{"path":"09_DDPG/CartPole/networks.py","root":"09_DDPG","idx":2,"kind":"方法","name":"Actor.__init__","logic":"构建两层全连接（state_dim→hidden_dim→len(action_low)），并把动作缩放 (high-low)/2 与偏移 (high+low)/2 注册为 buffer。"},{"path":"09_DDPG/CartPole/networks.py","root":"09_DDPG","idx":3,"kind":"方法","name":"Actor.forward","logic":"对状态做 ReLU 隐层后接 tanh 得到 [-1,1] 输出，再按 action_bias + action_scale*tanh 映射到动作区间。"},{"path":"09_DDPG/CartPole/networks.py","root":"09_DDPG","idx":4,"kind":"类","name":"Critic","logic":"Q(s,a) 价值网络，接收状态与动作并输出标量价值。"},{"path":"09_DDPG/CartPole/networks.py","root":"09_DDPG","idx":5,"kind":"方法","name":"Critic.__init__","logic":"第一层输入维度为 state_dim+action_dim，第二层为 hidden_dim→hidden_dim，最后 fc_out 输出 1 维。"},{"path":"09_DDPG/CartPole/networks.py","root":"09_DDPG","idx":6,"kind":"方法","name":"Critic.forward","logic":"沿特征维拼接状态与动作，经过两层 ReLU 隐层后由 fc_out 返回 Q 值。"},{"path":"09_DDPG/CartPole/noise.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"仅导入 numpy；无模块级常量。"},{"path":"09_DDPG/CartPole/noise.py","root":"09_DDPG","idx":1,"kind":"类","name":"NormalNoise","logic":"每一步独立采样的高斯噪声生成器。"},{"path":"09_DDPG/CartPole/noise.py","root":"09_DDPG","idx":2,"kind":"方法","name":"NormalNoise.__init__","logic":"保存动作维度和噪声标准差 sigma。"},{"path":"09_DDPG/CartPole/noise.py","root":"09_DDPG","idx":3,"kind":"方法","name":"NormalNoise.reset","logic":"空实现，仅为与其他噪声类保持统一接口。"},{"path":"09_DDPG/CartPole/noise.py","root":"09_DDPG","idx":4,"kind":"方法","name":"NormalNoise.sample","logic":"返回 sigma * randn(action_dim) 的独立高斯噪声向量。"},{"path":"09_DDPG/CartPole/noise.py","root":"09_DDPG","idx":5,"kind":"类","name":"OUNoise","logic":"带时间相关性的 Ornstein-Uhlenbeck 噪声，维护跨步的噪声状态。"},{"path":"09_DDPG/CartPole/noise.py","root":"09_DDPG","idx":6,"kind":"方法","name":"OUNoise.__init__","logic":"保存 action_dim、sigma、theta、mu，并把内部状态初始化为零向量。"},{"path":"09_DDPG/CartPole/noise.py","root":"09_DDPG","idx":7,"kind":"方法","name":"OUNoise.reset","logic":"将内部状态原地清零，用于每回合重新开始。"},{"path":"09_DDPG/CartPole/noise.py","root":"09_DDPG","idx":8,"kind":"方法","name":"OUNoise.sample","logic":"按 state += theta*(mu-state) + sigma*randn 更新噪声状态，并返回其副本。"},{"path":"09_DDPG/CartPole/rl_utils.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 collections、random 与 numpy；无模块级常量。"},{"path":"09_DDPG/CartPole/rl_utils.py","root":"09_DDPG","idx":1,"kind":"类","name":"ReplayBuffer","logic":"基于 deque 的定长 off-policy 经验回放池。"},{"path":"09_DDPG/CartPole/rl_utils.py","root" ,"logic":"设置种子并创建 Pendulum 环境，再用 seed 重置一次；用 config 参数构造 DDPG 和 ReplayBuffer，调用 train_off_policy_agent 获得回报列表，绘制结果后关闭环境。"},{"path":"09_DDPG/Pendulum/main.py","root":"09_DDPG","idx":3,"kind":"入口","name":"if __name__ == '__main__'","logic":"脚本直接执行时调用 main()。"},{"path":"09_DDPG/Pendulum/networks.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch 与 torch.nn.functional；无模块级常量。"},{"path":"09_DDPG/Pendulum/networks.py","root":"09_DDPG","idx":1,"kind":"类","name":"Actor","logic":"确定性策略 mu(s)，输出环境动作范围内的连续动作。"},{"path":"09_DDPG/Pendulum/networks.py","root":"09_DDPG","idx":2,"kind":"方法","name":"Actor.__init__","logic":"构造 state_dim→hidden_dim→len(action_low) 的两层网络，并将动作缩放与偏移注册为 buffer 以便随设备迁移。"},{"path":"09_DDPG/Pendulum/networks.py","root":"09_DDPG","idx":3,"kind":"方法","name":"Actor.forward","logic":"ReLU 隐层后接 tanh 限幅到 [-1,1]，再经 action_bias + action_scale*tanh 映射到动作区间。"},{"path":"09_DDPG/Pendulum/networks.py","root":"09_DDPG","idx":4,"kind":"类","name":"Critic","logic":"Q(s,a) 网络，同时接收状态与动作并输出标量价值。"},{"path":"09_DDPG/Pendulum/networks.py","root":"09_DDPG","idx":5,"kind":"方法","name":"Critic.__init__","logic":"三层全连接：state_dim+action_dim→hidden_dim、hidden_dim→hidden_dim、hidden_dim→1。"},{"path":"09_DDPG/Pendulum/networks.py","root":"09_DDPG","idx":6,"kind":"方法","name":"Critic.forward","logic":"拼接状态与动作后过两层 ReLU 隐层，由 fc_out 输出每个状态-动作对的 Q 值。"},{"path":"09_DDPG/Pendulum/noise.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"仅导入 numpy；无模块级常量。"},{"path":"09_DDPG/Pendulum/noise.py","root":"09_DDPG","idx":1,"kind":"类","name":"NormalNoise","logic":"逐步独立重采样的高斯探索噪声。"},{"path":"09_DDPG/Pendulum/noise.py","root":"09_DDPG","idx":2,"kind":"方法","name":"NormalNoise.__init__","logic":"保存动作维度与标准差 sigma。"},{"path":"09_DDPG/Pendulum/noise.py","root":"09_DDPG","idx":3,"kind":"方法","name":"NormalNoise.reset","logic":"空实现，仅为统一接口，因为高斯噪声无跨时间状态。"},{"path":"09_DDPG/Pendulum/noise.py","root":"09_DDPG","idx":4,"kind":"方法","name":"NormalNoise.sample","logic":"返回 sigma * randn(action_dim) 的噪声向量。"},{"path":"09_DDPG/Pendulum/noise.py","root":"09_DDPG","idx":5,"kind":"类","name":"OUNoise","logic":"Ornstein-Uhlenbeck 噪声，按文档字符串中的递推式产生时间相关的探索扰动。"},{"path":"09_DDPG/Pendulum/noise.py","root":"09_DDPG","idx":6,"kind":"方法","name":"OUNoise.__init__","logic":"保存 action_dim、sigma、theta、mu，并把内部噪声状态初始化为零向量。"},{"path":"09_DDPG/Pendulum/noise.py","root":"09_DDPG","idx":7,"kind":"方法","name":"OUNoise.reset","logic":"每回合开始时把内部状态填零，清除上一条轨迹的噪声。"},{"path":"09_DDPG/Pendulum/noise.py","root":"09_DDPG","idx":8,"kind":"方法","name":"OUNoise.sample","logic":"计算漂移 theta*(mu-state) 与随机项 sigma*randn，更新 state 后返回其副本。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 random、gym、numpy、tqdm、torch 及其 nn/F、matplotlib.pyplot 以及本目录的 rl_utils；无模块级常量定义（常量集中在文件末尾）。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":1,"kind":"类","name":"PolicyNet","logic":"确定性策略网络，用 tanh 乘以 action_bound 输出有界动作。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":2,"kind":"方法","name":"PolicyNet.__init__","logic":"构建 state_dim→hidden_dim→action_dim 的两层全连接，并保存标量 action_bound 作为动作最大值。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":3,"kind":"方法","name":"PolicyNet.forward","logic":"ReLU 隐层后接 tanh 并乘以 action_bound，返回环境可接受的连续动作。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":4,"kind":"类","name":"QValueNet","logic":"状态-动作价值网络，输出标量 Q 值。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":5,"kind":"方法","name":"QValueNet.__init__","logic":"构造输入维度 state_dim+action_dim 的三层全连接网络，末端输出 1 维。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":6,"kind":"方法","name":"QValueNet.forward","logic":"沿特征维拼接状态 x 与动作 a，经两层 ReLU 后由 fc_out 输出 Q 值。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":7,"kind":"类","name":"DDPG","logic":"练习用 DDPG 智能体，内含 actor/critic 及 target 网络、双优化器与噪声探索逻辑。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":8,"kind":"方法","name":"DDPG.__init__","logic":"创建 PolicyNet/QValueNet 与其 target 副本并复制参数，建立两个 Adam 优化器，保存 gamma、sigma、tau、action_dim 与 device。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":9,"kind":"方法","name":"DDPG.take_action","logic":"把状态包成 (1, state_dim) 张量前向 actor 取标量动作，再叠加 sigma*randn 的高斯噪声用于探索，返回 numpy 标量。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":10,"kind":"方法","name":"DDPG.soft_update","logic":"逐个参数执行 target = (1-tau)*target + tau*online 的软更新。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":11,"kind":"方法","name":"DDPG.update","logic":"从 transition_dict 取五类数据并整理形状，用 target 网络计算 q_targets；先 MSE 更新 critic，再以 -mean(Q(s,actor(s))) 更新 actor，最后对 actor/critic 的 target 网络各做软更新。"},{"path":"09_DDPG/Pendulum/practice.py","root":"09_DDPG","idx":12,"kind":"导入与常量","name":"模块级常量与脚本初始化","logic":"定义 actor_lr、critic_lr、num_episodes、hidden_dim、gamma、tau、buffer_size、minimal_size、batch_size、sigma 与 device；随后创建 Pendulum-v0 环境、设置各库种子、构建回放池与 agent，并直接调用 rl_utils.train_off_policy_agent 执行训练（文件无 __main__ 保护）。"},{"path":"09_DDPG/Pendulum/rl_utils.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 collections、random 与 numpy；无模块级常量。"},{"path":"09_DDPG/Pendulum/rl_utils.py","root":"09_DDPG","idx":1,"kind":"类","name":"ReplayBuffer","logic":"基于 deque 的 off-policy 经验回放池。"},{"path":"09_DDPG/Pendulum/rl_utils.py","root":"09_DDPG","idx":2,"kind":"方法","name":"ReplayBuffer.__init__","logic":"以 capacity 作为 maxlen 创建 deque 存储。"},{"path":"09_DDPG/Pendulum/rl_utils.py","root":"09_DDPG","idx":3,"kind":"方法","name":"ReplayBuffer.add","logic":"追加一条 (state, action, reward, next_state, done) 转移，满容量时自动淘汰最旧数据。"},{"path":"09_DDPG/Pendulum/rl_utils.py","root":"09_DDPG","idx":4,"kind":"方法","name":"ReplayBuffer.sample","logic":"随机无放回抽取 batch_size 条转移，拆包后转换为五个 numpy 数组返回。"},{"path":"09_DDPG/Pendulum/rl_utils.py","root":"09_DDPG","idx":5,"kind":"方法","name":"ReplayBuffer.size","logic":"返回缓冲区当前样本数。"},{"path":"09_DDPG/Pendulum/rl_utils.py","root":"09_DDPG","idx":6,"kind":"函数","name":"moving_average","logic":"序列长度不足 window_size 时原样返回；否则用累积和计算中间段均值，并分别计算开头与结尾的逐步平均后拼接为完整序列。"},{"path":"09_DDPG/Pendulum/trainer.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 tqdm 进度条；无模块级常量。"},{"path":"09_DDPG/Pendulum/trainer.py","root":"09_DDPG","idx":1,"kind":"函数","name":"train_off_policy_agent","logic":"按 num_episodes 循环，每回合先 agent.reset_noise 并按 seed+episode 重置环境；内层用 take_action 采样连续动作执行 env.step，把 terminated（而非 truncated）作为 done 存入回放池以便截断处继续 bootstrap，缓冲区达到 minimal_size 后每步采样并调用 agent.update，最终返回每回合回报列表并用 tqdm 显示最近十回合均值。"},{"path":"09_DDPG/Pendulum/visualization.py","root":"09_DDPG","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 matplotlib.pyplot 与 rl_utils.moving_average。"},{"path":"09_DDPG/Pendulum/visualization.py","root":"09_DDPG","idx":1,"kind":"函数","name":"plot_training_results","logic":"建立 1x2 子图分别绘制每回合回报与 window_size 窗口的滑动平均，设置坐标轴标签与标题后 tight_layout 并 show。"},{"path":"10_TD3/Pendulum/agents.py","root":"10_TD3","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy、torch 和 torch.nn.functional，并从 networks 引入 Actor/Critic、从 noise 引入 GaussianNoise 与 smooth_target_action；模块内无常量定义。"},{"path":"10_TD3/Pendulum/agents.py","root":"10_TD3","idx":1,"kind":"类","name":"TD3","logic":"封装 actor、target_actor、两个 online critic、两个 target critic、三个 Adam 优化器、动作边界与延迟更新计数，对外提供动作选择、target 计算和批量更新接口。"},{"path":"10_TD3/Pendulum/agents.py","root":"10_TD3","idx":2,"kind":"方法","name":"TD3.__init__","logic":"按 state_dim/hidden_dim/action_dim 构建 Actor 与两套 Critic，并把 online 参数复制给 target；创建三个 Adam 优化器，保存 gamma、tau、policy_delay、target_noise、noise_clip，把动作上下界转成设备上的张量并计算半幅 action_scale。"},{"path":"10_TD3/Pendulum/agents.py","root":"10_TD3","idx":3,"kind":"方法","name":"TD3.reset_noise","logic":"调用 GaussianNoise.reset()；高斯噪声没有历史状态，该接口只是与 DDPG 的训练循环保持统一。"},{"path":"10_TD3/Pendulum/agents.py","root":"10_TD3","idx":4,"kind":"方法","name":"TD3.take_action","logic":"把状态转成 [1, state_dim] 张量送入 actor 得到确定性动作；explore=True 时叠加一次高斯噪声采样，最后把动作裁剪到 [action_low, action_high] 并返回 NumPy 数组。"},{"path":"10_TD3/Pendulum/agents.py","root":"10_TD3","idx":5,"kind":"方法","name":"TD3.soft_update","logic":"对 online_net 与 target_net 的参数逐对执行 Polyak 平均 target ← (1-tau)·target + tau·online，使用 data 原地运算以避免把 target 纳入计算图。"},{"path":"10_TD3/Pendulum/agents.py","root":"10_TD3","idx":6,"kind":"方法","name":"TD3.calc_target","logic":"在 no_grad 下由 target_actor 给出下一状态动作，经 smooth_target_action 加截断噪声，再用两个 target critic 的较小 Q 值计算 r + gamma·(1-done)·min(Q1',Q2')。"},{"path":"10_TD3/Pendulum/agents.py","root":"10_TD3","idx":7,"kind":"方法","name":"TD3.update","logic":"先把 batch 转成张量，用共享的 clipped double-Q target 对两个 critic 各做 MSE 回归并分别 backward/step；每 policy_delay 次调用再临时冻结 critic，以 -Q1(s,actor(s)).mean() 更新 actor，随后软更新 actor 与两个 critic 的 target，返回 critic_loss 和 actor_loss。"},{"path":"10_TD3/Pendulum/config.py","root":"10_TD3","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"仅导入 torch，然后定义 actor/critic 学习率 1e-3、200 个 episode、隐藏层 128、gamma 0.99、tau 0.005、policy_delay 2、target_noise 0.2 与 noise_clip 0.5、探索噪声 0.1、buffer 10 万与 batch 100、评估 20 回合及评估种子 10000，并给出 SEED、ENV_NAME='Pendulum-v1' 与自动选择 cuda/cpu 的 DEVICE。"},{"path":"10_TD3/Pendulum/environment.py","root":"10_TD3","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 gymnasium，无模块级常量。"},{"path":"10_TD3/Pendulum/environment.py","root":"10_TD3","idx":1,"kind":"函数","name":"make_environment","logic":"调用 gym.make 创建环境，若 action_space 不是 gym.spaces.Box 则抛出 TypeError；否则读取 observation/action 维度，并用 copy() 返回动作下界与上界，防止后续原地修改影响环境本身。"},{"path":"10_TD3/Pendulum/main.py","root":"10_TD3","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 random、numpy、torch、config，以及本目录的 TD3、make_environment、ReplayBuffer、evaluate_policy、train_off_policy_agent 和 plot_training_results。"},{"path":"10_TD3/Pendulum/main.py","root":"10_TD3","idx":1,"kind":"函数","name":"set_seed","logic":"分别调用 random.seed、np.random.seed 和 torch.manual_seed 固定同一随机种子，保证实验可复现。"},{"path":"10_TD3/Pendulum/main.py","root":"10_TD3","idx":2,"kind":"函数","name":"main","logic":"设置种子并创建环境，按 config 参数实例化 TD3 与 ReplayBuffer；调用 train_off_policy_agent 得到每回合回报，再用 evaluate_policy 以独立评估种子跑 20 回合，打印最后 10 回合均值与评估统计，最后绘图并 env.close()。"},{"path":"10_TD3/Pendulum/main.py","root":"10_TD3","idx":3,"kind":"入口","name":"if __name__ == '__main__'","logic":"脚本直接运行时调用 main()。"},{"path":"10_TD3/Pendulum/networks.py","root":"10_TD3","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 torch 与 torch.nn.functional，无模块级常量。"},{"path":"10_TD3/Pendulum/networks.py","root":"10_TD3","idx":1,"kind":"类","name":"Actor","logic":"确定性策略 mu(s)：两层 128 维隐藏层后经 tanh 压缩到 [-1,1]，再用注册为 buffer 的 action_scale/action_bias 映射到环境动作范围。"},{"path":"10_TD3/Pendulum/networks.py","root":"10_TD3","idx":2,"kind":"方法","name":"Actor.__init__","logic":"按 state_dim→hidden_dim→hidden_dim→action_dim 建立三层线性网络，并把 (high-low)/2 与 (high+low)/2 用 register_buffer 保存，使其随 to(device) 迁移且不参与训练。"},{"path":"10_TD3/Pendulum/networks.py","root":"10_TD3","idx":3,"kind":"方法","name":"Actor.forward","logic":"输入状态依次经过 fc1、fc2 的 ReLU 和 fc_out，再取 tanh 得到 [-1,1] 动作，返回 action_bias + action_scale * squashed。"},{"path":"10_TD3/Pendulum/networks.py","root":"10_TD3","idx":4,"kind":"类","name":"Critic","logic":"Q(s,a) 网络，把状态与动作拼接后经两层隐藏层输出一个标量 Q 值；TD3 会独立实例化两个这样的网络作为 Q1/Q2。"},{"path":"10_TD3/Pendulum/networks.py","root":"10_TD3","idx":5,"kind":"方法","name":"Critic.__init__","logic":"第一层输入维度为 state_dim + action_dim，第二层保持 hidden_dim，输出层为 1 维。"},{"path":"10_TD3/Pendulum/networks.py","root":"10_TD3","idx":6,"kind":"方法","name":"Critic.forward","logic":"沿第 1 维拼接 states 与 actions，经 ReLU(fc1)、ReLU(fc2) 后由 fc_out 输出形状 [batch_size, 1] 的 Q 值。"},{"path":"10_TD3/Pendulum/noise.py","root":"10_TD3","idx":0,"kind":"导入与常量","name":"导入与常量","logic":"导入 numpy 与 torch，无模块级常量。"},{"path":"10_TD3/Pendulum/noise.py","root":"10_TD3","idx":1,"kind":"类","name":"GaussianNoise","logic":"无状态的高斯探索噪声：每步按 sigma 重新采样，配合确定性 actor 形成行为策略。"},{"path":"10_TD3/Pendulum/noise.py","root":"10_TD3","idx":2,"kind":"方法","name":"GaussianNoise.__init__","logic":"保存动作维度 action_dim 与噪声标准差 s
